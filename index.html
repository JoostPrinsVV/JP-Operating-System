/* ---- working hours ------------------------------------------------------
   The running timer lives in DB, not in memory, so closing the tab or
   reloading does not lose it: we store when it started and derive the rest.
------------------------------------------------------------------------- */
/* A session is banked time plus the segment that is running right now, so a
   pause never loses what you already clocked. `startedAt` stays the original
   start - it decides which day the entry lands on. */
const timerMs = () => {
  const t = DB.timer;
  if (!t) return 0;
  return (t.accumulatedMs || 0) +
    (t.runningSince ? Date.now() - new Date(t.runningSince).getTime() : 0);
};
const timerMinutes = () => Math.round(timerMs() / 60000);
const timerPaused = () => Boolean(DB.timer) && !DB.timer.runningSince;

function pauseTimer() {
  const t = DB.timer;
  if (!t || !t.runningSince) return;
  t.accumulatedMs = (t.accumulatedMs || 0) + (Date.now() - new Date(t.runningSince).getTime());
  t.runningSince = null;
  save(); render(); toast(tr("h_paused_t"));
}
function resumeTimer() {
  const t = DB.timer;
  if (!t || t.runningSince) return;
  t.runningSince = new Date().toISOString();
  save(); render(); toast(tr("h_resumed_t"));
}

function fmtHMS(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${pad2(Math.floor(s / 3600))}:${pad2(Math.floor(s / 60) % 60)}:${pad2(s % 60)}`;
}
/* Decimal hours, the unit time gets written in. */
const fmtH = (minutes) => `${num(Math.round((minutes / 60) * 10) / 10, 1)}${LANG === "nl" ? "u" : "h"}`;
const roundTenth = (minutes) => Math.round((minutes / 60) * 10) / 10;

/* Timestamps are stored in UTC, so the clock has to come off a Date rather
   than off the ISO string — slicing it would show the wrong hour. */
function clock(stamp) {
  if (!stamp) return "";
  const d = new Date(stamp);
  return isNaN(d.getTime()) ? "" : `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
/* The reverse: a wall-clock time on a given day, stored the way the timer
   stores it. Used by the hand-booked entries. */
function stampAt(day, hhmm, addMinutes = 0) {
  if (!day || !hhmm) return "";
  const [y, mo, d] = String(day).split("-").map(Number);
  const [h, mi] = String(hhmm).split(":").map(Number);
  if ([y, mo, d, h, mi].some((n) => !Number.isFinite(n))) return "";
  return new Date(y, mo - 1, d, h, mi + addMinutes, 0, 0).toISOString();
}

/* ---- appointment to booking ---------------------------------------------
   An appointment already knows the date, the start, the end and who it was
   with. Retyping that into a booking is the kind of work a computer should
   not leave to you.
------------------------------------------------------------------------- */
const meetingBooked = (id) => DB.timeEntries.some((e) => e.meetingId === id);

/* Longest client name that occurs in the title, location or attendees wins,
   so "Van Dijk Holding" is not beaten by a client called "Dijk". */
function guessClient(m) {
  const hay = `${m.title || ""} ${m.location || ""} ${(m.attendees || []).map(attName).join(" ")}`.toLowerCase();
  let best = null;
  DB.clients.forEach((c) => {
    const n = String(c.name || "").trim().toLowerCase();
    if (n.length < 3 || !hay.includes(n)) return;
    if (!best || n.length > best.name.trim().length) best = c;
  });
  return best;
}

/* The scheduled length, which is what you were actually occupied for. An
   appointment with no end is treated as an hour. */
function meetingMinutes(m) {
  const a = Date.parse(m.startsAt), b = Date.parse(m.endsAt || "");
  if (isNaN(a) || isNaN(b) || b <= a) return 60;
  return Math.min(16 * 60, Math.round((b - a) / 60000));
}

/* The kind of appointment already says something about the kind of work; a
   client name only tells you it was client work. Both are a first guess you
   can change before saving. */
function bookEngagement(m, client) {
  if (m.kind === "training" || m.kind === "workshop") return "training";
  return client ? "interim" : "intern";
}

function bookMeeting(id) {
  const m = DB.meetings.find((x) => x.id === id);
  if (!m) return;
  if (meetingBooked(id)) { toast(tr("h_book_already")); return; }
  const c = guessClient(m);
  entryDialog(null, {
    dialogTitle: tr("h_book_t"),
    meetingId: m.id,
    date: m.startsAt.slice(0, 10),
    startedAt: m.startsAt,
    minutes: meetingMinutes(m),
    pauseMinutes: 0,
    description: m.title,
    clientId: c ? c.id : "",
    // A meeting with a client is billable by default, an internal one is not.
    billable: Boolean(c),
    engagement: bookEngagement(m, c),
  });
}

/* Appointments in the week on screen that are over and not yet booked. This
   is the list you work down on a Friday afternoon. */
function unbookedMeetings(monday) {
  const days = weekDays(monday);
  const now = Date.now();
  return DB.meetings
    .filter((m) => {
      const day = String(m.startsAt || "").slice(0, 10);
      if (day < days[0] || day > days[6] || meetingBooked(m.id)) return false;
      /* Parsed rather than compared as text: an appointment is stored as wall
         clock time, and measuring that against a UTC clock would hold a
         meeting "upcoming" for another two hours in summer. */
      const t = Date.parse(m.startsAt);
      return !isNaN(t) && t <= now;
    })
    .sort((a, b) => a.startsAt.localeCompare(b.startsAt));
}

/* Reads the start row straight from the DOM, so there is no form submit in
   the path. An unknown client or engagement name is created on the spot. */
function startTimerFromForm() {
  const desc = ($("#t-desc")?.value || "").trim();
  const clientTxt = ($("#t-client")?.value || "").trim();
  const engTxt = ($("#t-eng")?.value || "").trim();
  const billable = Boolean($("#t-bill")?.checked);

  if (!desc && !clientTxt) { toast(tr("h_needdesc")); $("#t-desc")?.focus(); return; }

  const clientId = resolveClient(clientTxt);
  const engagement = resolveEngagement(engTxt);
  startTimer({ description: desc, clientId, engagement, billable });
}

function startTimer({ description, clientId, engagement, billable }) {
  const now = new Date().toISOString();
  DB.timer = {
    startedAt: now, runningSince: now, accumulatedMs: 0,
    description: description || "", clientId: clientId || null,
    engagement: engagement || "intern", billable: billable !== false,
  };
  save(); render(); toast(tr("h_started"));
}
function stopTimer(discard) {
  if (!DB.timer) return;
  const t = DB.timer, mins = timerMinutes();
  DB.timer = null;

  if (discard) { save(); render(); toast(tr("h_discarded")); return; }
  if (mins < 1) { save(); render(); toast(tr("h_toosmall")); return; }

  /* Whatever sits between the first start and the stop but was not counted is
     pause, by definition — so gross, pause and net always add up in the
     export instead of being three separately maintained numbers. */
  const endedAt = new Date().toISOString();
  const spanMin = Math.round((Date.parse(endedAt) - Date.parse(t.startedAt)) / 60000);

  DB.timeEntries.push({
    id: uid(), date: iso(new Date(t.startedAt)), clientId: t.clientId,
    engagement: t.engagement, description: t.description, minutes: mins,
    startedAt: t.startedAt, endedAt, pauseMinutes: Math.max(0, spanMin - mins),
    billable: t.billable, createdAt: new Date().toISOString(),
  });
  save(); render(); toast(tr("h_stopped", fmtH(mins)));
}

/* One interval for the whole app; it only repaints the pill, never the page. */
let tickHandle = null, tickCount = 0;

/* Countdown badges go stale on their own; refresh them without re-rendering
   the page, so nothing you are looking at jumps. */
function refreshCountdowns() {
  document.querySelectorAll("[data-when]").forEach((el) => {
    const rel = relWhen(el.dataset.when, el.dataset.end || "");
    if (!rel) { el.remove(); return; }
    el.textContent = rel.text;
    el.className = `badge ${rel.tone}`;
  });
}
function paintTimerPill() {
  const host = $("#timer-pill");
  if (!host) return;
  if (!DB.timer || !viewOn("hours")) { host.hidden = true; host.innerHTML = ""; return; }

  const c = clientOf(DB.timer.clientId);
  const label = DB.timer.description || (c ? c.name : tr("h_noclient"));
  const longRun = timerMs() > 8 * 3600e3;
  const paused = timerPaused();

  host.hidden = false;
  host.classList.toggle("paused", paused);
  host.innerHTML = `
    <button class="pill-main" data-nav="hours" title="${esc(tr("h_open_tab"))}">
      <span class="pill-dot" style="background:${paused ? "var(--ink-3)" : (c ? slotColor(c.slot) : "var(--c2)")}"></span>
      <span class="pill-txt">${esc(truncate(label, 28))}</span>
      <span class="pill-time tab">${fmtHMS(timerMs())}</span>
      ${paused ? `<span class="pill-flag">${esc(tr("h_paused"))}</span>` : ""}
    </button>
    <button class="pill-btn" data-act="${paused ? "timer-resume" : "timer-pause"}"
      aria-label="${esc(paused ? tr("h_resume") : tr("h_pause"))}"
      title="${esc(paused ? tr("h_resume") : tr("h_pause"))}">${ico(paused ? "play" : "pause", "", 12)}</button>
    <button class="pill-stop" data-act="timer-stop" aria-label="${esc(tr("h_stop"))}"
      title="${esc(tr("h_stop"))}">${ico("stop", "", 13)}</button>
    ${longRun ? `<span class="pill-warn" title="${esc(tr("h_forgot"))}">${ico("alert", "", 13)}</span>` : ""}`;
}
function startTick() {
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(() => {
    // Minutes move slowly; a quarter-minute is plenty for a countdown.
    if (++tickCount % 15 === 0) refreshCountdowns();

    if (!DB.timer || timerPaused()) return;   // a held clock has nothing to repaint
    const el = $("#timer-pill .pill-time");
    if (el) el.textContent = fmtHMS(timerMs());
    const live = $("#timer-live");
    if (live) live.textContent = fmtHMS(timerMs());
  }, 1000);
}

/* ---- working hours view ------------------------------------------------ */
const weekDays = (monday) => Array.from({ length: 7 }, (_, i) => {
  const d = parseD(monday); d.setDate(d.getDate() + i); return iso(d);
});
const entriesOn = (date) => DB.timeEntries.filter((e) => e.date === date);
const minutesOn = (date) => entriesOn(date).reduce((s, e) => s + e.minutes, 0);

function viewHours() {
  const hf = UI.hoursFilter;
  const monday = hf.week || mondayOf();
  const days = weekDays(monday);
  const inWeek = DB.timeEntries.filter((e) => e.date >= days[0] && e.date <= days[6]);
  const shown = hf.client === "all" ? inWeek : inWeek.filter((e) => e.clientId === hf.client);

  const weekMin = inWeek.reduce((s, e) => s + e.minutes, 0);
  const todayMin = minutesOn(TODAY());
  const billMin = inWeek.filter((e) => e.billable).reduce((s, e) => s + e.minutes, 0);
  const billPct = weekMin ? Math.round((billMin / weekMin) * 100) : 0;
  const cap = DB.profile.capacity || 36;

  /* Per client, this week. */
  const perClient = DB.clients.map((c) => ({
    c, min: inWeek.filter((e) => e.clientId === c.id).reduce((s, e) => s + e.minutes, 0),
  })).filter((x) => x.min > 0).sort((a, b) => b.min - a.min);
  const internalMin = inWeek.filter((e) => !e.clientId).reduce((s, e) => s + e.minutes, 0);
  const maxClient = Math.max(1, ...perClient.map((x) => x.min), internalMin);

  /* Planned hours for this week, from Mijn planning. */
  const plan = DB.planning.find((p) => p.week === monday);
  const planned = plan ? plan.hours : null;

  const dayPoints = days.slice(0, 5).map((d, i) => ({
    label: WEEKDAYS[i], value: Math.round((minutesOn(d) / 60) * 10) / 10,
  }));

  const wkLabel = `${tr("h_wk")} ${isoWeekNo(monday)}`;
  const isThisWeek = monday === mondayOf();

  return pageHead(tr("nav_hours"), tr("h_sub"),
    `<button class="btn sm outline" data-act="add-entry">${ico("plus")} ${esc(tr("h_addentry"))}</button>
     <button class="btn sm outline" data-act="new-client">${ico("building")} ${esc(tr("h_newclient"))}</button>
     <button class="btn sm" data-act="export-hours">${ico("sheet")} ${esc(tr("h_excel"))}</button>`) +

  timerCard() +

  `<div class="tiles" style="margin:16px 0">
    ${tile(tr("h_today"), fmtH(todayMin), "", "", "clock", "var(--c1)")}
    ${tile(tr("h_week"), fmtH(weekMin), "", tr("h_vs_cap", cap), "hours",
      weekMin / 60 > cap ? "var(--warning)" : "var(--c4)")}
    ${tile(tr("h_billable_share"), `${billPct}%`, "", fmtH(billMin), "building", "var(--c3)")}
    ${planned !== null
      ? tile(tr("h_vs"), `${fmtH(weekMin)} / ${planned}${LANG === "nl" ? "u" : "h"}`, "",
          tr("h_vs_d"), "planning", "var(--c5)")
      : tile(tr("h_entries"), inWeek.length, "", "", "tasks", "var(--c5)")}
  </div>

  <div class="row wrap" style="gap:8px;margin-bottom:14px">
    <div class="row" style="gap:4px">
      <button class="btn icon sm outline" data-act="hours-week" data-v="prev"
        aria-label="${esc(tr("h_prevweek"))}">‹</button>
      <button class="btn sm outline" data-act="hours-week" data-v="now"
        ${isThisWeek ? 'aria-pressed="true"' : ""}>${esc(tr("h_thisweek"))}</button>
      <button class="btn icon sm outline" data-act="hours-week" data-v="next"
        aria-label="${esc(tr("h_nextweek"))}">›</button>
    </div>
    <b style="font-size:13px">${esc(wkLabel)} · ${parseD(days[0]).getDate()} ${MONTHS[parseD(days[0]).getMonth()].toLowerCase()} – ${parseD(days[6]).getDate()} ${MONTHS[parseD(days[6]).getMonth()].toLowerCase()}</b>
    ${hf.client !== "all" ? `<span class="chip">${esc(truncate(clientOf(hf.client)?.name || "", 28))}
      <button type="button" data-act="hours-client" data-v="all" aria-label="${esc(tr("filter_clear"))}">${ico("close", "", 11)}</button></span>` : ""}
    <span class="xs mut" style="margin-left:auto">${shown.length} ${esc(shown.length === 1 ? tr("h_entry") : tr("h_entries"))} · ${esc(fmtH(shown.reduce((s, e) => s + e.minutes, 0)))}</span>
  </div>

  <div class="grid cols2" style="margin-bottom:16px">
    ${card(tr("h_perday"),
      `<p class="legend" style="margin-bottom:6px"><span><i style="background:var(--c1)"></i>${esc(tr("nav_hours"))}</span></p>` +
      seriesChart({ points: dayPoints, color: "var(--c1)", unit: LANG === "nl" ? "u" : "h",
        type: "bar", h: 150, target: Math.round((cap / 5) * 10) / 10 }), tr("h_perday_d"))}

    ${card(tr("h_perclient"), (perClient.length || internalMin) ? `<ul class="grid" style="gap:4px">
      ${perClient.map(({ c, min }) => `<li><button class="tsk-t" data-act="hours-client" data-v="${c.id}"
          aria-pressed="${hf.client === c.id}" style="padding:5px 6px;border-radius:9px">
        <span class="row spread" style="align-items:baseline;gap:8px">
          <span class="sm2 trunc"><span class="wk-dot" style="background:${slotColor(c.slot)};display:inline-block;margin-right:7px"></span>${esc(c.name)}</span>
          <span class="xs tab mut">${esc(fmtH(min))}</span></span>
        <span style="display:block;margin-top:5px">${meterEl((min / maxClient) * 100, slotColor(c.slot))}</span>
      </button></li>`).join("")}
      ${internalMin ? `<li style="padding:5px 6px">
        <span class="row spread" style="align-items:baseline;gap:8px">
          <span class="sm2 trunc"><span class="wk-dot" style="background:var(--axis);display:inline-block;margin-right:7px"></span>${esc(tr("h_noclient"))}</span>
          <span class="xs tab mut">${esc(fmtH(internalMin))}</span></span>
        <span style="display:block;margin-top:5px">${meterEl((internalMin / maxClient) * 100, "var(--axis)")}</span></li>` : ""}
    </ul>` : empty(tr("h_noentries")), tr("h_perclient_d"))}
  </div>

  ${(() => {
    /* The appointments you sat in but have not written away yet. Booking from
       here beats retyping a time you already agreed to in your calendar. */
    const todo = unbookedMeetings(monday);
    if (!todo.length) return "";
    return card(tr("h_book_card"), `<ul class="grid" style="gap:4px">
      ${todo.slice(0, 12).map((m) => {
        const c = guessClient(m);
        return `<li><button class="tsk-t" data-act="book-meeting" data-id="${m.id}"
            style="padding:6px 7px;border-radius:9px">
          <span class="row spread" style="gap:10px;align-items:baseline">
            <span class="sm2 trunc">${esc(m.title)}</span>
            <span class="xs tab mut" style="white-space:nowrap">${esc(fmtH(meetingMinutes(m)))}</span>
          </span>
          <span class="xs mut row" style="gap:8px;margin-top:2px">
            <span class="tab">${esc(fmtDate(m.startsAt.slice(0, 10)))} ${esc(clock(m.startsAt))}</span>
            ${c ? `<span>${esc(c.name)}</span>` : `<span>${esc(tr("h_noclient"))}</span>`}
          </span>
        </button></li>`;
      }).join("")}
    </ul>
    ${todo.length > 12 ? `<p class="xs mut" style="margin-top:7px">…+${todo.length - 12}</p>` : ""}`,
      tr("h_book_card_d"));
  })()}

  ${shown.length ? `<div class="grid" style="gap:10px;margin-bottom:16px">${days.map((d, i) => {
    const list = shown.filter((e) => e.date === d);
    if (!list.length) return "";
    const dd = parseD(d);
    return `<section class="day">
      <header class="day-h">
        <span class="day-n">${WEEKDAYS[i]}</span>
        <span class="day-d">${dd.getDate()} ${MONTHS[dd.getMonth()].toLowerCase()}</span>
        ${d === TODAY() ? `<span class="badge info">${esc(tr("h_today"))}</span>` : ""}
        <span class="day-t">${esc(fmtH(list.reduce((s, e) => s + e.minutes, 0)))}</span>
      </header>
      ${list.map((e) => {
        const c = clientOf(e.clientId);
        const p = Number(e.pauseMinutes) || 0;
        // Only worth a line when the clock was actually running.
        const span = e.startedAt
          ? `${clock(e.startedAt)}–${clock(e.endedAt)}${p ? ` · ${tr("h_pause_n", p)}` : ""}`
          : "";
        return `<button class="ent" data-act="edit-entry" data-id="${e.id}">
          <span class="ent-dot" style="background:${c ? slotColor(c.slot) : "var(--axis)"}"></span>
          <span class="ent-t">
            <span class="ent-d">${esc(e.description || engLabel(e.engagement))}</span>
            <span class="ent-c">${span ? `<span class="tab">${esc(span)}</span> · ` : ""}${esc(c ? c.name : tr("h_noclient"))} · ${esc(engLabel(e.engagement))}</span>
          </span>
          ${e.billable ? `<span class="badge success">${esc(tr("h_billable"))}</span>`
            : `<span class="badge neutral">${esc(tr("h_nonbillable"))}</span>`}
          <span class="ent-h">${esc(fmtH(e.minutes))}</span>
        </button>`;
      }).join("")}
    </section>`;
  }).join("")}</div>`
    : empty(tr("h_noentries"), tr("h_noentries_d"))}

  ${card(tr("h_afas"), afasBlock(days), tr("h_afas_d"),
    `<button class="btn sm outline" data-act="copy-afas">${ico("copy", "", 13)} ${esc(tr("h_afas_copy"))}</button>`)}

  <div style="margin-top:16px">${clientsCard()}</div>`;
}

/* The full client list: what you booked on each, and what is still planned. */
function clientsCard() {
  const rows = DB.clients.map((c) => ({
    c,
    min: DB.timeEntries.filter((e) => e.clientId === c.id).reduce((s, e) => s + e.minutes, 0),
    weeks: DB.planning.filter((p) => p.clientId === c.id).length,
  })).sort((a, b) => b.min - a.min || a.c.name.localeCompare(b.c.name));

  return card(tr("h_clientlist"), rows.length ? `<div class="tbl-wrap"><table>
    <thead><tr><th>${esc(tr("p_client"))}</th><th>${esc(tr("h_sector"))}</th>
      <th style="text-align:right">${esc(tr("h_booked_total"))}</th>
      <th style="text-align:right">${esc(tr("h_weeks_planned"))}</th></tr></thead>
    <tbody>${rows.map(({ c, min, weeks }) => `<tr data-act="edit-client" data-id="${c.id}">
      <td><span class="row" style="gap:8px">
        <span class="wk-dot" style="background:${slotColor(c.slot)}"></span>${esc(c.name)}</span></td>
      <td class="sm2 mut">${esc(c.sector || "—")}</td>
      <td class="tab" style="text-align:right">${esc(min ? fmtH(min) : "—")}</td>
      <td class="tab mut" style="text-align:right">${weeks || "—"}</td>
    </tr>`).join("")}</tbody></table></div>`
    : empty(tr("h_noclients")),
    tr("h_clientlist_d"),
    `<button class="btn sm outline" data-act="new-client">${ico("plus", "", 13)} ${esc(tr("h_newclient"))}</button>`);
}

/* Timer card: start form when idle, live readout when running. */
function timerCard() {
  if (DB.timer) {
    const c = clientOf(DB.timer.clientId);
    const paused = timerPaused();
    return `<section class="timer-card ${paused ? "held" : "live"}">
      <div class="row wrap" style="gap:14px;align-items:center">
        <span class="timer-live ${paused ? "mut" : ""}" id="timer-live">${fmtHMS(timerMs())}</span>
        <div style="min-width:0;flex:1">
          <p style="font-size:14px;font-weight:500">${esc(DB.timer.description || tr("h_running"))}
            ${paused ? `<span class="badge neutral" style="margin-left:6px">${esc(tr("h_paused"))}</span>` : ""}</p>
          <p class="tsk-m"><span class="row" style="gap:6px">
            <span class="wk-dot" style="background:${c ? slotColor(c.slot) : "var(--axis)"}"></span>
            ${esc(c ? c.name : tr("h_noclient"))}</span>
            <span>${esc(engLabel(DB.timer.engagement))}</span>
            <span>${esc(DB.timer.billable ? tr("h_billable") : tr("h_nonbillable"))}</span></p>
        </div>
        <div class="row wrap" style="gap:8px">
          <button class="btn sm ghost" data-act="timer-discard">${esc(tr("h_discard"))}</button>
          <button class="btn sm outline" data-act="${paused ? "timer-resume" : "timer-pause"}">
            ${ico(paused ? "play" : "pause", "", 13)} ${esc(paused ? tr("h_resume") : tr("h_pause"))}</button>
          <button class="btn" data-act="timer-stop">${ico("stop", "", 13)} ${esc(tr("h_stop"))}</button>
        </div>
      </div>
      ${paused ? `<p class="xs mut" style="margin-top:10px">${esc(tr("h_paused_note"))}</p>` : ""}
      ${!paused && timerMs() > 8 * 3600e3 ? `<p class="xs" style="color:var(--warning);margin-top:10px">
        ${ico("alert", "", 12)} ${esc(tr("h_forgot"))}</p>` : ""}
    </section>`;
  }

  // Pre-fill the client from this week's planning: usually the right answer.
  const plan = DB.planning.find((p) => p.week === mondayOf());
  const preset = plan && plan.clientId ? plan.clientId : "";

  const presetClient = preset ? (clientOf(preset)?.name ?? "") : "";
  const presetEng = engLabel(plan ? plan.engagement : "intern");

  /* Deliberately not a <form>: the Start button goes through the same click
     delegation as every other control in the app, so there is no second
     submit path that can quietly fail. Enter in a field starts it too. */
  return `<section class="timer-card">
    <div id="timer-start-row" class="row wrap" style="gap:10px;align-items:flex-end">
      <label class="field" style="flex:2;min-width:190px">
        <span class="lbl">${esc(tr("h_what"))}</span>
        <input class="inp" id="t-desc" placeholder="${esc(tr("h_what_ph"))}" autocomplete="off">
      </label>
      <label class="field" style="flex:1;min-width:160px">
        <span class="lbl">${esc(tr("p_client"))}</span>
        ${combo({ id: "t-client", name: "client", value: presetClient,
          list: DB.clients.map((c) => c.name), placeholder: tr("h_noclient") })}
      </label>
      <label class="field" style="flex:1;min-width:160px">
        <span class="lbl">${esc(tr("p_engagement"))}</span>
        ${combo({ id: "t-eng", name: "engagement", value: presetEng,
          list: allEngagements().map(([, l]) => l) })}
      </label>
      <label class="row" style="gap:7px;height:34px;padding:0 2px">
        <input type="checkbox" id="t-bill" ${preset ? "checked" : ""} style="width:16px;height:16px">
        <span class="sm2">${esc(tr("h_billable"))}</span>
      </label>
      <button class="btn" type="button" data-act="timer-start">${ico("play", "", 13)} ${esc(tr("h_start"))}</button>
    </div>
    <p class="xs mut" style="margin-top:9px">
      ${preset ? `${ico("planning", "", 11)} ${esc(tr("h_fromplan"))} · ` : ""}${esc(tr("h_freetype"))}</p>
  </section>`;
}

/* ---- Excel export -------------------------------------------------------
   Monday of the week you are looking at, up to today — so exporting on a
   Thursday gives you four days. A past week exports whole.
------------------------------------------------------------------------- */
function exportRange(monday) {
  const days = weekDays(monday);
  const to = days[6] < TODAY() ? days[6] : TODAY();   // never past today
  return { from: days[0], to };
}
function exportRows(monday) {
  const { from, to } = exportRange(monday);
  return DB.timeEntries
    .filter((e) => e.date >= from && e.date <= to)
    .sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || "").localeCompare(b.createdAt || ""))
    .map((e) => {
      const c = clientOf(e.clientId);
      const d = parseD(e.date);
      const pause = Number(e.pauseMinutes) || 0;
      return {
        date: `${pad2(d.getDate())}-${pad2(d.getMonth() + 1)}-${d.getFullYear()}`,
        week: String(weekNoOf(e.date)),
        // Blank rather than 00:00 for a line booked by hand without a clock.
        start: clock(e.startedAt),
        end: clock(e.endedAt),
        pause: e.startedAt ? String(pause) : "",
        gross: e.startedAt ? num(roundTenth(e.minutes + pause), 1) : "",
        hours: num(roundTenth(e.minutes), 1),        // decimal comma in Dutch
        description: e.description || engLabel(e.engagement),
        client: c ? c.name : tr("h_noclient"),
        engagement: engLabel(e.engagement),
        billable: e.billable ? tr("h_yes") : tr("h_no"),
      };
    });
}
const EXPORT_COLS = ["h_col_date", "h_col_week", "h_col_start", "h_col_end", "h_col_gross",
  "h_col_pause", "h_col_hours", "h_col_desc", "h_col_client", "h_col_eng", "h_col_bill"];
const EXPORT_KEYS = ["date", "week", "start", "end", "gross",
  "pause", "hours", "description", "client", "engagement", "billable"];
/* Right-aligned in the preview because they are quantities you scan down. A
   week number is a label, so it gets the figures but stays left. */
const EXPORT_NUM = new Set(["gross", "pause", "hours"]);
const EXPORT_TAB = new Set(["date", "week", "start", "end", "gross", "pause", "hours"]);

const csvCell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
/* `sep=;` on the first line makes Excel honour the separator whatever the
   machine's locale is, and the BOM keeps accented characters intact. */
function toCsv(rows) {
  const head = EXPORT_COLS.map((k) => csvCell(tr(k))).join(";");
  const body = rows.map((r) => EXPORT_KEYS.map((k) => csvCell(r[k])).join(";")).join("\r\n");
  return `sep=;\r\n${head}\r\n${body}`;
}
/* Tab-separated pastes straight into a sheet, no import dialog. */
function toTsv(rows) {
  const clean = (v) => String(v ?? "").replace(/[\t\r\n]+/g, " ");
  return [EXPORT_COLS.map((k) => clean(tr(k))).join("\t"),
    ...rows.map((r) => EXPORT_KEYS.map((k) => clean(r[k])).join("\t"))].join("\n");
}

/* Two ways to hand over a file, because the two builds differ:
   - opened from disk, an anchor download just works;
   - published on claude.ai, the page may not download by itself, but the
     host offers a mediated save. Resolved once at boot so the button never
     sits there waiting. */
const downloadsReady = (async () => {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return null;
    return await window.claude.use("downloads");
  } catch (e) { return null; }
})();

/* The byte order mark is what makes Excel read accents correctly, but it
   would sit in front of a JSON file and break every parser, so it goes on
   spreadsheets only. */
const withBom = (text, mime) => (String(mime).startsWith("text/csv") ? "﻿" : "") + text;

function downloadText(filename, text, mime) {
  try {
    const blob = new Blob([withBom(text, mime)], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return true;
  } catch (e) { return false; }
}

/* Resolves true only when the file actually reached the viewer, so a caller
   can record that a backup was really made rather than merely offered. */
async function saveFile(filename, text, mime, quiet) {
  const done = (ok) => {
    if (!quiet) toast(ok ? tr("h_excel_saved") : tr("h_excel_blocked"));
    return ok;
  };
  const dl = await downloadsReady;
  if (dl) {
    try {
      await dl.save({ filename, data: withBom(text, mime) });
      return done(true);
    } catch (err) {
      // The viewer declining is an answer, not a failure to work around.
      if (err && err.code === "declined") return false;
      if (err && err.code === "rate_limited") { if (!quiet) toast(tr("h_excel_blocked")); return false; }
      // Anything else: fall through and try the plain download.
    }
  }
  return done(downloadText(filename, text, mime));
}

function hoursExportDialog() {

  const { from, to } = exportRange(monday);
  const rows = exportRows(monday);
  const totalMin = DB.timeEntries.filter((e) => e.date >= from && e.date <= to)
    .reduce((s, e) => s + e.minutes, 0);
  // Bookings made before the timer recorded clock times, or typed by hand.
  const noClock = rows.filter((r) => !r.start).length;
  const fname = `uren-${from}-${to}.csv`;

  if (!rows.length) {
    openDialog({ title: tr("h_excel_title"), submit: tr("close"),
      body: `<p class="sm2 mut">${esc(tr("h_excel_none"))}</p>`, onSubmit: () => {} });
    return;
  }

  openDialog({
    title: tr("h_excel_title"),
    desc: tr("h_excel_d"),
    submit: tr("h_excel_dl"),
    body: `<p class="sm2">${esc(tr("h_excel_range", rows.length, fmtDate(from), fmtDate(to), fmtH(totalMin)))}</p>
      <div class="tbl-wrap" style="max-height:230px;overflow:auto">
        <table><thead><tr>${EXPORT_COLS.map((k) => `<th>${esc(tr(k))}</th>`).join("")}</tr></thead>
        <tbody>${rows.slice(0, 40).map((r) => `<tr style="cursor:default">
          ${EXPORT_KEYS.map((k) => `<td class="sm2${EXPORT_TAB.has(k) ? " tab" : ""}"${EXPORT_NUM.has(k) ? ' style="text-align:right"' : ""}>${esc(r[k])}</td>`).join("")}
        </tr>`).join("")}</tbody></table>
      </div>
      ${rows.length > 40 ? `<p class="xs mut">…+${rows.length - 40}</p>` : ""}
      ${noClock ? `<p class="xs mut">${esc(tr("h_excel_noclock", noClock))}</p>` : ""}
      <div class="row wrap" style="gap:8px">
        <button type="button" class="btn sm outline" data-act="export-hours-copy">
          ${ico("copy", "", 13)} ${esc(tr("h_excel_copy"))}</button>
      </div>
      <p class="xs mut">${esc(tr("h_excel_blocked"))}</p>
      <textarea id="hours-tsv" readonly aria-hidden="true"
        style="position:absolute;left:-9999px;top:0">${esc(toTsv(rows))}</textarea>`,
    onSubmit: () => { void saveFile(fname, toCsv(rows), "text/csv;charset=utf-8"); },
  });
}

/* One line per client per day, rounded the way time gets written. */
function afasLines(days) {
  const rows = [];
  days.forEach((d) => {
    const byClient = new Map();
    entriesOn(d).forEach((e) => {
      const key = e.clientId || "_";
      byClient.set(key, (byClient.get(key) || 0) + e.minutes);
    });
    [...byClient.entries()].forEach(([key, min]) => {
      const h = roundTenth(min);
      if (h < 0.1) return;
      const c = key === "_" ? null : clientOf(key);
      rows.push({ date: d, client: c ? c.name : tr("h_noclient"), hours: h });
    });
  });
  return rows;
}
function afasBlock(days) {
  const rows = afasLines(days);
  if (!rows.length) return `<p class="xs mut">${esc(tr("h_afas_none"))}</p>`;
  const total = rows.reduce((s, r) => s + r.hours, 0);
  const body = rows.map((r) => {
    const d = parseD(r.date);
    return `${pad2(d.getDate())}-${pad2(d.getMonth() + 1)}  ${String(num(r.hours, 1)).padStart(5)}  ${r.client}`;
  }).join("\n");
  return `<pre class="afas" id="afas-text">${esc(body)}</pre>
    <p class="xs mut" style="margin-top:8px">${esc(tr("h_total"))}: ${esc(num(total, 1))}${LANG === "nl" ? "u" : "h"}</p>`;
}

/* ---- Mijn planning ----------------------------------------------------
   One row per week from this week through summer 2027. A week with no client
   is capacity, not a gap - the AI role needs those blocks, so they are shown
   as deliberately reserved rather than empty.
------------------------------------------------------------------------- */
/* Built-in engagement types plus any the user typed in themselves. */
const allEngagements = () => [
  ...ENGAGEMENTS.map(([id, l]) => [id, lbl(l)]),
  ...(DB.engagements || []).map((e) => [e.id, e.name]),
];
const engLabel = (v) => {
  const custom = (DB.engagements || []).find((e) => e.id === v);
  if (custom) return custom.name;
  const found = ENGAGEMENTS.find((e) => e[0] === v);
  return found ? lbl(found[1]) : v;
};
/* Resolves what someone typed into an engagement id, creating one if needed. */
function resolveEngagement(text) {
  const s = String(text || "").trim();
  if (!s) return "intern";
  const hit = allEngagements().find(([, label]) => label.toLowerCase() === s.toLowerCase());
  if (hit) return hit[0];
  const id = "eng_" + uid();
  DB.engagements = DB.engagements || [];
  DB.engagements.push({ id, name: s });
  toast(tr("h_newengagement"));
  return id;
}
/* Same for clients: an unknown name becomes a new client rather than an error. */
function resolveClient(text) {
  const s = String(text || "").trim();
  if (!s) return null;
  const hit = DB.clients.find((c) => c.name.toLowerCase() === s.toLowerCase());
  if (hit) return hit.id;
  const c = { id: uid(), name: s, sector: "", slot: (DB.clients.length % 5) + 1 };
  DB.clients.push(c);
  toast(tr("h_client_added"));
  return c.id;
}
/* Searchable input backed by a datalist - native, no library, works offline. */
function combo({ id, name, value, list, placeholder }) {
  return `<input class="inp" id="${id}" name="${name}" list="${id}-dl" autocomplete="off"
      value="${esc(value ?? "")}" placeholder="${esc(placeholder || tr("h_search_ph"))}">
    <datalist id="${id}-dl">${list.map((l) => `<option value="${esc(l)}"></option>`).join("")}</datalist>`;
}
const clientOf = (id) => DB.clients.find((c) => c.id === id) || null;

function viewPlanning() {
  const f = UI.planFilter || (UI.planFilter = { client: "all", scope: "all" });
  const all = [...DB.planning].sort((a, b) => a.week.localeCompare(b.week));
  const now = mondayOf();

  let rows = all;
  if (f.scope === "upcoming") rows = rows.filter((p) => p.week >= now);
  if (f.scope === "assigned") rows = rows.filter((p) => p.clientId);
  if (f.scope === "free") rows = rows.filter((p) => !p.clientId && p.engagement !== "vrij");
  if (f.scope === "leave") rows = rows.filter((p) => p.engagement === "vrij");
  if (f.client !== "all") rows = rows.filter((p) => p.clientId === f.client);

  const future = all.filter((p) => p.week >= now);
  const billable = future.filter((p) => p.clientId).length;
  const leave = future.filter((p) => p.engagement === "vrij").length;
  const aiWeeks = future.filter((p) => !p.clientId && p.engagement !== "vrij").length;
  const plannedHours = future.reduce((s, p) => s + (p.hours || 0), 0);

  // Weeks per client across the horizon - the real question a planner asks.
  const perClient = DB.clients.map((c) => ({
    c, n: future.filter((p) => p.clientId === c.id).length,
  })).filter((x) => x.n).sort((a, b) => b.n - a.n);
  const maxN = Math.max(1, ...perClient.map((x) => x.n));

  // Grouped by month so the year's shape is visible while scrolling.
  let lastMonth = "";
  const list = rows.map((p) => {
    const d = parseD(p.week), mk = `${d.getFullYear()}-${d.getMonth()}`;
    let head = "";
    if (mk !== lastMonth) {
      lastMonth = mk;
      const mw = all.filter((x) => { const q = parseD(x.week);
        return `${q.getFullYear()}-${q.getMonth()}` === mk; });
      const mAssigned = mw.filter((x) => x.clientId).length;
      head = `<div class="mon"><span class="mon-t">${MONTHS[d.getMonth()]} ${d.getFullYear()}</span>
        <span class="mon-r"></span><span class="xs mut">${esc(tr("p_at_client_m", mAssigned, mw.length))}</span></div>`;
    }
    const c = clientOf(p.clientId);
    const isNow = p.week === now;
    const free = !p.clientId;
    const end = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 4);
    return head + `<button class="wk ${isNow ? "now" : ""} ${free ? "free" : ""}"
      data-act="edit-week" data-id="${p.id}">
      <span class="wk-n">
        <span class="wk-w tab">${esc(tr("p_wk"))} ${isoWeekNo(p.week)}</span>
        <span class="wk-d tab">${d.getDate()} ${MONTHS[d.getMonth()].toLowerCase()} – ${end.getDate()} ${MONTHS[end.getMonth()].toLowerCase()}</span>
      </span>
      <span class="wk-c">
        <span class="daystrip">${weekComposition(p).map((d, i) => d.type === "off" ? ""
          : `<span class="daychip" style="background:${dayColour(d)};color:${dayInk(d)}"
              title="${esc(dayName(i, true))} · ${esc(dayLabel(d))}">${esc(dayName(i).slice(0, 2))}</span>`).join("")}</span>
        <span style="min-width:0">
          <span class="wk-name">${c ? esc(c.name) : esc(engLabel(p.engagement))}</span>
          <span class="wk-eng" style="display:block">${c ? esc(engLabel(p.engagement)) : esc(p.notes || tr("p_noclient"))}
            ${p.hours ? ` · ${p.hours}${LANG === "nl" ? "u" : "h"}` : ""}</span>
        </span>
      </span>
      <span class="row" style="gap:6px">
        ${isNow ? `<span class="badge info">${esc(tr("p_thisweek"))}</span>` : ""}
        ${badge(PSTATUS, p.status)}
      </span></button>`;
  }).join("");

  return pageHead(tr("nav_planning"), tr("p_sub", future.length),
    `<button class="btn sm outline" data-act="plan-bulk">${ico("pencil")} ${esc(tr("p_bulk"))}</button>`) +

  `<div class="tiles" style="margin-bottom:16px">
    ${tile(tr("p_atclient"), billable, "", "", "building", "var(--c1)",
      { act: "plan-scope", v: "assigned", on: f.scope === "assigned" })}
    ${tile(tr("p_ai"), aiWeeks, "", "", "sparkle", "var(--c2)",
      { act: "plan-scope", v: "free", on: f.scope === "free" })}
    ${tile(tr("p_leave"), leave, tr("p_weeks"), "", "sun", "var(--c3)",
      { act: "plan-scope", v: "leave", on: f.scope === "leave" })}
    ${tile(tr("p_hours"), num(plannedHours), LANG === "nl" ? "u" : "h",
      tr("p_avg", Math.round(plannedHours / Math.max(1, future.length))), "timer", "var(--c4)")}
  </div>

  ${stripCard(all)}

  <div style="margin:16px 0">
    ${card(tr("p_perclient"), perClient.length
      ? `<ul class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 18px">${perClient.map(({ c, n }) =>
      `<li><button class="tsk-t" data-act="plan-client" data-v="${c.id}"
          aria-pressed="${f.client === c.id}" style="padding:5px 6px;border-radius:9px"
          title="${esc(c.name)}">
        <span class="row spread" style="align-items:baseline;gap:8px">
          <span class="sm2 trunc"><span class="wk-dot" style="background:${slotColor(c.slot)};display:inline-block;margin-right:7px"></span>${esc(c.name)}</span>
          <span class="xs tab mut">${n} ${esc(n === 1 ? tr("p_week") : tr("p_weeks"))} · ${esc(c.sector)}</span></span>
        <span style="display:block;margin-top:5px">${meterEl((n / maxN) * 100, slotColor(c.slot))}</span>
      </button></li>`).join("")}</ul>`
      : empty(tr("p_noclients")), tr("p_perclient_d"))}
  </div>

  <div class="row wrap" style="gap:8px;margin-bottom:6px">
    <div class="seg wrap">
      ${[["all", tr("p_scope_all")], ["upcoming", tr("p_scope_up")], ["assigned", tr("p_scope_as")],
         ["free", tr("p_scope_free")], ["leave", tr("p_scope_leave")]]
        .map(([v, l]) => `<button data-act="plan-scope" data-v="${v}" aria-pressed="${f.scope === v}">${esc(l)}</button>`).join("")}
    </div>
    ${f.client !== "all" ? `<span class="chip">${esc(truncate(clientOf(f.client)?.name || "", 30))}
      <button type="button" data-act="plan-client" data-v="all" aria-label="${esc(tr("filter_clear"))}">${ico("close", "", 11)}</button></span>` : ""}
    <select class="inp" id="f-client" style="height:29px;font-size:12px;width:auto;min-width:160px">
      <option value="all">${esc(tr("p_allclients"))}</option>
      ${DB.clients.map((c) => `<option value="${c.id}" ${f.client === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
    </select>
    <span class="xs mut" style="margin-left:auto">${rows.length} ${esc(tr("p_weeks"))}</span>
  </div>

  <section class="card"><div class="card-b" style="padding:8px 10px 14px">
    ${rows.length ? list : empty(tr("p_none"))}
  </div></section>`;
}

/* ---- the standard week -------------------------------------------------
   A week in the planning is seven days. Any day you have not set follows
   your standard week from Settings: the weekend, your part-time day and
   your study day are filled in before the client is.
------------------------------------------------------------------------- */
const DAY_KEYS = ["d_mon", "d_tue", "d_wed", "d_thu", "d_fri", "d_sat", "d_sun"];
const DAY_LONG = ["d_mon_l", "d_tue_l", "d_wed_l", "d_thu_l", "d_fri_l", "d_sat_l", "d_sun_l"];
const dayName = (i, long) => tr((long ? DAY_LONG : DAY_KEYS)[i]);

const DAY_COLOUR = {
  intern: "var(--axis)", study: "var(--c5)",
  free: "var(--surface-3)", leave: "var(--border)", off: "transparent",
};
function dayColour(d) {
  if (d.type === "client") {
    const c = clientOf(d.clientId);
    return c ? slotColor(c.slot) : "var(--axis)";
  }
  return DAY_COLOUR[d.type] || "var(--axis)";
}
/* Part-time and leave use pale fills, which white text cannot sit on. */
const dayInk = (d) => (d.type === "free" || d.type === "leave")
  ? "var(--ink-2)" : "rgba(255,255,255,.95)";

function dayLabel(d) {
  if (d.type === "client") {
    const c = clientOf(d.clientId);
    return c ? c.name : tr("p_noclient");
  }
  return tr({ intern: "dt_intern", study: "dt_study", free: "dt_free",
    leave: "dt_leave", off: "dt_off" }[d.type] || "dt_intern");
}

/* Seven resolved days for a planning week. Stored days win; the rest is
   derived, so changing your standard week updates every untouched week. */
function weekComposition(p) {
  const prof = DB.profile;
  const work = Array.isArray(prof.workDays) ? prof.workDays : [0, 1, 2, 3, 4];
  return Array.from({ length: 7 }, (_, i) => {
    const stored = p.days && p.days[i];
    if (stored && stored.type) return stored;
    if (!work.includes(i)) return { type: "off" };
    if (prof.freeDay === i) return { type: "free" };
    if (prof.studyDay === i) return { type: "study" };
    if (p.engagement === "vrij") return { type: "leave" };
    if (p.clientId) return { type: "client", clientId: p.clientId };
    return { type: "intern" };
  });
}
/* The days that actually count as work, for bars and totals. */
const workedDays = (p) => weekComposition(p).filter((d) => d.type !== "off");

/* The week strip: the main read on this page, so it gets the room and its
   own range control. One bar per week; hovering lifts it and names the
   client, clicking opens that week. */
const PLAN_RANGES = { "4w": { weeks: 4, step: 1 }, "6m": { weeks: 26, step: 4 }, "1y": { weeks: 52, step: 13 } };

function stripCard(all) {
  const f = UI.planFilter;
  const { weeks, step } = PLAN_RANGES[f.range] || PLAN_RANGES["4w"];
  const now = mondayOf();

  // The window starts at this week, shifted by however far you have paged.
  const startIdx = Math.max(0, all.findIndex((p) => p.week >= now)) + f.offset * step;
  const slice = all.slice(Math.max(0, startIdx), Math.max(0, startIdx) + weeks);
  if (!slice.length) return "";

  const maxHours = Math.max(40, ...slice.map((p) => p.hours || 0));
  const first = parseD(slice[0].week), last = parseD(slice[slice.length - 1].week);
  const fmtMon = (d) => `${MONTHS[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;

  // Month ticks only where the month changes, and only when bars are wide.
  let lastMonth = "";
  const ticks = slice.map((p) => {
    const d = parseD(p.week), key = `${d.getFullYear()}-${d.getMonth()}`;
    if (key === lastMonth) return `<span></span>`;
    lastMonth = key;
    return `<span>${weeks <= 8 ? `${tr("p_wk")} ${isoWeekNo(p.week)}` : MONTHS[d.getMonth()].toLowerCase()}</span>`;
  }).join("");

  const seg = (v, l) => `<button data-act="plan-range" data-v="${v}"
    aria-pressed="${f.range === v}">${esc(l)}</button>`;

  return `<section class="card"><div class="card-b" style="padding:17px 18px 18px">
    <div class="row wrap spread" style="gap:10px;margin-bottom:14px">
      <div>
        <h2 class="card-t">${esc(tr("p_load"))}</h2>
        <p class="card-d">${esc(tr("p_showing", fmtMon(first), fmtMon(last)))} · ${esc(tr("p_load_d"))}</p>
      </div>
      <div class="row wrap" style="gap:8px">
        <div class="seg">${seg("4w", tr("p_r_4w"))}${seg("6m", tr("p_r_6m"))}${seg("1y", tr("p_r_1y"))}</div>
        <div class="row" style="gap:4px">
          <button class="btn icon sm outline" data-act="plan-shift" data-v="-1"
            aria-label="${esc(tr("p_earlier"))}" ${startIdx <= 0 ? "disabled" : ""}>‹</button>
          <button class="btn sm outline" data-act="plan-shift" data-v="0"
            ${f.offset === 0 ? 'aria-pressed="true"' : ""}>${esc(tr("p_now"))}</button>
          <button class="btn icon sm outline" data-act="plan-shift" data-v="1"
            aria-label="${esc(tr("p_later"))}">›</button>
        </div>
      </div>
    </div>

    <div class="strip">${slice.map((p) => {
      const comp = weekComposition(p);
      const days = comp.map((d, i) => ({ d, i })).filter(({ d }) => d.type !== "off");
      const h = Math.max(6, Math.round(((p.hours || 0) / maxHours) * 100));
      const headline = dayLabel(days.find(({ d }) => d.type === "client")?.d
        || days[0]?.d || { type: "intern" });

      return `<button class="bar ${p.week === now ? "now" : ""}" data-act="edit-week" data-id="${p.id}"
        aria-label="${esc(tr("p_wk"))} ${isoWeekNo(p.week)} — ${esc(headline)}">
        <span class="bar-fill" style="height:${h}%">
          ${days.map(({ d }) => `<span class="bar-day" style="background:${dayColour(d)}"></span>`).join("")}
        </span>
        <span class="bar-tip">
          <b>${esc(tr("p_wk"))} ${isoWeekNo(p.week)} · ${parseD(p.week).getDate()} ${MONTHS[parseD(p.week).getMonth()].toLowerCase()}</b>
          ${days.map(({ d, i }) => `<span class="tip-row">
            <i style="background:${dayColour(d)}"></i>${esc(dayName(i))} · ${esc(dayLabel(d))}</span>`).join("")}
        </span>
      </button>`;
    }).join("")}</div>
    <div class="strip-ticks">${ticks}</div>
    <p class="xs mut" style="margin-top:10px">${esc(tr("p_load_note"))}</p>
  </div></section>`;
}

/* ---- goal detail ------------------------------------------------------- */
function viewGoalDetail(id) {
  const g = DB.goals.find((x) => x.id === id);
  if (!g) return empty(tr("not_found"));
  const p = goalProgress(g.id), ye = yearElapsed();
  const kpis = DB.kpis.filter((k) => k.goalId === id);
  const projects = DB.projects.filter((x) => x.goalId === id);
  const tasks = DB.tasks.filter((t) => t.goalId === id && t.status !== "done")
    .sort((a, b) => scoreTask(b) - scoreTask(a));

  const filled = smartFilled(g);

  return `<button class="btn sm ghost" data-nav="goals" style="margin-bottom:8px;padding-left:0">${ico("back", "", 13)} ${esc(tr("g_back"))}</button>` +
  pageHead(`${g.code} · ${g.title}`, g.description,
    `<span class="badge" style="background:${slotColor(g.slot)};color:#fff;border:0;font-weight:600">${esc(String(g.year))}</span>
     ${badge(GSTAT, g.status)}
     <button class="btn sm outline" data-act="edit-goal" data-id="${g.id}">${ico("pencil")} ${esc(tr("edit"))}</button>`) +

  /* The SMART write-up sits above the numbers: it is what the numbers are
     supposed to be measuring, and it is the part that goes stale unnoticed. */
  card(tr("g_smart"), filled
    ? `<dl class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 20px">
        ${SMART.map(([k, label, hint]) => {
          const v = String(smartOf(g)[k] || "").trim();
          return `<div>
            <dt class="lbl row" style="gap:6px">
              <span class="smart-k" style="background:${v ? slotColor(g.slot) : "var(--axis)"}">${esc(lbl(label)[0])}</span>
              ${esc(lbl(label))}</dt>
            <dd class="sm2" style="margin:3px 0 0;white-space:pre-wrap;line-height:1.55;${v ? "" : "color:var(--ink-3)"}">${esc(v || lbl(hint))}</dd>
          </div>`;
        }).join("")}
      </dl>`
    : empty(tr("g_smart_none"), tr("g_smart_none_d"),
        `<button class="btn sm" data-act="edit-goal" data-id="${g.id}" style="margin-top:10px">${ico("pencil", "", 13)} ${esc(tr("g_smart_write"))}</button>`),
    tr("g_smart_of", filled),
    filled && filled < 5
      ? `<button class="btn sm ghost" data-act="edit-goal" data-id="${g.id}">${esc(tr("g_smart_finish"))}</button>` : "") +

  `<div class="grid split" style="margin-top:12px">
    ${card(tr("g_progress"), `<p class="tab" style="font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1">${p}%</p>
      <div style="margin:11px 0 7px">${meterEl(p, slotColor(g.slot), ye)}</div>
      <p class="xs mut">${g.manualProgress !== null && g.manualProgress !== undefined
        ? tr("g_manual_d")
        : tr("g_calc")}</p>`)}
    ${card(tr("g_milestones"), milestoneList(g.id))}
  </div>
  <div class="grid cols2" style="margin-top:12px">
    ${card(tr("g_kpis"), kpis.length ? `<ul class="grid" style="gap:11px">${kpis.map((k) => {
      const ytd = kpiYtd(k.id), att = k.target ? (ytd / k.target) * 100 : 0;
      return `<li><div class="row spread" style="align-items:baseline;gap:8px">
        <span class="xs trunc">${esc(k.name)}</span>
        <span class="xs tab" style="font-weight:500">${num(ytd)}<span class="mut" style="font-weight:400"> / ${num(k.target)} ${esc(k.unit)}</span></span>
      </div><div style="margin-top:4px">${meterEl(att, slotColor(k.slot))}</div></li>`;
    }).join("")}</ul>` : empty(tr("g_nokpi")))}

    ${card(tr("g_projects"), projects.length ? `<ul class="divide">${projects.map((pr) =>
      `<li><button class="tsk-t" data-act="open-project" data-id="${pr.id}" style="padding:9px 0;display:flex;gap:10px;align-items:center">
        <span style="flex:1;min-width:0"><span class="trunc" style="display:block">${esc(pr.name)}</span>
        <span class="tsk-m"><span>${esc(tr("s_w_str"))} ${pr.strategicValue}/5</span>
        ${pr.deadline ? `<span>${esc(fmtDate(pr.deadline))}</span>` : ""}</span></span>
        ${badge(PSTAT, pr.status)}</button></li>`).join("")}</ul>`
      : empty(tr("g_noproj")))}
  </div>
  <div style="margin-top:12px">${card(`${tr("g_opentasks")} (${tasks.length})`,
    tasks.length ? `<div>${tasks.map((t) => taskRow(t, { hideGoal: true })).join("")}</div>`
      : empty(tr("g_notasks"), tr("g_notasks_d")))}</div>`;
}

/* ---- project detail ---------------------------------------------------- */
function viewProjectDetail(id) {
  const p = DB.projects.find((x) => x.id === id);
  if (!p) return empty(tr("not_found"));
  const g = DB.goals.find((x) => x.id === p.goalId);
  const tasks = DB.tasks.filter((t) => t.projectId === id);
  const open = tasks.filter((t) => t.status !== "done").sort((a, b) => scoreTask(b) - scoreTask(a));
  const done = tasks.filter((t) => t.status === "done");
  const meetings = DB.meetings.filter((m) => m.projectId === id);
  const ideas = DB.ideas.filter((i) => i.projectId === id);
  const health = meta(HEALTH, p.health);
  const od = p.status !== "done" && overdue(p.deadline);

  return `<button class="btn sm ghost" data-nav="projects" style="margin-bottom:8px;padding-left:0">${ico("back", "", 13)} ${esc(tr("pr_back"))}</button>` +
  pageHead(p.name, p.objective,
    `${badge(PSTAT, p.status)}<span class="badge ${health[2]}">${esc(lbl(health[1]))}</span>
     <button class="btn sm outline" data-act="edit-project" data-id="${p.id}">${ico("pencil")} ${esc(tr("edit"))}</button>`) +
  `<div class="tiles" style="margin-bottom:14px">
    ${tile(tr("s_w_str"), `${p.strategicValue}/5`, "", "", "goals")}
    ${tile(tr("dl_due"), p.deadline ? fmtDate(p.deadline) : "—", "", od ? tr("overdue_p") : "", "clock")}
    ${tile(tr("g_opentasks"), open.length, "", tr("pr_ndone", done.length), "tasks")}
    ${tile(tr("dl_goal"), g ? g.code : "—", "", g ? g.title.slice(0, 28) : tr("pr_notlinked"), "goals")}
  </div>
  <div class="grid split">
    <div class="grid">
      ${card(`${tr("g_opentasks")} (${open.length})`, open.length
        ? `<div>${open.map((t) => taskRow(t, { hideProject: true })).join("")}</div>`
        : empty(tr("pr_notasks"), tr("pr_notasks_d")),
        "", `<button class="btn sm ghost" data-act="new-task" data-project="${p.id}">${ico("plus", "", 13)} ${esc(tr("pr_addtask"))}</button>`)}
      ${done.length ? card(`${tr("pr_completed")} (${done.length})`,
        `<div>${done.slice(0, 15).map((t) => taskRow(t, { hideProject: true })).join("")}</div>`) : ""}
    </div>
    <div class="grid">
      ${p.description ? card(tr("pr_desc"), `<p class="xs mut" style="white-space:pre-wrap;line-height:1.6">${esc(p.description)}</p>`) : ""}
      ${card(tr("pr_risks"), `
        <p class="eyebrow">${esc(tr("pr_risk"))}</p>
        <p class="xs mut" style="white-space:pre-wrap;line-height:1.6;margin:3px 0 10px">${esc(p.risks) || tr("pr_none_rec")}</p>
        <p class="eyebrow">${esc(tr("pr_dep"))}</p>
        <p class="xs mut" style="white-space:pre-wrap;line-height:1.6;margin:3px 0 0">${esc(p.dependencies) || tr("pr_none_rec")}</p>
        ${p.owner ? `<p class="eyebrow" style="margin-top:10px">${esc(tr("pr_owner"))}</p><p class="xs">${esc(p.owner)}</p>` : ""}`)}
      ${meetings.length ? card(tr("pr_meetings"), `<ul class="divide">${meetings.map((m) =>
        `<li><button class="tsk-t" data-act="open-meeting" data-id="${m.id}" style="padding:7px 0">
          <span class="xs trunc" style="display:block">${esc(m.title)}</span>
          <span class="xs mut">${esc(fmtDateTime(m.startsAt))}</span></button></li>`).join("")}</ul>`) : ""}
      ${ideas.length ? card(tr("pr_ideas"), `<ul class="grid" style="gap:5px">${ideas.map((i) =>
        `<li class="xs">${esc(i.title)}</li>`).join("")}</ul>`) : ""}

/* ---- AI tips page ------------------------------------------------------- */
function tipRow(t, opts = {}) {
  const st = meta(TIP_STATUS, t.status);
  const ch = t.channel ? meta(TIP_CHANNELS, t.channel) : null;
  return `<div class="tsk" data-act="edit-tip" data-id="${t.id}">
    <div style="min-width:0;flex:1">
      <span class="tsk-t" style="display:block;font-weight:500">${esc(t.title)}</span>
      <div class="tsk-m">
        ${t.tool ? `<span>${esc(t.tool)}</span>` : ""}
        ${opts.hideDate !== true && t.plannedFor ? `<span class="tab">${esc(fmtDate(t.plannedFor))}</span>` : ""}
        ${t.status === "sent" && t.sentAt ? `<span class="tab">${esc(fmtDate(t.sentAt))}</span>` : ""}
        ${ch ? `<span>${esc(lbl(ch[1]))}</span>` : ""}
        ${t.why ? `<span class="trunc" style="max-width:200px">${esc(t.why)}</span>` : ""}
      </div>
    </div>
    <div class="row" style="gap:6px;flex:0 0 auto">
      ${t.kind === "newsletter" ? `<span class="badge accent">${esc(lbl(meta(TIP_KINDS, t.kind)[1]))}</span>` : ""}
      ${opts.hideStatus === true ? "" : `<span class="badge ${st[2]}">${esc(lbl(st[1]))}</span>`}
      ${t.body ? `<button class="btn icon sm outline" data-act="copy-tip" data-id="${t.id}"
        title="${esc(tr("ti_copy"))}" aria-label="${esc(tr("ti_copy"))}">${ico("copy", "", 12)}</button>` : ""}
      ${t.status !== "sent" ? `<button class="btn sm outline" data-act="tip-sent" data-id="${t.id}"
        style="white-space:nowrap">${esc(tr("ti_mark_sent"))}</button>` : ""}
    </div></div>`;
}

function viewTips() {
  const { everyWeeks, weekday } = tipPlan();
  const slots = tipSlots(6);
  const drafts = DB.tips.filter((t) => t.status === "draft")
    .sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
  const sent = DB.tips.filter((t) => t.status === "sent")
    .sort((a, b) => (b.sentAt || "").localeCompare(a.sentAt || ""));
  const year = String(new Date().getFullYear());
  const sentThisYear = sent.filter((t) => String(t.sentAt || "").startsWith(year)).length;
  const next = tipNext();
  const emptySoon = slots.filter((d) => !tipsOn(d).length).length;

  // Sent tips grouped by year keep the archive readable as it fills up.
  const byYear = new Map();
  sent.forEach((t) => {
    const y = String(t.sentAt || "").slice(0, 4) || "—";
    if (!byYear.has(y)) byYear.set(y, []);
    byYear.get(y).push(t);
  });

  return pageHead(tr("nav_tips"), tr("ti_sub"),
    `<button class="btn sm" data-act="new-tip">${ico("plus")} ${esc(tr("ti_new"))}</button>`) +

  `<div class="tiles" style="margin-bottom:14px">
    ${tile(tr("ti_t_next"), next ? fmtDate(next.plannedFor) : "—", "",
      next ? truncate(next.title, 30) : tr("ti_t_next_none"), "send",
      next ? "var(--c1)" : "var(--warning)")}
    ${tile(tr("ti_t_drafts"), drafts.length, "", tr("ti_t_drafts_h"), "bulb",
      drafts.length ? "var(--c4)" : "var(--c3)")}
    ${tile(tr("ti_t_empty"), emptySoon, "", tr("ti_t_empty_h", slots.length), "clock",
      emptySoon > 2 ? "var(--warning)" : "var(--c3)")}
    ${tile(tr("ti_t_sent"), sentThisYear, "", tr("ti_t_sent_h", year), "check", "var(--success)")}
  </div>

  ${card(tr("ti_slots"), `<ul class="grid" style="gap:3px">${slots.map((d, i) => {
    const here = tipsOn(d);
    const soon = daysUntil(d);
    return `<li><div class="src" style="border-bottom:${i === slots.length - 1 ? "0" : "1px solid var(--border)"}">
      <span class="slot-d ${here.length ? "full" : ""}">
        <span class="tab" style="font-weight:600">${esc(fmtDate(d))}</span>
        <span class="xs mut">${esc(dayName((parseD(d).getDay() + 6) % 7))}</span>
      </span>
      <div style="min-width:0;flex:1">
        ${here.length
          ? here.map((t) => `<button class="tsk-t" data-act="edit-tip" data-id="${t.id}"
              style="display:block;font-weight:500">${esc(t.title)}${t.tool ? ` <span class="mut" style="font-weight:400">· ${esc(t.tool)}</span>` : ""}</button>`).join("")
          : `<span class="xs mut">${esc(soon !== null && soon <= 7 ? tr("ti_slot_soon") : tr("ti_slot_free"))}</span>`}
      </div>
      <div class="row" style="gap:6px;flex:0 0 auto">
        ${here.length
          ? here.map((t) => `<button class="btn sm outline" data-act="tip-sent" data-id="${t.id}">${esc(tr("ti_mark_sent"))}</button>`).join("")
          : `<button class="btn sm ghost" data-act="new-tip" data-on="${d}">${ico("plus", "", 13)} ${esc(tr("ti_fill"))}</button>`}
      </div>
    </div></li>`;
  }).join("")}</ul>`,
    tr("ti_slots_d", lbl(everyWeeks === 2 ? ["every other week","om de week"] : ["every week","elke week"]),
      dayName(weekday, true).toLowerCase()),
    `<div class="row" style="gap:6px">
      <select class="inp" id="tip-every" style="width:auto;height:28px;font-size:12px">
        <option value="1" ${everyWeeks === 1 ? "selected" : ""}>${esc(tr("ti_weekly"))}</option>
        <option value="2" ${everyWeeks === 2 ? "selected" : ""}>${esc(tr("ti_biweekly"))}</option>
      </select>
      <select class="inp" id="tip-day" style="width:auto;height:28px;font-size:12px">
        ${[0,1,2,3,4,5,6].map((d) => `<option value="${d}" ${weekday === d ? "selected" : ""}>${esc(dayName(d, true))}</option>`).join("")}
      </select>
    </div>`)}

  ${drafts.length ? `<div style="margin-top:14px">${card(tr("ti_drafts"),
    `<div>${drafts.map((t) => tipRow(t, { hideStatus: true })).join("")}</div>`, tr("ti_drafts_d"))}</div>` : ""}

  ${!DB.tips.length ? empty(tr("ti_none"), tr("ti_none_d"),
    `<button class="btn sm" data-act="new-tip" style="margin-top:10px">${ico("plus")} ${esc(tr("ti_new"))}</button>`) : ""}

  ${sent.length ? `<details class="card" style="padding:0;margin-top:14px">
    <summary class="card-h" style="cursor:pointer;list-style:none">
      <span class="row spread" style="gap:10px">
        <span><span class="card-t">${esc(tr("ti_archive"))}</span>
          <span class="card-d" style="display:block">${esc(tr("ti_archive_d", sent.length))}</span></span>
        <span class="sm2 tab mut">${sent.length}</span>
      </span>
    </summary>
    <div class="card-b">
      ${[...byYear.entries()].map(([y, list]) => `<div style="margin-bottom:10px">
        <p class="lbl row spread" style="margin-bottom:3px"><span>${esc(y)}</span>
          <span class="tab">${list.length}</span></p>
        ${list.map((t) => tipRow(t, { hideStatus: true })).join("")}
      </div>`).join("")}
    </div></details>` : ""}`;
}

/* The dashboard block: the next send, and a nudge when the slot is still
   empty and close. */
function tipsCard() {
  if (!viewOn("tips")) return "";
  const next = tipNext();
  const slots = tipSlots(2);
  const firstFree = slots.find((d) => !tipsOn(d).length);
  const soon = firstFree ? daysUntil(firstFree) : null;

  const body = next
    ? `<div>${tipRow(next, { hideStatus: true })}</div>`
      + (firstFree && firstFree !== next.plannedFor && soon !== null && soon <= 10
        ? `<p class="xs mut" style="margin-top:6px">${esc(tr("ti_card_then", fmtDate(firstFree)))}</p>` : "")
    : firstFree
      ? `<p class="sm2 row" style="gap:7px;${soon !== null && soon <= 7 ? "color:var(--warning)" : "color:var(--ink-2)"}">
          ${ico("clock", "", 15)}${esc(tr("ti_card_free", fmtDate(firstFree)))}</p>
         <button class="btn sm outline" data-act="new-tip" data-on="${firstFree}"
           style="margin-top:8px">${ico("plus", "", 13)} ${esc(tr("ti_fill"))}</button>`
      : `<p class="xs mut">${esc(tr("ti_card_none"))}</p>`;

  return card(tr("ti_card"), body, tr("ti_card_d"),
    `<button class="btn sm ghost" data-nav="tips">${esc(viewLabel("tips"))}</button>`);
}

function tipDialog(tip, defaults) {
  const t = tip || { title: "", tool: "Copilot", kind: "tip", body: "", why: "",
    status: "draft", plannedFor: "", sentAt: "", channel: "teams", audience: "", notes: "",
    ...(defaults || {}) };
  const tools = [...new Set([...TIP_TOOLS, ...DB.tips.map((x) => x.tool).filter(Boolean)])];

  openDialog({
    title: tip ? tr("ti_edit") : tr("ti_new"),
    submit: tip ? tr("save") : tr("add"),
    delLabel: tip ? tr("ti_del_t") : "",
    del: tip ? () => {
      checkpoint(tr("u_tip"));
      DB.tips = DB.tips.filter((x) => x.id !== tip.id);
      save(); render(); toast(tr("dl_removed"), true);
    } : null,
    body: field(tr("ti_title"), `<input class="inp" name="title" required maxlength="140"
        value="${esc(t.title)}" placeholder="${esc(tr("ti_title_ph"))}">`) +
      `<div class="f2">
        ${field(tr("ti_tool"), combo({ id: "tip-tool", name: "tool", value: t.tool || "",
          list: tools, placeholder: "Copilot" }))}
        ${field(tr("ti_kind"), `<select class="inp" name="kind">${opts(TIP_KINDS, t.kind)}</select>`)}
        ${field(tr("ti_when"), `<input class="inp" type="date" name="plannedFor" value="${esc(t.plannedFor || "")}">`)}
        ${field(tr("ti_channel"), `<select class="inp" name="channel">${opts(TIP_CHANNELS, t.channel)}</select>`)}
      </div>
      <p class="xs mut" style="margin-top:-4px">${esc(tr("ti_when_h"))}</p>` +
      field(tr("ti_why"), `<input class="inp" name="why" maxlength="160" value="${esc(t.why || "")}"
        placeholder="${esc(tr("ti_why_ph"))}">`) +
      field(tr("ti_body"), `<textarea class="inp" name="body" rows="7"
        placeholder="${esc(tr("ti_body_ph"))}">${esc(t.body || "")}</textarea>`) +
      field(tr("dl_notes"), `<textarea class="inp" name="notes" rows="2">${esc(t.notes || "")}</textarea>`),

    onSubmit: (f) => {
      if (!f.title.trim()) return false;
      const planned = f.plannedFor || "";
      const patch = { title: f.title.trim(), tool: (f.tool || "").trim(), kind: f.kind,
        channel: f.channel, why: (f.why || "").trim(), body: f.body || "", notes: f.notes || "",
        plannedFor: planned };
      /* A date is what makes it planned, so the status follows the date rather
         than being a third thing to keep in step by hand. */
      const wasSent = tip && tip.status === "sent";
      patch.status = wasSent ? "sent" : planned ? "planned" : "draft";
      if (tip) Object.assign(tip, patch);
      else DB.tips.push({ id: uid(), createdAt: new Date().toISOString(), sentAt: "", ...patch });
      save(); render(); toast(tip ? tr("ti_saved") : tr("ti_added"));
    },
  });
}

/* ---- knowledge page -----------------------------------------------------

      aria-label="${esc(s.name)}">${ico("check", "", 11)}</button>

      <p class="row wrap" style="gap:7px;align-items:baseline">

          ? `<a class="src-n" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a>`

function viewKnowledge() {
  const f = UI.knowFilter;
  const done = roundDone();
  const week = sourcesFor("week"), month = sourcesFor("month");
  const weekDone = week.filter((s) => done.includes(s.id)).length;

  const toread = DB.articles.filter((a) => a.status === "toread");
  const year = String(new Date().getFullYear());
  const sharedThisYear = DB.articles.filter((a) =>
    a.status === "shared" && String(a.addedAt || "").startsWith(year)).length;

  const seg = (v, label) => `<button class="seg-b ${f.view === v ? "on" : ""}"
    data-act="know-view" data-v="${v}" aria-pressed="${f.view === v}">${esc(label)}</button>`;

  let body;
  if (f.view === "round") {
    const group = (title, hint, list) => list.length ? card(title,
      `<div>${list.map((s) => sourceRow(s, done)).join("")}</div>`, hint,
      `<span class="xs tab mut">${list.filter((s) => done.includes(s.id)).length}/${list.length}</span>`) : "";
    body = `<div class="grid" style="gap:14px">
      ${group(tr("n_weekly"), tr("n_weekly_d"), week)}
      ${group(tr("n_monthly"), tr("n_monthly_d"), month)}
      <div class="row wrap" style="gap:8px">
        <button class="btn sm outline" data-act="new-source">${ico("plus", "", 13)} ${esc(tr("n_addsrc"))}</button>
        ${done.length ? `<button class="btn sm ghost" data-act="round-reset">${esc(tr("n_reset"))}</button>` : ""}
      </div>
      ${card(tr("n_filter"), `<ol class="grid xs" style="gap:8px;margin:0;padding-left:18px;list-style:decimal">
        ${PILLARS.filter(([k]) => k !== "overig").map(([k, l]) =>
          `<li><b>${esc(lbl(l))}</b> — ${esc(tr(`n_pillar_${k}`))}</li>`).join("")}
      </ol>
      <p class="xs mut" style="margin-top:10px">${esc(tr("n_filter_note"))}</p>`, tr("n_filter_d"))}
    </div>`;
  } else {
    const list = DB.articles
      .filter((a) => f.folder === "all" || a.folderId === f.folder)
      .filter((a) => f.status === "all" || a.status === f.status)
      .sort((a, b) => (b.addedAt || "").localeCompare(a.addedAt || ""));

    body = `<div class="row wrap" style="gap:6px;margin-bottom:12px">
      <button class="btn sm ${f.folder === "all" ? "" : "outline"}" data-act="know-folder" data-v="all">
        ${esc(tr("n_allfolders"))} (${DB.articles.length})</button>
      ${DB.folders.map((fo) => {
        const n = DB.articles.filter((a) => a.folderId === fo.id).length;
        return `<button class="btn sm ${f.folder === fo.id ? "" : "outline"}" data-act="know-folder" data-v="${fo.id}">
          <span class="wk-dot" style="background:${slotColor(fo.slot)};display:inline-block;margin-right:6px"></span>${esc(fo.name)} (${n})</button>`;
      }).join("")}
      <button class="btn sm ghost" data-act="new-folder">${ico("plus", "", 13)} ${esc(tr("n_addfolder"))}</button>
      ${f.folder !== "all" ? `<button class="btn sm ghost" data-act="edit-folder" data-id="${f.folder}">${ico("pencil", "", 13)} ${esc(tr("n_editfolder"))}</button>` : ""}
    </div>
    <div class="row wrap" style="gap:6px;margin-bottom:14px">
      <span class="xs mut">${esc(tr("quick_filter"))}</span>
      ${[["all", tr("t_all")], ...ART_STATUS.map(([v, l]) => [v, lbl(l)])].map(([v, l]) =>
        `<button class="btn sm ${f.status === v ? "" : "outline"}" data-act="know-status" data-v="${v}"
          aria-pressed="${f.status === v}">${esc(l)}</button>`).join("")}
    </div>
    ${list.length ? `<div class="card"><div class="card-b">${list.map(articleRow).join("")}</div></div>`
      : empty(tr("n_noart"), tr("n_noart_d"),
          `<button class="btn sm" data-act="new-article" style="margin-top:10px">${ico("plus")} ${esc(tr("n_addart"))}</button>`)}`;
  }

  return pageHead(tr("nav_knowledge"), tr("n_sub"),
    `<button class="btn sm" data-act="new-article">${ico("plus")} ${esc(tr("n_addart"))}</button>`) +
  `<div class="tiles" style="margin-bottom:14px">
    ${tile(tr("n_t_round"), `${weekDone}/${week.length}`, "", tr("n_t_round_h", isoWeekKey().split("-W")[1]),
      "news", weekDone === week.length && week.length ? "var(--success)" : "var(--c1)")}
    ${tile(tr("n_t_toread"), toread.length, "", tr("n_t_toread_h"), "book",
      toread.length > 10 ? "var(--warning)" : "var(--c4)",
      { act: "know-toread", on: f.view === "articles" && f.status === "toread" })}
    ${tile(tr("n_t_shared"), sharedThisYear, "", tr("n_t_shared_h", year), "users",
      sharedThisYear >= 4 ? "var(--success)" : "var(--c3)")}
    ${tile(tr("n_t_folders"), DB.folders.length, "", tr("n_t_folders_h"), "folder", "var(--c5)")}
  </div>
  <div class="row wrap" style="gap:8px;margin-bottom:14px">
    <div class="seg">${seg("round", tr("n_v_round"))}${seg("articles", tr("n_v_articles"))}</div>
  </div>` + body;
}

/* The round on the dashboard: what is left of this week's four, and nothing
   once they are all ticked. */
function newsCard() {
  if (!viewOn("knowledge")) return "";
  const done = roundDone();
  const week = sourcesFor("week");
  if (!week.length) return "";
  const left = week.filter((s) => !done.includes(s.id));
  const toread = DB.articles.filter((a) => a.status === "toread").length;

  return card(tr("n_card"), left.length
    ? `<div>${left.slice(0, 4).map((s) => sourceRow(s, done)).join("")}</div>`
    : `<p class="sm2 row" style="gap:7px;color:var(--success)">${ico("check", "", 15)}${esc(tr("n_card_done"))}</p>`,
    `${tr("n_card_d", week.length - left.length, week.length)}${toread ? ` · ${tr("n_card_toread", toread)}` : ""}`,
    `<button class="btn sm ghost" data-nav="knowledge">${esc(tr("n_card_all"))}</button>`);
}

    del: folder ? () => {
      checkpoint(tr("u_folder"));
      const n = DB.articles.filter((a) => a.folderId === folder.id).length;

/* ---- expenses page ------------------------------------------------------
   Two short lists and an archive. What you are still owed is the headline;
   everything settled drops out of sight so the page stays the length of the
   work that is actually left.
------------------------------------------------------------------------- */
function expenseRow(x) {
  const cat = meta(ECATS, x.category);
  const next = x.status === "todo" ? "submitted" : x.status === "submitted" ? "paid" : null;
  const nextLabel = x.status === "todo" ? tr("x_mark_sub") : tr("x_mark_paid");
  const waiting = x.status === "submitted" && x.submittedAt ? daysUntil(x.submittedAt) : null;

  return `<div class="tsk" data-act="edit-expense" data-id="${x.id}">
    ${x.receipt
      ? `<img src="${x.receipt.url}" alt="" class="rcpt-th" data-act="view-receipt" data-id="${x.id}">`
      : `<span class="rcpt-th rcpt-none" title="${esc(tr("x_noreceipt"))}">${ico("camera", "", 13)}</span>`}
    <div style="min-width:0;flex:1">
      <span class="tsk-t" style="display:block;font-weight:500">${esc(x.description || lbl(cat[1]))}</span>
      <div class="tsk-m">
        <span>${esc(fmtDate(x.date))}</span>
        <span>${esc(lbl(cat[1]))}</span>
        ${waiting !== null && waiting <= -14
          ? `<span style="color:var(--warning);font-weight:500">${esc(tr("x_waiting", -waiting))}</span>` : ""}
        ${x.notes ? `<span class="trunc" style="max-width:160px">${esc(x.notes)}</span>` : ""}
      </div>
    </div>
    <div class="row" style="gap:7px">
      <span class="sm2 tab" style="font-weight:600;white-space:nowrap">${esc(eur(x.amountCents))}</span>
      ${badge(ESTATUS, x.status)}
      ${next ? `<button class="btn sm outline" data-act="exp-status" data-id="${x.id}" data-v="${next}"
        style="white-space:nowrap">${esc(nextLabel)}</button>` : ""}
    </div></div>`;
}

function viewExpenses() {
  const todo = expensesBy("todo"), sub = expensesBy("submitted"), paid = expensesBy("paid");
  const owed = expenseSum(sub);
  const year = String(new Date().getFullYear());
  const paidThisYear = expenseSum(paid.filter((x) => String(x.date || "").startsWith(year)));

  // How long the oldest unpaid claim has been sitting, whatever its state.
  const openAll = [...todo, ...sub];
  const oldest = openAll.reduce((acc, x) => {
    const d = daysUntil(x.status === "submitted" && x.submittedAt ? x.submittedAt : x.date);
    return d === null ? acc : Math.max(acc, -d);
  }, 0);

  // The archive is grouped by year so it stays scannable as it grows.
  const byYear = new Map();
  paid.forEach((x) => {
    const y = String(x.date || "").slice(0, 4) || "—";
    if (!byYear.has(y)) byYear.set(y, []);
    byYear.get(y).push(x);
  });

  const bytes = receiptBytes();

  return pageHead(tr("nav_expenses"), tr("x_sub"),
    `<button class="btn sm" data-act="new-expense">${ico("plus")} ${esc(tr("x_new"))}</button>`) +

  `<div class="tiles" style="margin-bottom:16px">
    ${tile(tr("x_t_todo"), todo.length, "", todo.length ? eur(expenseSum(todo)) : "", "receipt",
      todo.length ? "var(--warning)" : "var(--c3)")}
    ${tile(tr("x_t_owed"), eur(owed), "", tr("x_t_owed_h", sub.length), "clock",
      owed ? "var(--c1)" : "var(--c3)")}
    ${tile(tr("x_t_paid"), eur(paidThisYear), "", tr("x_t_paid_h", year), "check", "var(--success)")}
    ${tile(tr("x_t_oldest"), oldest || "—", oldest ? tr("x_days") : "", tr("x_t_oldest_h"), "alert",
      oldest >= 30 ? "var(--warning)" : "var(--c4)")}
  </div>` +

  (openAll.length ? `<div class="grid" style="gap:14px;margin-bottom:16px">
    ${todo.length ? card(tr("x_l_todo"), `<div>${todo.map(expenseRow).join("")}</div>`,
      tr("x_l_todo_d"), `<span class="sm2 tab" style="font-weight:600">${esc(eur(expenseSum(todo)))}</span>`) : ""}
    ${sub.length ? card(tr("x_l_sub"), `<div>${sub.map(expenseRow).join("")}</div>`,
      tr("x_l_sub_d"), `<span class="sm2 tab" style="font-weight:600">${esc(eur(owed))}</span>`) : ""}
  </div>`
    : empty(tr("x_none"), tr("x_none_d"),
        `<button class="btn sm" data-act="new-expense" style="margin-top:10px">${ico("plus")} ${esc(tr("x_new"))}</button>`)) +

  (paid.length ? `<details class="card" style="padding:0">
    <summary class="card-h" style="cursor:pointer;list-style:none">
      <span class="row spread" style="gap:10px">
        <span><span class="card-t">${esc(tr("x_archive"))}</span>
          <span class="card-d" style="display:block">${esc(tr("x_archive_d", paid.length))}</span></span>
        <span class="sm2 tab mut">${esc(eur(expenseSum(paid)))}</span>
      </span>
    </summary>
    <div class="card-b">
      ${[...byYear.entries()].map(([y, list]) => `<div style="margin-bottom:10px">
        <p class="lbl row spread" style="margin-bottom:3px">
          <span>${esc(y)}</span><span class="tab">${esc(eur(expenseSum(list)))}</span></p>
        ${list.map(expenseRow).join("")}
      </div>`).join("")}
    </div></details>` : "") +

  (bytes ? `<p class="xs mut" style="margin-top:12px">${esc(tr("x_storage", fmtBytes(bytes)))}
    ${bytes > 3 * 1048576 ? `<span style="color:var(--warning)">${esc(tr("x_storage_warn"))}</span>` : ""}</p>` : "");
}

function receiptDialog(id) {

  openDialog({
