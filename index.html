<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101D4F">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Joost OS">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
<style>html,body{margin:0;padding:0;min-height:100%}</style>
<title>Joost OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
/* ============================================================================
   Joost OS - standalone. Visser & Visser design system.
   Chart palette is the validated categorical set (see docs/DESIGN.md).
   Fonts degrade to the system stack with no network.
   ========================================================================== */
:root {
  --navy:#101D4F; --navy-2:#18244F; --navy-border:#2A3768;
  --navy-ink:#ECEEF2; --navy-muted:#8E99C4;

  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EEF1F6; --surface-3:#E4E9F1;
  --border:#DCE0E9; --ink:#101D4F; --ink-2:#575F75; --ink-3:#7A8199;

  --primary:#D2123F; --primary-ink:#FFFFFF; --primary-soft:#FCE7EC;
  --success:#00806E; --success-soft:#E0F4F0;
  --warning:#9A5C00; --warning-soft:#FBF0DC;
  --info:#17739B; --info-soft:#E2EEF4;

  --c1:#17739B; --c2:#EF174D; --c3:#E8A33D; --c4:#00B49C; --c5:#8A5FBF;
  --grid:#E6E9F3; --axis:#C3C8D4;

  --shadow-xs:0 1px 2px rgba(16,29,79,.06);
  --shadow-sm:0 2px 6px rgba(16,29,79,.08);
  --shadow-md:0 8px 20px rgba(16,29,79,.12);
  --shadow-lg:0 18px 40px rgba(16,29,79,.18);

  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail:232px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#070C22; --navy-2:#0E1536; --navy-border:#242F58;
    --navy-ink:#ECEEF2; --navy-muted:#8E99C4;
    --bg:#080E24; --surface:#141C40; --surface-2:#1B2450; --surface-3:#25305E;
    --border:#2A3768; --ink:#ECEEF2; --ink-2:#9AA1B3; --ink-3:#7E87A0;
    --primary:#D2123F; --primary-ink:#FFFFFF; --primary-soft:#3A0F1F;
    --success:#00B49C; --success-soft:#0C3A35;
    --warning:#E8A33D; --warning-soft:#3A2C12;
    --info:#3E9BC4; --info-soft:#12293A;
    --c1:#3E9BC4; --c2:#F2496E; --c3:#C98500; --c4:#009683; --c5:#8E6BC4;
    --grid:#232C58; --axis:#3A4578;
    --shadow-xs:0 1px 2px rgba(0,0,0,.3); --shadow-sm:0 2px 6px rgba(0,0,0,.35);
    --shadow-md:0 8px 20px rgba(0,0,0,.45); --shadow-lg:0 18px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --navy:#070C22; --navy-2:#0E1536; --navy-border:#242F58;
  --navy-ink:#ECEEF2; --navy-muted:#8E99C4;
  --bg:#080E24; --surface:#141C40; --surface-2:#1B2450; --surface-3:#25305E;
  --border:#2A3768; --ink:#ECEEF2; --ink-2:#9AA1B3; --ink-3:#7E87A0;
  --primary:#D2123F; --primary-ink:#FFFFFF; --primary-soft:#3A0F1F;
  --success:#00B49C; --success-soft:#0C3A35;
  --warning:#E8A33D; --warning-soft:#3A2C12;
  --info:#3E9BC4; --info-soft:#12293A;
  --c1:#3E9BC4; --c2:#F2496E; --c3:#C98500; --c4:#009683; --c5:#8E6BC4;
  --grid:#232C58; --axis:#3A4578;
  --shadow-xs:0 1px 2px rgba(0,0,0,.3); --shadow-sm:0 2px 6px rgba(0,0,0,.35);
  --shadow-md:0 8px 20px rgba(0,0,0,.45); --shadow-lg:0 18px 40px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.tab{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- shell --------------------------------------------------------------
   The rail stays vertical at every width: full labels on desktop, an
   icon-only rail on medium screens, and a slide-over drawer on phones.
------------------------------------------------------------------------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:4px;
  padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px));overflow:hidden auto;
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
  border-right:1px solid var(--navy-border);z-index:40;scrollbar-width:thin}
.rail::-webkit-scrollbar{width:5px}
.rail::-webkit-scrollbar-thumb{background:var(--navy-border);border-radius:9px}

/* Brand is a button: it goes home. */
.brand{display:flex;align-items:center;gap:11px;padding:7px 9px;margin-bottom:12px;
  border:0;background:none;cursor:pointer;color:inherit;width:100%;border-radius:11px;
  text-align:left;transition:background .14s}
.brand:hover{background:rgba(236,238,242,.07)}
.brand-mark{width:32px;height:32px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  background:rgba(236,238,242,.09);box-shadow:inset 0 0 0 1px rgba(236,238,242,.08)}
.brand-text{min-width:0}
.brand-name{display:block;font-weight:600;font-size:14px;letter-spacing:-.015em;
  color:var(--navy-ink);line-height:1.25}
.brand-sub{display:block;font-size:10.5px;color:var(--navy-muted);line-height:1.3;
  letter-spacing:.01em}

.nav-group{display:flex;flex-direction:column;gap:1px;margin-bottom:14px}
.nav-label{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--navy-muted);padding:0 11px 6px;opacity:.75}
.nav-btn{position:relative;display:flex;align-items:center;gap:11px;padding:8px 11px;
  border-radius:9px;background:none;border:0;cursor:pointer;color:var(--navy-muted);
  text-align:left;width:100%;font-size:13px;transition:background .14s,color .14s}
.nav-btn:hover{background:rgba(236,238,242,.07);color:var(--navy-ink)}
.nav-btn[aria-current="page"]{background:rgba(236,238,242,.11);color:#fff;font-weight:500}
/* Active marker: a crimson bar, the one brand accent in the chrome. */
.nav-btn[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:50%;
  transform:translateY(-50%);width:3px;height:17px;border-radius:0 3px 3px 0;background:var(--c2)}
.nav-btn .ico{flex:0 0 auto;opacity:.9}
.nav-btn[aria-current="page"] .ico{opacity:1}
.nav-btn .nav-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rail-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--navy-border);
  display:flex;flex-direction:column;gap:2px}
.who{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:9px;margin-top:4px}
.who-av{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:var(--c2);color:#fff;font-size:11px;font-weight:600;letter-spacing:.02em}
.who-t{min-width:0}
.who-n{display:block;font-size:12px;color:var(--navy-ink);line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-r{display:block;font-size:10px;color:var(--navy-muted);line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;display:flex;
  align-items:center;gap:8px;min-height:56px;padding:9px 20px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px) saturate(1.4);
  border-bottom:1px solid var(--border)}
.content{padding:22px 20px 56px;width:100%;max-width:1360px;margin:0 auto;flex:1}
.scrim{display:none;position:fixed;inset:0;background:rgba(8,14,36,.5);
  backdrop-filter:blur(2px);z-index:35}

/* ---- rail width is the reader's choice, not the viewport's --------------
   Collapsed is the default: icons only, 68px, still vertical. The toggle in
   the rail footer widens it to show each tab's name. The choice is stored.
------------------------------------------------------------------------- */
:root{--rail:68px}
.rail{padding-inline:9px;align-items:stretch;transition:none}
.brand{justify-content:center;padding:7px 0}
.brand-text,.nav-label,.who-t,.nav-txt,.rail-cap{display:none}
.nav-btn{justify-content:center;padding:10px 0}
.nav-btn[aria-current="page"]::before{left:-9px}
.who{justify-content:center;padding:8px 0}

html.rail-wide{--rail:236px}
html.rail-wide .rail{padding-inline:10px}
html.rail-wide .brand{justify-content:flex-start;padding:7px 9px}
html.rail-wide .brand-text,
html.rail-wide .nav-label,
html.rail-wide .who-t,
html.rail-wide .nav-txt,
html.rail-wide .rail-cap{display:block}
html.rail-wide .nav-btn{justify-content:flex-start;padding:8px 11px}
html.rail-wide .nav-btn[aria-current="page"]::before{left:-10px}
html.rail-wide .who{justify-content:flex-start;padding:8px 9px}

.rail-toggle{display:flex;align-items:center;gap:11px;width:100%;padding:8px 0;border:0;
  background:none;cursor:pointer;color:var(--navy-muted);border-radius:9px;font-size:12px;
  justify-content:center;transition:background .14s,color .14s}
.rail-toggle:hover{background:rgba(236,238,242,.07);color:var(--navy-ink)}
html.rail-wide .rail-toggle{justify-content:flex-start;padding:8px 11px}

/* On a phone 236px is most of the screen, so a wide rail floats over the
   content instead of squeezing it. */
@media (max-width:700px){
  html.rail-wide{--rail:68px}
  html.rail-wide .rail{position:fixed;left:0;top:0;width:236px;box-shadow:var(--shadow-lg);z-index:40}
  html.rail-wide .scrim{display:block}
  .content{padding:16px 14px 48px}
  .topbar{padding-inline:14px}
}

/* ---- primitives -------------------------------------------------------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow-xs);transition:box-shadow .16s,border-color .16s}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:17px 18px 11px}
.card-t{font-size:13.5px;font-weight:600;letter-spacing:-.012em}
.card-d{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.card-b{padding:0 18px 18px}
/* Only things you can act on lift on hover. */
.card.lift:hover{box-shadow:var(--shadow-sm);border-color:color-mix(in srgb,var(--ink-3) 35%,var(--border))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;
  padding:0 13px;border-radius:9px;border:1px solid transparent;background:var(--primary);
  color:var(--primary-ink);font-size:13px;font-weight:500;cursor:pointer;letter-spacing:-.005em;
  transition:filter .14s,background .14s,border-color .14s,transform .08s;white-space:nowrap;
  box-shadow:0 1px 2px rgba(16,29,79,.14)}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.ghost{background:none;color:var(--ink);border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.outline{background:var(--surface);color:var(--ink);border-color:var(--border);box-shadow:var(--shadow-xs)}
.btn.outline:hover{background:var(--surface-2);filter:none;border-color:var(--ink-3)}
.btn.navy{background:var(--navy);color:var(--navy-ink)}
.btn.sm{height:29px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.icon{width:34px;padding:0}
.btn.icon.sm{width:29px}
.btn.danger{background:none;color:var(--primary);border-color:transparent}
.btn.danger:hover{background:var(--primary-soft);filter:none}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;
  font-size:11px;font-weight:500;line-height:16px;border:1px solid transparent;white-space:nowrap}
.badge.neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--border)}
.badge.info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 25%,transparent)}
.badge.success{background:var(--success-soft);color:var(--success);border-color:color-mix(in srgb,var(--success) 25%,transparent)}
.badge.warning{background:var(--warning-soft);color:var(--warning);border-color:color-mix(in srgb,var(--warning) 25%,transparent)}
.badge.danger{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 25%,transparent)}
.badge.accent{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 25%,transparent)}

.field{display:flex;flex-direction:column;gap:5px}
.lbl{font-size:11px;font-weight:500;color:var(--ink-2)}
.inp{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);font-size:13px;width:100%}
.inp:focus{outline:2px solid var(--info);outline-offset:-1px;border-color:transparent}
textarea.inp{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
select.inp{cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}

.grid{display:grid;gap:12px}
.split{grid-template-columns:2fr 1fr;align-items:start}
.cols2{grid-template-columns:1fr 1fr;align-items:start}
.cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
@media (max-width:980px){.split,.cols2{grid-template-columns:1fr}
  #cal-grid{grid-template-columns:1fr!important}}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}
.mut{color:var(--ink-2)}
.xs{font-size:11px}
.sm2{font-size:12px}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.divide>*+*{border-top:1px solid var(--border)}

.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  flex-wrap:wrap;margin-bottom:20px}
.page-t{font-size:24px;font-weight:600;letter-spacing:-.03em;text-wrap:balance;line-height:1.2}
.page-d{font-size:12.5px;color:var(--ink-2);margin-top:5px;max-width:70ch;line-height:1.55}

.meter{height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden;position:relative}
.meter>i{display:block;height:100%;border-radius:999px;transition:width .55s cubic-bezier(0,0,.2,1)}
.meter-mark{position:absolute;top:-3px;width:2px;height:13px;border-radius:2px;
  background:var(--ink);opacity:.45}

.empty{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
  padding:32px 18px;border:1px dashed var(--border);border-radius:14px;color:var(--ink-2);
  background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.empty b{color:var(--ink);font-weight:600;font-size:13px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px}
.tile{position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:15px;padding:15px 16px;display:flex;flex-direction:column;gap:8px;
  box-shadow:var(--shadow-xs);overflow:hidden}
/* A hairline of the series colour, so a tile row reads as one system. */
.tile::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;
  background:var(--tile-accent,transparent)}
.tile-l{font-size:11.5px;font-weight:500;color:var(--ink-2);letter-spacing:-.002em}
.tile-v{font-size:27px;font-weight:600;letter-spacing:-.035em;line-height:1}
.tile-u{font-size:11.5px;color:var(--ink-2);font-weight:400}

/* A tile that filters is a button: it looks pressable and reports its state. */
button.tile{cursor:pointer;text-align:left;color:inherit;font:inherit;
  transition:box-shadow .16s,border-color .16s,transform .1s,background .16s}
button.tile:hover{box-shadow:var(--shadow-sm);border-color:var(--ink-3)}
button.tile:active{transform:translateY(.5px)}
button.tile[aria-pressed="true"]{border-color:var(--tile-accent,var(--ink-3));
  background:color-mix(in srgb,var(--tile-accent,var(--ink-3)) 7%,var(--surface));
  box-shadow:var(--shadow-sm)}
button.tile[aria-pressed="true"]::after{width:4px}
.tile-hint{font-size:10px;color:var(--ink-3);display:flex;align-items:center;gap:4px}
button.tile[aria-pressed="true"] .tile-hint{color:var(--tile-accent,var(--ink-2));font-weight:500}

/* Active filter chips - you can always see why a list is short. */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:999px;
  font-size:11.5px;font-weight:500;border:1px solid color-mix(in srgb,var(--info) 30%,transparent);
  background:color-mix(in srgb,var(--info) 10%,transparent);color:var(--info)}
.chip button{border:0;background:none;cursor:pointer;color:inherit;display:grid;place-items:center;
  width:16px;height:16px;border-radius:50%;padding:0;opacity:.7}
.chip button:hover{background:color-mix(in srgb,var(--info) 22%,transparent);opacity:1}

.seg{display:inline-flex;padding:3px;background:var(--surface-2);border-radius:10px;gap:2px;
  border:1px solid var(--border)}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:12px;
  color:var(--ink-2);cursor:pointer;transition:background .14s,color .14s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;
  box-shadow:var(--shadow-xs)}

table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-2);padding:8px 10px;background:var(--surface-2);white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
th button{background:none;border:0;cursor:pointer;color:inherit;font:inherit;display:inline-flex;
  align-items:center;gap:4px;text-transform:inherit;letter-spacing:inherit}

dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-lg);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 64px)}
dialog::backdrop{background:rgba(16,29,79,.45);backdrop-filter:blur(2px)}
.dlg-h{padding:16px 52px 10px 16px;border-bottom:1px solid var(--border);position:relative}
.dlg-t{font-size:15px;font-weight:600;letter-spacing:-.01em}
/* Every dialog gets a visible way out - Escape does not exist on a touchscreen. */
.dlg-x{position:absolute;top:12px;right:12px;width:30px;height:30px;border:0;border-radius:8px;
  background:none;cursor:pointer;color:var(--ink-2);display:grid;place-items:center;
  transition:background .14s,color .14s}
.dlg-x:hover{background:var(--surface-2);color:var(--ink)}
.dlg-b{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.dlg-f{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;
  justify-content:flex-end;flex-wrap:wrap}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.f2{grid-template-columns:1fr}}

.chk{width:16px;height:16px;flex:0 0 auto;border-radius:4px;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0;color:transparent}
.chk[aria-checked="true"]{background:var(--success);border-color:var(--success);color:#fff}

/* The tile itself is the click target, so it has to look like one. */
.tsk{display:flex;align-items:flex-start;gap:10px;padding:8px 6px;border-radius:8px;cursor:pointer}
.tsk:hover{background:var(--surface-2)}
.tsk .chk,.tsk .badge{cursor:default}
.tsk .chk{cursor:pointer}
.tsk-t{font-size:13px;text-align:left;background:none;border:0;padding:0;cursor:pointer;
  color:inherit;width:100%}
.tsk.done .tsk-t{color:var(--ink-2);text-decoration:line-through}
.tsk-m{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:11px;color:var(--ink-2)}

/* Receipt thumbnail: fixed square so a portrait phone photo and a landscape
   scan line up down the list. */
.rcpt-th{width:34px;height:34px;flex:0 0 auto;border-radius:7px;object-fit:cover;
  border:1px solid var(--border);background:var(--surface-2);cursor:zoom-in}
.rcpt-none{display:flex;align-items:center;justify-content:center;color:var(--ink-3);cursor:inherit}

/* The rename pencil only appears once you go looking for it: on hover, on
   focus, and always on a touch screen where there is no hover. */
.page-t-edit{display:inline-flex;align-items:center;gap:7px}
.page-pen{background:none;border:0;padding:3px;border-radius:6px;cursor:pointer;
  color:var(--ink-3);opacity:0;transition:opacity .12s}
.page-t-edit:hover .page-pen,.page-pen:focus-visible{opacity:1}
.page-pen:hover{color:var(--ink);background:var(--surface-2)}
@media (hover:none){.page-pen{opacity:.55}}

/* A sending slot: the date keeps its own column so a filled and an empty slot
   line up down the list. */
.slot-d{display:flex;flex-direction:column;gap:1px;width:92px;flex:0 0 auto;
  padding-left:4px;border-left:3px solid var(--border)}
.slot-d.full{border-left-color:var(--success)}

/* Created against completed: two thin bars per week, eight weeks wide. */
.flow-w{display:flex;align-items:flex-end;gap:2px;flex:1;height:100%}
.flow-b{display:block;flex:1;min-height:2px;border-radius:2px 2px 0 0}

/* Stipje voor een mailbericht: ontvangen of verzonden. */
.ml-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:7px;background:var(--c1)}
.ml-dot.sent{background:var(--c4)}

/* Stipje voor een deelnemer: blauw voor eigen huis, amber voor extern. */
.att-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:5px}

/* A news source: the tick box on the left keeps its own column so the
   description can wrap under the name without stepping under the box. */
.src{display:flex;align-items:flex-start;gap:10px;padding:9px 6px;border-radius:8px;
  border-bottom:1px solid var(--border)}
.src:last-child{border-bottom:0}
.src:hover{background:var(--surface-2)}
.src.read .src-n,.src.read p{opacity:.5}
.src-n{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;
  border-bottom:1.5px solid color-mix(in srgb,var(--primary) 45%,transparent)}
a.src-n:hover{border-bottom-color:var(--primary)}

/* The S, M, A, R, T letter in front of each line of the write-up. */
.smart-k{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
  border-radius:5px;color:#fff;font-size:10px;font-weight:700;flex:0 0 auto}
details > summary::-webkit-details-marker{display:none}

.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.board::-webkit-scrollbar{height:8px}
.board::-webkit-scrollbar-thumb{background:var(--axis);border-radius:9px}
.col{flex:0 0 276px;background:color-mix(in srgb,var(--surface-2) 62%,transparent);
  border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;
  min-height:130px;transition:border-color .16s,background .16s}
.col.over{border-color:var(--primary);background:var(--primary-soft);border-style:dashed}
.col-h{display:flex;align-items:center;gap:8px;padding:11px 12px 9px;position:relative}
/* Each column carries its status colour as a top rule. */
.col-h::before{content:"";position:absolute;left:12px;right:12px;top:0;height:2px;
  border-radius:0 0 2px 2px;background:var(--col-accent,var(--axis))}
.col-b{display:flex;flex-direction:column;gap:8px;padding:0 9px 9px;flex:1}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 11px;
  cursor:grab;box-shadow:var(--shadow-xs);transition:box-shadow .16s,transform .12s,border-color .16s}
.kcard:hover{box-shadow:var(--shadow-sm);border-color:var(--ink-3)}
.kcard:active{cursor:grabbing}
.kcard.drag{opacity:.35;transform:rotate(1.2deg)}

/* ---- running-timer pill (topbar, visible on every screen) -------------- */
.pill{display:flex;align-items:center;gap:2px;min-width:0;padding:2px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--c2) 35%,transparent);
  background:color-mix(in srgb,var(--c2) 10%,var(--surface));box-shadow:var(--shadow-xs)}
.pill-main{display:flex;align-items:center;gap:8px;min-width:0;border:0;background:none;
  cursor:pointer;color:inherit;padding:4px 4px 4px 10px;border-radius:999px;font:inherit}
.pill-main:hover{background:color-mix(in srgb,var(--c2) 12%,transparent)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pill-dot{animation:none}}
.pill-txt{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.pill-time{font-family:var(--mono);font-size:12.5px;font-weight:500;flex:0 0 auto;
  font-variant-numeric:tabular-nums}
.pill-stop{width:26px;height:26px;flex:0 0 auto;border:0;border-radius:50%;cursor:pointer;
  background:var(--c2);color:#fff;display:grid;place-items:center;padding:0}
.pill-stop:hover{filter:brightness(1.1)}
.pill-btn{width:26px;height:26px;flex:0 0 auto;border:0;border-radius:50%;cursor:pointer;
  background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink);
  display:grid;place-items:center;padding:0;transition:background .14s}
.pill-btn:hover{background:color-mix(in srgb,var(--ink) 18%,transparent)}
.pill-flag{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-2);flex:0 0 auto}
.pill-warn{color:var(--warning);display:grid;place-items:center;padding:0 5px}
/* Paused reads as held, not running: no pulse, neutral ground. */
.pill.paused{border-color:var(--border);background:var(--surface-2)}
.pill.paused .pill-dot{animation:none}
.pill.paused .pill-time{color:var(--ink-2)}
@media (max-width:640px){.pill-txt{display:none}}

/* ---- working hours ----------------------------------------------------- */
.timer-card{border:1px solid var(--border);border-radius:16px;background:var(--surface);
  padding:16px;box-shadow:var(--shadow-xs)}
.timer-card.live{border-color:color-mix(in srgb,var(--c2) 40%,transparent);
  background:color-mix(in srgb,var(--c2) 5%,var(--surface))}
.timer-card.held{border-color:var(--border);background:var(--surface-2)}
.timer-live{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1}
.day{border:1px solid var(--border);border-radius:14px;overflow:hidden}
.day-h{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--surface-2)}
.day-n{font-size:12.5px;font-weight:600}
.day-d{font-size:11px;color:var(--ink-2)}
.day-t{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:500;
  font-variant-numeric:tabular-nums}
.ent{display:grid;grid-template-columns:9px 1fr auto auto;gap:10px;align-items:center;
  padding:8px 13px;border-top:1px solid var(--border);background:none;width:100%;
  text-align:left;color:inherit;cursor:pointer;font:inherit}
.ent:hover{background:var(--surface-2)}
.ent-dot{width:9px;height:9px;border-radius:3px}
.ent-t{min-width:0}
.ent-d{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent-c{font-size:10.5px;color:var(--ink-2)}
.ent-h{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.afas{font-family:var(--mono);font-size:11.5px;line-height:1.75;white-space:pre;
  overflow-x:auto;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:12px 13px;margin:0}
@media (max-width:560px){.ent{grid-template-columns:9px 1fr auto;row-gap:4px}
  .ent>:last-child{grid-column:2/-1;justify-self:start}}

/* ---- meeting rows ------------------------------------------------------ */
.mtg{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;width:100%;
  padding:9px 11px;border:1px solid transparent;border-radius:12px;background:none;
  text-align:left;color:inherit;cursor:pointer;font:inherit;transition:background .14s,border-color .14s}
.mtg:hover{background:var(--surface-2);border-color:var(--border)}
.mtg.next{background:color-mix(in srgb,var(--primary) 5%,transparent);
  border-color:color-mix(in srgb,var(--primary) 22%,transparent)}
.mtg.soon .mtg-time{color:var(--primary)}
.mtg-when{display:flex;flex-direction:column;align-items:flex-start;gap:1px}
/* The time is the thing you scan for, so it gets the size. */
.mtg-time{font-size:19px;font-weight:600;letter-spacing:-.03em;line-height:1.05;
  font-variant-numeric:tabular-nums}
.mtg-date{font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.mtg-body{min-width:0}
/* The title is what you read; let it use two lines rather than be cut off
   by the badges beside it. */
.mtg-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  line-clamp:2;overflow:hidden;font-size:13.5px;font-weight:500;line-height:1.35}
.mtg-right{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end;
  max-width:45%}
/* Day heading inside a week block. */
.dayhead{display:flex;align-items:baseline;gap:8px;padding:10px 11px 4px}
.dayhead-t{font-size:12px;font-weight:600;letter-spacing:-.005em}
/* Camera mark on a row that has a join link. */
.mtg-cam{display:inline-grid;place-items:center;vertical-align:-2px;margin-right:6px;
  width:18px;height:18px;border-radius:5px;color:var(--info);
  background:color-mix(in srgb,var(--info) 13%,transparent)}
/* An anchor styled as a button needs the button's own line-height rules. */
a.btn{text-decoration:none}
@media (max-width:620px){
  .mtg{grid-template-columns:52px 1fr;row-gap:6px}
  .mtg-right{grid-column:2/-1;justify-content:flex-start}
}

/* ---- weekrooster in de agenda -------------------------------------------
   De dagen staan naast elkaar en een afspraak staat op de hoogte van zijn
   eigen tijd, zoals in Outlook. De uurhoogte komt als --cw-hp mee, zodat de
   lijnen en de blokken van dezelfde maat uitgaan.
------------------------------------------------------------------------- */
/* Op een smal scherm worden de dagkolommen onleesbaar dun. Dan schuift het
   rooster liever zijwaarts dan dat het zichzelf platdrukt; de drie roosters
   erin houden dezelfde kolommen, dus ze schuiven als één geheel mee. */
.cw-wrap{overflow-x:auto;overflow-y:hidden;margin:0 -2px;padding:0 2px}
.cw{--cw-hp:46px}
.cw-head,.cw-allday,.cw-grid{display:grid;gap:1px}
.cw-dh{padding:5px 4px;text-align:center;border-radius:9px 9px 0 0;background:var(--surface-2)}
.cw-dh.wknd{background:var(--surface-3)}
.cw-dh.today{background:color-mix(in srgb,var(--primary) 13%,transparent)}
.cw-dn{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.cw-dd{display:block;font-size:17px;font-weight:600;letter-spacing:-.035em;line-height:1.15}
.cw-dh.today .cw-dd,.cw-dh.today .cw-dn{color:var(--primary)}
.cw-allday{margin-top:1px;background:var(--border)}
.cw-adl{display:flex;align-items:center;justify-content:flex-end;padding-right:7px;
  font-size:9.5px;color:var(--ink-2);background:var(--surface-2)}
.cw-adc{display:grid;gap:2px;padding:2px;min-height:24px;background:var(--surface)}
.cw-grid{margin-top:1px;background:var(--border);border-radius:0 0 12px 12px;overflow:hidden}
.cw-hours{position:relative;background:var(--surface-2)}
/* Het uur staat net onder zijn eigen lijn; boven de lijn zou het eerste label
   half buiten het rooster vallen. */
.cw-h{position:absolute;right:7px;font-size:9.5px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;line-height:1.1;padding-top:2px}
.cw-col{position:relative;background-color:var(--surface);
  background-image:linear-gradient(to bottom,var(--border) 1px,transparent 1px);
  background-size:100% var(--cw-hp)}
.cw-col.wknd{background-color:var(--surface-2)}
/* Een afspraak. De categoriekleur zit in --cw-c; zonder categorie is dat de
   accentkleur, zodat een blok nooit kleurloos is. */
/* Een knop centreert zijn inhoud vanzelf; in een blok van anderhalf uur komt
   de tekst dan in het midden te hangen. Vandaar flex, van boven af. */
.cw-ev,.cw-ad{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
  --cw-c:var(--axis);border:0;border-left:3px solid var(--cw-c);
  background:color-mix(in srgb,var(--cw-c) 15%,var(--surface));
  color:inherit;font:inherit;text-align:left;cursor:pointer;overflow:hidden;
  padding:2px 5px;border-radius:6px;transition:filter .14s}
.cw-ev:hover,.cw-ad:hover{filter:brightness(.95)}
.cw-ev{position:absolute;min-height:16px}
.cw-ev.done{opacity:.62}
.cw-ad{font-size:11px;font-weight:500;line-height:1.5;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.cw-et{display:block;font-size:9.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;
  line-height:1.3}
.cw-en{display:block;font-size:11.5px;font-weight:500;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis}
/* De lijn van nu, alleen op de dag van vandaag. */
.cw-now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--primary);z-index:3}
.cw-now::before{content:"";position:absolute;left:-1px;top:-4px;width:7px;height:7px;
  border-radius:50%;background:var(--primary)}
/* Het vierkantje dat een categorie aanduidt, ook in de lijst en de popup. */
/* Het randje houdt een lichte kleur als geel zichtbaar op een witte kaart. */
.cat-dot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.cat-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;
  border:1px solid var(--border);border-radius:999px;background:var(--surface-2);
  font-size:11px;color:var(--ink);cursor:pointer;font-family:inherit}
.cat-chip:hover{border-color:var(--ink-2)}
/* Aanvinken in het dialoogvenster van een afspraak. Het vakje zelf blijft
   zichtbaar, zodat het ook zonder :has() duidelijk is wat aan staat. */
.cat-pick{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 8px;
  border:1px solid var(--border);border-radius:999px;background:var(--surface);
  font-size:11.5px;cursor:pointer;transition:border-color .14s,background .14s}
.cat-pick:hover{border-color:var(--ink-2)}
.cat-pick input{width:14px;height:14px;margin:0;flex:none;accent-color:var(--cw-c)}
.cat-pick:has(input:checked){border-color:var(--cw-c);
  background:color-mix(in srgb,var(--cw-c) 12%,var(--surface));font-weight:500}
/* Een kleurvakje: je kiest de kleur, niet de naam ervan. */
.sw{position:relative;display:inline-block;cursor:pointer;line-height:0}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sw span{display:block;width:28px;height:28px;border-radius:8px;background:var(--c);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw input:checked+span{box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),
  0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.sw input:focus-visible+span{outline:2px solid var(--primary);outline-offset:3px}
@media (max-width:760px){
  .cw-en{font-size:10.5px}
  .cw-dd{font-size:14px}
}

/* ---- my planning ------------------------------------------------------- */
.wk{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;
  padding:10px 12px;border-radius:12px;border:1px solid transparent;background:none;
  width:100%;text-align:left;color:inherit;cursor:pointer;transition:background .14s,border-color .14s}
.wk:hover{background:var(--surface-2);border-color:var(--border)}
.wk.now{background:color-mix(in srgb,var(--info) 8%,transparent);
  border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.wk.free{opacity:.72}
.wk-n{display:flex;flex-direction:column;gap:1px}
.wk-w{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.wk-d{font-size:10.5px;color:var(--ink-2)}
.wk-c{min-width:0;display:flex;align-items:center;gap:9px}
.wk-dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
/* One chip per working day, so a split week reads at a glance. */
.daystrip{display:flex;gap:2px;flex:0 0 auto}
.daychip{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;
  font-size:8.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  box-shadow:inset 0 0 0 1px rgba(16,29,79,.08)}
@media (max-width:560px){.daychip{width:16px;height:16px;font-size:7.5px}}
.wk-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-eng{font-size:10.5px;color:var(--ink-2)}
.mon{display:flex;align-items:center;gap:10px;margin:18px 0 6px}
.mon-t{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.mon-r{flex:1;height:1px;background:var(--border)}
/* Capacity strip: one bar per week across the horizon. Tall enough to read
   as the main thing on the page, and every bar is its own control. */
.strip{position:relative;display:flex;gap:3px;height:168px;align-items:flex-end;
  padding-top:30px;overflow:visible}
.bar{position:relative;flex:1 1 0;min-width:5px;height:100%;display:flex;align-items:flex-end;
  border:0;background:none;padding:0;cursor:pointer}
/* The fill is the week; the bands inside it are its days, Monday at the top. */
.bar-fill{width:100%;border-radius:4px 4px 0 0;background:var(--axis);overflow:hidden;
  display:flex;flex-direction:column;
  transition:transform .13s cubic-bezier(0,0,.2,1),filter .13s,box-shadow .13s;
  transform-origin:bottom}
.bar-day{flex:1 1 0;min-height:2px;width:100%;box-shadow:inset 0 -1px 0 rgba(255,255,255,.28)}
.bar-day:last-child{box-shadow:none}
.tip-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.tip-row i{width:7px;height:7px;border-radius:2px;flex:0 0 auto;
  box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.bar:hover .bar-fill{transform:translateY(-4px);filter:brightness(1.12);
  box-shadow:0 4px 12px rgba(16,29,79,.22)}
.bar.now .bar-fill{box-shadow:inset 0 0 0 2px var(--ink)}
.bar-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .13s;z-index:6;
  background:var(--navy);color:var(--navy-ink);padding:5px 9px;border-radius:8px;
  font-size:11px;line-height:1.45;box-shadow:var(--shadow-md);text-align:left}
.bar-tip b{display:block;font-weight:600}
.bar:hover .bar-tip,.bar:focus-visible .bar-tip{opacity:1}
/* Keep the first and last tooltips inside the card. */
.bar:first-child .bar-tip{left:0;transform:none}
.bar:last-child .bar-tip{left:auto;right:0;transform:none}
.strip-ticks{display:flex;gap:3px;margin-top:7px}
.strip-ticks span{flex:1 1 0;min-width:5px;font-size:9.5px;color:var(--ink-3);text-align:center;
  overflow:hidden;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.bar-fill{transition:none}}
@media (max-width:560px){.wk{grid-template-columns:64px 1fr;row-gap:6px}
  .wk>:last-child{grid-column:1/-1}}
.kcard-t{font-size:12px;line-height:1.4;background:none;border:0;padding:0;text-align:left;
  color:inherit;cursor:pointer;width:100%}

.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border);
  border-left:1px solid var(--border)}
.cal-hd{padding:6px;text-align:center;font-size:10px;font-weight:600;color:var(--ink-2);
  border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface-2)}
.cal-d{min-height:78px;padding:5px;border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);background:none;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;color:inherit}
.cal-d:hover{background:var(--surface-2)}
.cal-d.out{background:var(--surface-2);color:var(--ink-3)}
.cal-d.sel{box-shadow:inset 0 0 0 2px var(--primary)}
.cal-n{font-size:11px}
.cal-n.today{background:var(--navy);color:var(--navy-ink);border-radius:999px;width:19px;
  height:19px;display:grid;place-items:center;font-weight:600}
.cal-p{font-size:10px;line-height:1.3;background:var(--surface-3);border-radius:4px;

const tr = (k, ...a) => {
  const v = STR[k]; if (!v) return k;
  return String(v[LANG === "nl" ? 1 : 0]).replace(/\{(\d)\}/g, (_, i) => a[i] ?? "");
};
const plural = (n, one, many) => tr(n === 1 ? one : many);

const MONTHS_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_NL = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const WEEKDAYS_EN = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const WEEKDAYS_NL = ["ma","di","wo","do","vr","za","zo"];
let MONTHS = MONTHS_NL, WEEKDAYS = WEEKDAYS_NL, LOCALE = "nl-NL";

function applyLang(lang) {
  LANG = lang === "en" ? "en" : "nl";
  MONTHS = LANG === "nl" ? MONTHS_NL : MONTHS_EN;
  WEEKDAYS = LANG === "nl" ? WEEKDAYS_NL : WEEKDAYS_EN;
  LOCALE = LANG === "nl" ? "nl-NL" : "en-GB";
  document.documentElement.lang = LANG;
}

function fmtDate(s) {
  if (!s) return "";
  const d = daysUntil(s);
  if (d === 0) return tr("today");
  if (d === 1) return tr("tomorrow");
  if (d === -1) return tr("yesterday");
  const dt = parseD(s);
  return `${dt.getDate()} ${MONTHS[dt.getMonth()]}` +
    (dt.getFullYear() !== new Date().getFullYear() ? ` ${dt.getFullYear()}` : "");
}
function fmtDateTime(s) {
  const d = new Date(s);
  return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fmtTime(s) { const d = new Date(s); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function mondayOf(date = new Date()) {
  const d = new Date(date); const wd = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - wd); return iso(d);
}
function yearElapsed() {
  const now = new Date(), start = new Date(now.getFullYear(), 0, 1);
  return Math.round(((now - start) / 864e5 / 365) * 100);
}

/* ---- priority scoring (port of src/lib/priority.ts) --------------------- */
const W = { urgency: 35, flag: 25, strategic: 20, goal: 12, momentum: 8 };
const FLAG = { low: 0, medium: 0.45, high: 0.75, critical: 1 };
const MOMENTUM = { in_progress: 1, next: .7, planned: .4, inbox: .15, waiting: .1, done: 0 };

function urgency(due) {
  const d = daysUntil(due);
  if (d === null) return .15;
  if (d < 0) return Math.min(1, .85 + Math.abs(d) * .03);
  if (d === 0) return .85;
  if (d <= 2) return .7;
  if (d <= 7) return .5;
  if (d <= 14) return .3;
  if (d <= 21) return .15;
  return .05;
}
function scoreTask(t) {
  if (t.status === "done") return 0;
  const proj = t.projectId ? DB.projects.find((p) => p.id === t.projectId) : null;
  const sv = proj ? proj.strategicValue : 0;
  const raw =
    urgency(t.dueDate) * W.urgency +
    (FLAG[t.priority] ?? .45) * W.flag +
    (sv > 0 ? ((sv - 1) / 4) * W.strategic : 0) +
    (t.goalId ? W.goal : 0) +
    (MOMENTUM[t.status] ?? 0) * W.momentum;
  return Math.round(clamp(raw, 0, 100) * 100) / 100;
}
const band = (s) => s >= 65 ? [["Now","Nu"], "danger"]
  : s >= 40 ? [["Soon","Binnenkort"], "warning"] : [["Later","Later"], "neutral"];

/* ---- goal progress (port of goal_progress() in 0003_functions.sql) ------ */
function goalProgress(goalId) {
  const g = DB.goals.find((x) => x.id === goalId);
  if (!g) return 0;
  if (g.manualProgress !== null && g.manualProgress !== undefined) return g.manualProgress;

  let numr = 0, den = 0;
  const ms = DB.milestones.filter((m) => m.goalId === goalId);
  if (ms.length) { numr += 2 * (ms.filter((m) => m.done).length / ms.length) * 100; den += 2; }

  const ts = DB.tasks.filter((t) => t.goalId === goalId);
  if (ts.length) { numr += 1 * (ts.filter((t) => t.status === "done").length / ts.length) * 100; den += 1; }

  const ks = DB.kpis.filter((k) => k.goalId === goalId && k.target);
  if (ks.length) {
    const att = ks.map((k) => Math.min(100, (kpiYtd(k.id) / k.target) * 100));
    numr += 2 * (att.reduce((a, b) => a + b, 0) / att.length); den += 2;
  }
  return den === 0 ? 0 : Math.round(clamp(numr / den, 0, 100));
}
const kpiEntries = (kpiId) => DB.kpiEntries.filter((e) => e.kpiId === kpiId)
  .sort((a, b) => a.period.localeCompare(b.period));
const kpiYtd = (kpiId) => kpiEntries(kpiId)
  .filter((e) => e.period.startsWith(String(new Date().getFullYear())))
  .reduce((s, e) => s + Number(e.value), 0);

function workload() {
  const t = DB.tasks, open = t.filter((x) => x.status !== "done");
  const wk = addDays(7);
  return {
    open: open.length,
    inProgress: t.filter((x) => x.status === "in_progress").length,
    waiting: t.filter((x) => x.status === "waiting").length,
    inbox: t.filter((x) => x.status === "inbox").length,
    overdue: open.filter((x) => overdue(x.dueDate)).length,
    dueToday: open.filter((x) => x.dueDate === TODAY()).length,
    next7: open.filter((x) => x.dueDate && x.dueDate >= TODAY() && x.dueDate <= wk).length,
    done7: t.filter((x) => x.status === "done" && x.completedAt && x.completedAt >= addDays(-7)).length,
    hours7: open.filter((x) => x.dueDate && x.dueDate >= TODAY() && x.dueDate <= wk)
      .reduce((s, x) => s + (x.estimate || 0), 0) / 60,
  };
}

/* ---- planning horizon --------------------------------------------------
   Every Monday from the start of this week through the end of summer 2027
   (31 August 2027). One row per week; a week with no client is capacity.
------------------------------------------------------------------------- */
const HORIZON_END = "2027-08-31";
function planningWeeks() {
  const out = [];
  let d = parseD(mondayOf());
  const end = parseD(HORIZON_END);
  while (d <= end) { out.push(iso(d)); d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7); }
  return out;
}
/* Counted in UTC on purpose: between January and September the clocks move
   an hour for summer time, and measuring local dates loses that hour, which
   is enough to report the week before. */
function isoWeekNo(monday) {
  const [y, m, d] = String(monday).split("-").map(Number);
  const thursday = Date.UTC(y, m - 1, d + 3);        // the Thursday decides the year
  const jan1 = Date.UTC(new Date(thursday).getUTCFullYear(), 0, 1);
  return Math.floor((thursday - jan1) / 6048e5) + 1;
}
/* The same number for any day, not just a Monday: the week a date belongs to
   is the week of the Monday before it. */
const weekNoOf = (day) => isoWeekNo(mondayOf(parseD(day)));

/* Een categorie die nergens is vastgelegd krijgt een kleur op basis van zijn
   naam. Niet willekeurig: dan blijft hij na herladen dezelfde. */
const catFallback = (naam) => {
  let som = 0;
  const s = String(naam ?? "");
  for (let i = 0; i < s.length; i++) som = (som * 31 + s.charCodeAt(i)) >>> 0;
  return CAT_COLORS[som % CAT_COLORS.length][0];
};

  const c = catFind(naam);
  if (c && CAT_COLORS.some(([k]) => k === c.color)) return c.color;
  return catFallback(naam);
};

function catEnsure(namen) {
  DB.categories = DB.categories || [];

  (namen || []).forEach((n) => {
    const naam = String(n ?? "").trim();
    if (!naam || catFind(naam)) return;
    DB.categories.push({ id: uid(), name: naam, color: catFallback(naam) });
    nieuw = true;
  });
  return nieuw;
}

/* The next N sending days. With a fortnightly rhythm the week number decides
   which weeks count, so the pattern stays put instead of drifting whenever
   you happen to open the page. */
function tipSlots(n = 6) {
  const { everyWeeks, weekday } = tipPlan();
  const out = [];

  return out;
}

/* A photo of a receipt straight off a phone is three to eight megabytes, and
   the whole workspace has to fit in about five. Scaling the long edge to
   1600px and re-encoding as JPEG brings a receipt down to a few hundred
   kilobytes while staying readable enough to hand in. */
const RECEIPT_EDGE = 1600;
const RECEIPT_QUALITY = 0.72;

function readReceipt(file) {
  return new Promise((resolve, reject) => {
    if (!file.type || !file.type.startsWith("image/")) { reject(new Error("type")); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode"));
      img.onload = () => {
        const scale = Math.min(1, RECEIPT_EDGE / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        const ctx = cv.getContext("2d");
        // Scanned receipts are usually on white; without this, transparent
        // corners of a PNG come out black once it is a JPEG.
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let url;
        try { url = cv.toDataURL("image/jpeg", RECEIPT_QUALITY); }
        catch (e) { reject(new Error("encode")); return; }
        resolve({ name: file.name || "bon.jpg", w, h, url,
          bytes: Math.round((url.length - url.indexOf(",") - 1) * 0.75) });
      };
      img.src = String(reader.result || "");
    };
    reader.readAsDataURL(file);
  });
}

/* ---- storage ----------------------------------------------------------- */
const KEY = "joost-os-v1";
let DB;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { DB = JSON.parse(raw); migrate(); return; }
  } catch (e) { /* private mode or blocked storage - fall through to seed */ }
  DB = seed();
  /* A new workspace runs the same backfills as a saved one. Without this,
     anything added to migrate() but forgotten in seed() is missing on a fresh
     install only - which is the one case that is easiest not to notice. */
  migrate();
  save();
}
/* Backfills anything a workspace saved by an earlier build is missing, so an
   existing browser picks up new modules without losing its data. */
function migrate() {
  let changed = false;
  /* These backfills are for a workspace saved before the module existed, so
     they test for a missing key and not for an empty one. An empty list is a
     deliberate state now that the example data can be cleared - refilling it
     would put the examples straight back on the next reload. */
  if (!Array.isArray(DB.clients)) { DB.clients = []; changed = true; }
  if (!Array.isArray(DB.planning)) { DB.planning = seedPlanning(); changed = true; }
  // Extend the horizon whenever the saved plan stops short of summer 2027.
  {
    const have = new Set(DB.planning.map((p) => p.week));
    planningWeeks().forEach((wk) => {
      if (!have.has(wk)) {
        DB.planning.push({ id: uid(), week: wk, clientId: null, engagement: "intern",
          hours: DB.profile.capacity || 36, status: "concept", notes: "" });
        changed = true;
      }
    });
  }
  if (!DB.reviews) { DB.reviews = {}; changed = true; }
  // Expense claims start empty on purpose: example receipts would only be in
  // the way of the first real one.
  if (!Array.isArray(DB.expenses)) { DB.expenses = []; changed = true; }

  /* The sixteen sources are seeded once. Delete them and they stay deleted -
     an empty list is a choice, a missing one is an old workspace. */
  if (!Array.isArray(DB.sources)) { DB.sources = seedSources(); changed = true; }
  if (!Array.isArray(DB.folders)) { DB.folders = []; changed = true; }
  if (!Array.isArray(DB.articles)) { DB.articles = []; changed = true; }
  if (!Array.isArray(DB.tips)) { DB.tips = []; changed = true; }
  if (!DB.agendaSync || typeof DB.agendaSync !== "object") {
    DB.agendaSync = { folder: "", lastAt: "", lastFile: "", auto: true }; changed = true;
  }
  if (!DB.tipPlan || typeof DB.tipPlan !== "object") { DB.tipPlan = { everyWeeks: 1, weekday: 4 }; changed = true; }
  if (!DB.newsRound || typeof DB.newsRound !== "object") { DB.newsRound = {}; changed = true; }
  else {
    /* Ticks are kept per week and never cleaned up on their own, so the last
       twelve stay and the rest go. */
    const keys = Object.keys(DB.newsRound).sort().reverse();
    keys.slice(12).forEach((k) => { delete DB.newsRound[k]; changed = true; });
  }
  /* De categorieën worden één keer gezaaid met wat er in Outlook staat.
     Daarna zijn ze van jou: een lege lijst is een keuze, een ontbrekende
     lijst is een werkruimte van voor deze module. */
  if (!Array.isArray(DB.categories)) { DB.categories = seedCategories(); changed = true; }
  /* Een heel korte tussenstand bewaarde de kleuren los van de namen. Die
     worden hier opgenomen in de lijst zelf. */
  if (DB.catColors && typeof DB.catColors === "object") {
    Object.entries(DB.catColors).forEach(([naam, kleur]) => {
      if (!CAT_COLORS.some(([k]) => k === kleur)) return;
      const c = catFind(naam);
      if (c) c.color = kleur;
      else DB.categories.push({ id: uid(), name: naam, color: kleur });
    });
    delete DB.catColors; changed = true;
  }
  // Alles wat de agenda ooit aanleverde hoort ook in de lijst te staan.
  if (catEnsure(DB.meetings.flatMap((m) => m.categories || []))) changed = true;
  if (!Array.isArray(DB.timeEntries)) { DB.timeEntries = []; changed = true; }
  if (DB.timer === undefined) { DB.timer = null; changed = true; }
  if (!Array.isArray(DB.engagements)) { DB.engagements = []; changed = true; }
  if (!Array.isArray(DB.profile.workDays)) { DB.profile.workDays = [0, 1, 2, 3, 4]; changed = true; }
  if (DB.profile.fte === undefined) { DB.profile.fte = 1; changed = true; }
  if (DB.profile.freeDay === undefined) { DB.profile.freeDay = null; changed = true; }
  if (DB.profile.studyDay === undefined) { DB.profile.studyDay = null; changed = true; }
  if (!Array.isArray(DB.profile.hiddenViews)) { DB.profile.hiddenViews = []; changed = true; }
  if (!AGENDA_VIEWS.some(([k]) => k === DB.profile.agendaView)) {
    DB.profile.agendaView = "default"; changed = true;
  }
  if (!DB.profile.viewNames || typeof DB.profile.viewNames !== "object") {
    DB.profile.viewNames = {}; changed = true;
  }
  if (!Array.isArray(DB.profile.dashboard)) {
    DB.profile.dashboard = DASH_DEFAULT.map((b) => ({ ...b })); changed = true;
  }
  if (DB.backup && !BACKUP_EVERY.includes(Number(DB.backup.everyDays))) {
    DB.backup.everyDays = BACKUP_STALE_DAYS; changed = true;
  }
  /* Meetings imported before the join link was understood still carry the
     invite text in their notes, so the link can be recovered from there. */
  DB.meetings.forEach((m) => {
    if (m.onlineUrl) return;
    const found = findMeetingUrl({ location: m.location, description: m.notes });
    if (!found) return;
    m.onlineUrl = found;
    m.notes = stripJoinBlurb(m.notes);
    changed = true;
  });

  // A timer saved before pausing existed has no segment fields yet.
  if (DB.timer && DB.timer.runningSince === undefined) {
    DB.timer.runningSince = DB.timer.startedAt;
    DB.timer.accumulatedMs = 0;
    changed = true;
  }

  /* `since` dates the workspace so "never backed up" can be aged from
     something, instead of nagging a workspace that is an hour old. */
  if (!DB.backup) {
    DB.backup = { at: null, since: new Date().toISOString() };
    changed = true;
  }
  if (changed) save();
}
/* ---- undo ---------------------------------------------------------------
   One step back, and only for the thing that was just destroyed. The snapshot
   lives in memory: a second copy in storage would double what the workspace
   costs and risk the quota, and an undo that survives a reload is not what
   anyone expects from a toast.

   It holds the whole workspace rather than the removed record, because a
   delete is rarely one row - removing a project also detaches its tasks, and
   putting those back one by one is how you end up with half a restore.
------------------------------------------------------------------------- */
let UNDO = null;        // { json, label }
let undoPending = false;

function checkpoint(label) {
  try { UNDO = { json: JSON.stringify(DB), label }; undoPending = true; }
  catch (e) { UNDO = null; undoPending = false; return; }
  /* One operation can write more than once - restoring a backup also runs the
     migration - so the window stays open for the rest of this interaction and
     closes as soon as the browser goes idle. */
  setTimeout(() => { undoPending = false; }, 0);
}

function undoLast() {
  if (!UNDO) { toast(tr("undo_gone")); return; }
  const snap = UNDO;
  UNDO = null;
  let restored;
  try { restored = JSON.parse(snap.json); }
  catch (e) { toast(tr("undo_gone")); return; }
  DB = restored;
  save(); render();
  toast(tr("undo_done", snap.label));
}

function save() {
  /* Any write that is not part of the operation the snapshot was taken for
     makes it stale: restoring then would silently throw away the newer
     change. So the offer lasts exactly until you do something else. */
  if (UNDO && !undoPending) UNDO = null;
  /* Reports success, because a receipt photo can push the workspace past what
     the browser will store and the caller then has to put it back. */
  try { localStorage.setItem(KEY, JSON.stringify(DB)); return true; }
  catch (e) { toast(tr("save_failed")); return false; }
}

/* Clipboard is blocked in some contexts; selecting the text is the fallback. */
function selectNode(node) {
  try {
    const r = document.createRange(); r.selectNodeContents(node);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  } catch (e) { /* ignore */ }
  toast(tr("dl_copy_manual"));
}

/* `undoable` puts the way back in the message itself, where you are already
   looking, instead of in a menu you would have to know about. It also gets a
   longer life, because a button you cannot reach in time is not a button. */
function toast(msg, undoable) {
  const el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role", "status");
  el.appendChild(document.createTextNode(msg));
  if (undoable) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "toast-undo"; b.textContent = tr("undo");
    b.onclick = () => { el.remove(); undoLast(); };
    el.appendChild(b);
  }
  document.body.appendChild(el);
  setTimeout(() => el.remove(), undoable ? 8000 : 2600);
}

/* ---- charts -------------------------------------------------------------
   Hand-drawn SVG: no library, so it works with no network. One scale places
   marks, ticks and labels; the year target is a reference line on that same
   scale, never a second axis. Every label names a value the chart reaches.
------------------------------------------------------------------------- */
function niceMax(v) {
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}
function seriesChart({ points, color, target, unit = "", type = "bar", h = 150 }) {
  const W = 340, H = h, P = { l: 38, r: 10, t: 12, b: 22 };
  const pw = W - P.l - P.r, ph = H - P.t - P.b;
  const vals = points.map((p) => p.value);
  const max = niceMax(Math.max(1, ...vals, target && type !== "bar" ? target : 0));
  const y = (v) => P.t + ph - (clamp(v, 0, max) / max) * ph;
  const n = points.length || 1;
  const step = pw / n;

  let g = "";
  [0, .5, 1].forEach((f) => {
    const yy = P.t + ph - f * ph;
    g += `<line class="gl" x1="${P.l}" y1="${yy.toFixed(1)}" x2="${W - P.r}" y2="${yy.toFixed(1)}"/>` +
      `<text class="ax" x="${P.l - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${num(max * f, max < 10 ? 1 : 0)}</text>`;
  });

  let marks = "";
  if (type === "bar") {
    const bw = Math.min(22, step * .58);
    points.forEach((p, i) => {
      const cx = P.l + step * i + step / 2;
      const yy = y(p.value), hh = Math.max(p.value > 0 ? 2 : 0, P.t + ph - yy);
      if (hh > 0) marks += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="3" fill="${color}"><title>${esc(p.label)}: ${num(p.value, 1)} ${esc(unit)}</title></rect>`;
    });
  } else {
    const pts = points.map((p, i) => [P.l + step * i + step / 2, y(p.value)]);
    const d = pts.map(([x, yy], i) => `${i ? "L" : "M"}${x.toFixed(1)},${yy.toFixed(1)}`).join(" ");
    if (type === "area") {
      const base = P.t + ph;
      marks += `<path d="${d} L${pts[pts.length - 1][0].toFixed(1)},${base} L${pts[0][0].toFixed(1)},${base} Z" fill="${color}" fill-opacity=".16"/>`;
    }
    marks += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(([x, yy], i) => {
      marks += `<circle cx="${x.toFixed(1)}" cy="${yy.toFixed(1)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(points[i].label)}: ${num(points[i].value, 1)} ${esc(unit)}</title></circle>`;
    });
  }

  let tline = "";
  if (target && type !== "bar" && target <= max) {
    tline = `<line class="tl" x1="${P.l}" y1="${y(target).toFixed(1)}" x2="${W - P.r}" y2="${y(target).toFixed(1)}"/>`;
  }

  let xs = "";
  const every = n > 8 ? 2 : 1;
  points.forEach((p, i) => {
    if (i % every) return;
    xs += `<text class="ax" x="${(P.l + step * i + step / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle">${esc(p.label)}</text>`;
  });

  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="xMidYMid meet">${g}${tline}${marks}${xs}</svg></div>`;
}

/* ---- shared fragments -------------------------------------------------- */
const badge = (list, v) => { const m = meta(list, v); return `<span class="badge ${m[2]}">${esc(lbl(m[1]))}</span>`; };
const meterEl = (pct, color, mark) =>
  `<div class="meter"><i style="width:${clamp(pct, 0, 100)}%;background:${color}"></i>` +
  (mark !== undefined ? `<span class="meter-mark" style="left:${clamp(mark, 0, 100)}%"></span>` : "") + `</div>`;

/* Set by render() to the tab being drawn, and consumed by the first pageHead
   below it. A detail page leaves it null, because renaming "Overleggen" from
   inside one meeting would rename the whole tab without saying so. */
let RENAMABLE = null;

/* What a tab is called: your own name for it if you gave it one. */
function viewLabel(v) {
  const own = ((DB.profile && DB.profile.viewNames) || {})[v];
  return (own && own.trim()) || tr(TITLE_KEY[v] || "nav_dashboard");
}

function pageHead(title, desc, actions = "") {
  const key = RENAMABLE; RENAMABLE = null;
  /* A name you chose wins over the one the page gives itself, so renaming the
     dashboard replaces the greeting rather than hiding under it. */
  const own = key ? String(((DB.profile || {}).viewNames || {})[key] || "").trim() : "";
  return `<div class="page-h"><div style="min-width:0">
    <h1 class="page-t${key ? " page-t-edit" : ""}">${esc(own || title)}${key
      ? `<button class="page-pen" data-act="rename-view" data-v="${key}"
          title="${esc(tr("v_rename"))}" aria-label="${esc(tr("v_rename"))}">${ico("pencil", "", 13)}</button>` : ""}</h1>
    ${desc ? `<p class="page-d">${esc(desc)}</p>` : ""}
  </div><div class="row wrap">${actions}</div></div>`;
}

function renameViewDialog(v) {
  const names = (DB.profile.viewNames = DB.profile.viewNames || {});
  const fallback = tr(TITLE_KEY[v] || "nav_dashboard");
  openDialog({
    title: tr("v_rename"),
    desc: tr("v_rename_d"),
    submit: tr("save"),
    body: field(tr("v_name"), `<input class="inp" name="name" maxlength="40"
      value="${esc(names[v] || "")}" placeholder="${esc(fallback)}">`) +
      `<p class="xs mut">${esc(tr("v_rename_note", fallback))}</p>`,
    onSubmit: (f) => {
      const val = (f.name || "").trim();
      // Clearing the field puts the original name back rather than leaving it blank.
      if (val && val !== fallback) names[v] = val; else delete names[v];
      save(); render(); toast(val ? tr("v_renamed", val) : tr("v_renamed_back", fallback));
    },
  });
}
const card = (title, body, desc = "", actions = "") => `<section class="card">
  <div class="card-h"><div><h2 class="card-t">${esc(title)}</h2>
  ${desc ? `<p class="card-d">${esc(desc)}</p>` : ""}</div>${actions}</div>
  <div class="card-b">${body}</div></section>`;
const empty = (title, desc = "", action = "") =>
  `<div class="empty"><b>${esc(title)}</b>${desc ? `<span class="xs">${esc(desc)}</span>` : ""}${action}</div>`;

function taskRow(t, opts = {}) {
  const s = scoreTask(t), [bl, bt] = band(s), done = t.status === "done";
  const proj = t.projectId && DB.projects.find((p) => p.id === t.projectId);
  const goal = t.goalId && DB.goals.find((g) => g.id === t.goalId);
  const od = !done && overdue(t.dueDate);
  /* The whole tile opens the task: clicks resolve to the nearest data-act, so
     the tick box still toggles rather than opening. The title stays a real
     button so there is something to tab to. */
  return `<div class="tsk ${done ? "done" : ""}" data-act="edit-task" data-id="${t.id}">
    <button class="chk" role="checkbox" aria-checked="${done}" data-act="toggle-task" data-id="${t.id}"
      aria-label="${esc(t.title)}">${ico("check", "", 11)}</button>
    <div style="min-width:0;flex:1">
      <button class="tsk-t" data-act="edit-task" data-id="${t.id}">${esc(t.title)}</button>
      <div class="tsk-m">
        ${t.dueDate ? `<span ${od ? 'style="color:var(--primary);font-weight:500"' : ""}>${od ? `${esc(tr("overdue_p"))} — ` : ""}${esc(fmtDate(t.dueDate))}</span>` : ""}
        ${opts.hideProject !== true && proj ? `<span class="trunc" style="max-width:150px">${esc(proj.name)}</span>` : ""}
        ${opts.hideGoal !== true && goal ? `<span>${esc(goal.code)}</span>` : ""}
        ${t.status === "waiting" && t.waitingOn ? `<span>${esc(tr("waiting_on"))} ${esc(t.waitingOn)}</span>` : ""}
      </div>
    </div>
    <div class="row" style="gap:5px">
      ${t.priority !== "medium" ? badge(PRIOS, t.priority) : ""}
      ${done ? "" : `<span class="badge ${bt}" title="${esc(tr("prio_score"))} ${s.toFixed(0)} / 100">${esc(lbl(bl))}</span>`}
    </div></div>`;
}

/* ---- dashboard ----------------------------------------------------------
   Every block is a named piece you can switch off or move. The layout is a
   list of {key, col}, so ordering is the order of the list and moving a block
   between columns is one field - no grid maths, and it survives a backup.
------------------------------------------------------------------------- */
const DASH_DEFAULT = [
  { key: "backup",   col: "top" },
  { key: "tiles",    col: "top" },
  { key: "filters",  col: "top" },
  { key: "alert",    col: "top" },
  { key: "focus",    col: "left" },
  { key: "deadlines",col: "left" },
  { key: "flow",     col: "left" },
  { key: "projects", col: "left" },
  { key: "planning", col: "right" },
  { key: "news",     col: "right" },
  { key: "tips",     col: "right" },
  { key: "goals",    col: "right" },
  { key: "meetings", col: "right" },
  { key: "kpis",     col: "right" },
];
const DASH_COLS = [["top", ["Full width","Volle breedte"]], ["left", ["Left","Links"]],
  ["right", ["Right","Rechts"]], ["off", ["Hidden","Verborgen"]]];

/* A stored layout is merged with the default so a block added in a later
   version shows up instead of silently going missing. */
function dashLayout() {
  const saved = Array.isArray(DB.profile.dashboard) ? DB.profile.dashboard : [];
  const known = new Set(DASH_DEFAULT.map((b) => b.key));
  const out = saved.filter((b) => b && known.has(b.key))
    .map((b) => ({ key: b.key, col: DASH_COLS.some(([c]) => c === b.col) ? b.col : "left" }));
  const have = new Set(out.map((b) => b.key));
  DASH_DEFAULT.forEach((b) => { if (!have.has(b.key)) out.push({ ...b }); });
  return out;
}
const dashBlockLabel = (key) => tr(`db_${key}`);

function viewDashboard() {
  const w = workload(), ye = yearElapsed(), tf = UI.taskFilter;
  const first = (DB.profile.name || "").split(" ")[0];
  const today = DB.tasks.filter((t) => t.status !== "done" &&
    ((t.dueDate && t.dueDate <= TODAY()) || t.status === "in_progress"))
    .sort((a, b) => scoreTask(b) - scoreTask(a)).slice(0, 8);
  const deadlines = DB.tasks.filter((t) => t.status !== "done" && t.dueDate && t.dueDate <= addDays(14))
    .sort((a, b) => a.dueDate.localeCompare(b.dueDate)).slice(0, 8);
  const meetingsToday = DB.meetings.filter((m) => m.startsAt.slice(0, 10) === TODAY());
  const open = DB.projects.filter((p) => p.status !== "done");
  const risky = open.filter((p) => p.status === "blocked" || p.health === 2);

  const dateLine = new Intl.DateTimeFormat(LOCALE, { weekday: "long", day: "numeric", month: "long" }).format(new Date());

  const B = {};

  /* The only warning on this page that is about losing work rather than being
     late, so it defaults to the top. */
  B.backup =
  (backupStale() ? `<div class="card" style="margin-bottom:14px;
      border-color:color-mix(in srgb,var(--warning) 35%,transparent);
      background:color-mix(in srgb,var(--warning) 7%,transparent)">
      <div class="card-b" style="padding:12px 16px">
        <div class="row wrap spread" style="gap:10px">
          <div style="min-width:0">
            <p class="sm2 row" style="gap:7px;font-weight:600">
              <span style="color:var(--warning)">${ico("alert", "", 14)}</span>
              ${esc(backupNever() ? tr("b_nag_never") : tr("b_nag", backupAgeText()))}</p>
            <p class="xs mut" style="margin-top:3px">${esc(tr("b_nag_d"))}</p>
          </div>
          <button class="btn sm" data-act="backup">${ico("download", "", 13)} ${esc(tr("b_download"))}</button>
        </div>
      </div></div>` : "");

  // Every tile and quick filter here counts tasks, so they go with that tab.
  B.tiles =
  (!viewOn("tasks") ? "" : `<div class="tiles" style="margin-bottom:14px">
    ${tile(tr("due_today"), w.dueToday, "", "", "clock",
      w.overdue ? "var(--primary)" : "var(--c1)",
      { act: "focus-tasks", v: "today", on: tf.focus === "today" })}
    ${tile(tr("in_progress"), w.inProgress, "", "", "tasks", "var(--c4)",
      { act: "focus-tasks", v: "in_progress", on: tf.focus === "in_progress" })}
    ${tile(tr("committed7"), num(w.hours7, 1), "h", "", "timer",
      w.hours7 > DB.profile.capacity ? "var(--warning)" : "var(--c3)",
      { act: "focus-tasks", v: "week", on: tf.focus === "week" })}
    ${tile(tr("inbox"), w.inbox, "", "", "ideas", "var(--c5)",
      { act: "focus-tasks", v: "inbox", on: tf.focus === "inbox" })}
  </div>`);

  B.filters =
  (!viewOn("tasks") ? "" : `<div class="row wrap" style="gap:6px;margin-bottom:16px">
    <span class="xs mut">${esc(tr("quick_filter"))}</span>
    ${[["overdue", `${tr("f_late")} (${w.overdue})`], ["waiting", `${tr("f_waiting")} (${w.waiting})`],
       ["done7", `${tr("f_done7")} (${w.done7})`]].map(([v, l]) =>
      `<button class="btn sm ${tf.focus === v ? "" : "outline"}" data-act="focus-tasks" data-v="${v}"
        aria-pressed="${tf.focus === v}">${esc(l)}</button>`).join("")}
  </div>`);

  B.alert =
  (viewOn("tasks") && (w.overdue || risky.length) ? `<div class="card" style="border-color:color-mix(in srgb,var(--warning) 30%,transparent);
      background:var(--warning-soft);padding:12px 14px;margin-bottom:14px">
      <div class="row wrap" style="gap:10px">
        <span style="color:var(--warning)">${ico("alert")}</span>
        <p class="sm2" style="flex:1;min-width:180px"><b style="color:var(--warning)">${esc(tr("needs_decision"))}</b>
        <span class="mut">${esc([
          w.overdue ? `${w.overdue} ${plural(w.overdue, "n_overdue", "n_overdue_p")}` : null,
          risky.length ? `${risky.length} ${plural(risky.length, "n_risk", "n_risk_p")}` : null,
        ].filter(Boolean).join(" · "))}</span></p>
        <button class="btn sm outline" data-act="focus-tasks" data-v="overdue">${esc(tr("review_now"))}</button>
      </div></div>` : "");

  /* A card belongs to a module: switch the tab off and its card goes with it,
     otherwise the dashboard keeps offering a page the rail no longer has. */
  B.focus =
      (!viewOn("tasks") ? "" : card(tr("todays_focus"),
        today.length ? `<div>${today.map((x) => taskRow(x)).join("")}</div>`
          : empty(tr("no_due_today"), tr("no_due_today_d")),
        tr("focus_sub"),
        `<button class="btn sm ghost" data-nav="tasks">${esc(tr("all_tasks"))}</button>`));

  B.flow = viewOn("tasks") ? flowCard() : "";

  B.deadlines =
      (!viewOn("tasks") ? "" : card(tr("upcoming_dl"),
        deadlines.length ? `<ul class="divide">${deadlines.map((x) => {
          const od = overdue(x.dueDate);
          return `<li class="row" style="padding:7px 0;gap:10px">
            <span class="xs tab" style="width:74px;flex:0 0 auto;${od ? "color:var(--primary);font-weight:500" : "color:var(--ink-2)"}">${esc(fmtDate(x.dueDate))}</span>
            <button class="tsk-t trunc" data-act="edit-task" data-id="${x.id}" style="flex:1">${esc(x.title)}</button>
          </li>`;
        }).join("")}</ul>` : empty(tr("no_dl")), tr("next14")));

  B.projects =
      (!viewOn("projects") ? "" : card(tr("open_projects"),
        open.length ? `<ul class="divide">${open.slice(0, 6).map((p) => {

          return `<li><button class="tsk-t" data-act="open-project" data-id="${p.id}" style="padding:9px 0;display:flex;gap:10px;align-items:center">

                <span>${esc(tr("s_w_str"))} ${p.strategicValue}/5</span>
                ${p.deadline ? `<span>${esc(fmtDate(p.deadline))}</span>` : ""}</span>
            </span>${badge(PSTAT, p.status)}</button></li>`;
        }).join("")}</ul>` : empty(tr("no_open_projects"), tr("no_open_projects_d")),
        "", `<button class="btn sm ghost" data-nav="projects">${esc(tr("all_projects"))}</button>`));

  B.planning = planningCard();
  B.news = newsCard();
  B.tips = tipsCard();

  B.goals =
      (!viewOn("goals") ? "" : card(tr("goal_progress"), DB.goals.map((g) => {
        const p = goalProgress(g.id), onPace = p >= ye;
        const ms = DB.milestones.filter((m) => m.goalId === g.id);
        return `<button class="tsk-t" data-act="open-goal" data-id="${g.id}" style="display:block;margin-bottom:12px">
          <span class="row spread" style="align-items:baseline;gap:8px">
            <span class="xs trunc" style="font-weight:500"><span class="mut">${esc(g.code)}</span> ${esc(g.title)}</span>
            <span class="tab" style="font-size:15px;font-weight:600">${p}%</span></span>
          <span style="display:block;margin:6px 0 5px">${meterEl(p, slotColor(g.slot), ye)}</span>
          <span class="row wrap xs mut" style="gap:4px 8px">
            ${badge(GSTAT, g.status)}
            <span>${ms.filter((m) => m.done).length}/${ms.length} ${tr("milestones_n")}</span>
            <span style="color:${onPace ? "var(--success)" : "var(--warning)"}">${onPace ? tr("on_pace") : tr("behind_pace")}</span>
          </span></button>`;
      }).join(""), "", `<button class="btn sm ghost" data-nav="goals">${esc(tr("detail"))}</button>`));

  B.meetings =
      (!viewOn("meetings") ? "" : card(tr("todays_meetings"), meetingsToday.length
        ? `<ul class="grid" style="gap:2px">${meetingsToday.map((m) => {
            const rel = relWhen(m.startsAt, m.endsAt);
            // The join link sits beside the row, not inside it: a link within
            // a button is invalid and breaks keyboard navigation.
            return `<li class="row" style="gap:4px">
              <button class="mtg ${rel && rel.urgent ? "soon" : ""}" style="flex:1;min-width:0;
                grid-template-columns:48px 1fr;padding:8px 9px"
                data-act="open-meeting" data-id="${m.id}">
                <span class="mtg-when"><span class="mtg-time tab" style="font-size:16px">${esc(fmtTime(m.startsAt))}</span></span>
                <span class="mtg-body"><span class="mtg-title" style="font-size:12.5px">${esc(m.title)}</span>
                  <span class="tsk-m">
                    ${rel ? `<span class="badge ${rel.tone}" data-when="${esc(m.startsAt)}"
                      data-end="${esc(m.endsAt || "")}">${esc(rel.text)}</span>` : ""}
                    ${m.location ? `<span>${esc(m.location)}</span>` : ""}</span>
                </span></button>
              ${m.onlineUrl ? (() => {
                // Eén klik: naar de app als dat kan, anders naar de browser.
                const app = appJoinUrl(m.onlineUrl);
