        <input class="inp" type="file" id="ics-file" accept=".ics,text/calendar"
          style="padding:6px 8px;height:auto">
      </div>
      <details>
        <summary class="xs mut" style="cursor:pointer">${esc(tr("m_import_paste"))}</summary>
        <textarea class="inp" id="ics-paste" rows="4" style="margin-top:8px;font-family:var(--mono);font-size:11px"
          placeholder="BEGIN:VCALENDAR…"></textarea>
        <button type="button" class="btn sm outline" data-act="ics-read" style="margin-top:8px">
          ${esc(tr("m_import_read"))}</button>
      </details>
      <div id="ics-result"></div>`,
    onSubmit: () => {},
  });

  const input = $("#ics-file");
  if (input) input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => icsLoaded(String(reader.result || ""));
    reader.onerror = () => toast(tr("m_import_bad"));
    reader.readAsText(file);
  };
}

function icsLoaded(text) {
  if (!/BEGIN:VCALENDAR/i.test(text)) { paintIcs(tr("m_import_bad")); return; }
  ICS = parseIcs(text);
  if (!ICS.events.length) { paintIcs(tr("m_import_none")); return; }
  // Default range: whatever the file covers.
  paintIcs(null, ICS.events[0].start.day, ICS.events[ICS.events.length - 1].start.day);
}

function paintIcs(message, from, to) {
  const host = $("#ics-result");
  if (!host) return;
  if (message) { host.innerHTML = `<p class="sm2" style="color:var(--warning)">${esc(message)}</p>`; return; }

  // Dezelfde sleutel als bij het importeren, anders belooft het voorbeeld
  // iets anders dan er gebeurt.
  const known = new Set(DB.meetings.filter((m) => m.outlookUid)
    .map((m) => meetingKey(m.outlookUid, m.startsAt)));
  const inRange = ICS.events.filter((e) => e.start.day >= from && e.start.day <= to);
  const fresh = inRange.filter((e) => !e.uid || !known.has(meetingKey(e.uid, e.start.iso)));
  const dupes = inRange.length - fresh.length;

  /* Whether a join link is in the file at all is the one thing that cannot be
     fixed afterwards, so it is reported before importing rather than found
     missing later. No links and no descriptions together means the export was
     made at a lower detail level. */
  const links = inRange.filter((e) => findMeetingUrl(e)).length;
  const bodies = inRange.filter((e) => String(e.description || "").trim()).length;
  const linkNote = links
    ? `<p class="xs" style="margin-top:8px;color:var(--success)">${esc(tr("m_import_links", links, inRange.length))}</p>`
    : `<p class="xs" style="margin-top:8px;color:var(--warning)">${esc(
        bodies ? tr("m_import_nolink") : tr("m_import_nodetail"))}</p>`;

  host.innerHTML = `
    <p class="sm2" style="margin-bottom:10px">${esc(tr("m_import_found", ICS.events.length,
      fmtDate(ICS.events[0].start.day), fmtDate(ICS.events[ICS.events.length - 1].start.day)))}</p>
    <div class="f2">
      <label class="field"><span class="lbl">${esc(tr("m_import_from"))}</span>
        <input class="inp" type="date" id="ics-from" value="${esc(from)}"></label>
      <label class="field"><span class="lbl">${esc(tr("m_import_to"))}</span>
        <input class="inp" type="date" id="ics-to" value="${esc(to)}"></label>
    </div>
    <p class="lbl" style="margin:12px 0 5px">${esc(tr("m_import_preview"))}</p>
    ${fresh.length ? `<div class="tbl-wrap" style="max-height:200px;overflow:auto">
      <table><tbody>${fresh.slice(0, 60).map((e) => `<tr style="cursor:default">
        <td class="sm2 tab mut" style="white-space:nowrap">${esc(fmtDate(e.start.day))}
          ${e.start.allDay ? "" : esc(e.start.iso.slice(11, 16))}</td>
        <td class="sm2">${esc(truncate(e.title, 60))}</td>
        <td class="xs mut" style="white-space:nowrap">${esc(cleanLocation(e.location))}</td>
        <td style="width:20px;color:var(--success)">${findMeetingUrl(e) ? ico("video", "", 13) : ""}</td>
      </tr>`).join("")}</tbody></table></div>
      ${fresh.length > 60 ? `<p class="xs mut">…+${fresh.length - 60}</p>` : ""}`
      : `<p class="xs mut">${esc(tr("m_import_nothing"))}</p>`}
    ${linkNote}
    ${dupes ? `<p class="xs mut" style="margin-top:8px">${esc(tr("m_import_dup", dupes))}
      ${esc(tr("m_import_relink"))}</p>` : ""}
    ${ICS.recurring ? `<p class="xs mut">${esc(tr("m_import_rec", ICS.recurring))}</p>` : ""}
    <p class="xs mut" style="margin-top:8px">${esc(tr("m_import_tz"))}</p>
    <div class="row" style="margin-top:12px">
      <button type="button" class="btn" data-act="ics-import" ${fresh.length ? "" : "disabled"}>
        ${esc(tr("m_import_go", fresh.length))}</button>
    </div>`;

  const refresh = () => {
    const f = $("#ics-from")?.value, t2 = $("#ics-to")?.value;
    if (f && t2) paintIcs(null, f, t2);
  };
  const a = $("#ics-from"), b = $("#ics-to");
  if (a) a.onchange = refresh;
  if (b) b.onchange = refresh;
}

/* The one place appointments enter the workspace, used by the import dialog
   and by the folder sync alike. Returns what it did instead of saying it, so
   the caller decides whether that is worth a message. */
/* Een terugkerende afspraak levert per keer dezelfde UID aan. Op UID alleen
   zou de hele reeks tot één afspraak samenvallen en zouden alle volgende
   keren stilzwijgend verdwijnen, dus het begintijdstip hoort bij de sleutel. */
const meetingKey = (uid, startsAt) => `${uid}|${String(startsAt).slice(0, 16)}`;

function importEvents(events, from, to) {
  const byUid = new Map();
  DB.meetings.forEach((m) => {
    if (m.outlookUid) byUid.set(meetingKey(m.outlookUid, m.startsAt), m);
  });
  let added = 0, skipped = 0, filled = 0, attFilled = 0, withAtt = 0;

  events.forEach((e) => {
    if (e.start.day < from || e.start.day > to) return;

    if ((e.attendees || []).length) withAtt++;

    const existing = e.uid ? byUid.get(meetingKey(e.uid, e.start.iso)) : null;
    if (existing) {
      /* Al bekend, maar een eerdere versie - of een eerdere versie van de
         flow - kan de link of de deelnemers hebben gemist. Alleen lege
         velden worden gevuld, zodat eigen aanpassingen blijven staan. */
      let touched = false;
      const url = findMeetingUrl(e);
      if (url && !existing.onlineUrl) { existing.onlineUrl = url; filled++; touched = true; }
      if ((e.attendees || []).length && !(existing.attendees || []).length) {
        existing.attendees = e.attendees.slice(0, 50); attFilled++; touched = true;
      }
      if ((e.categories || []).length && !(existing.categories || []).length) {
        existing.categories = e.categories.slice(0, 8); touched = true;
      }
      if (!touched) skipped++;
      return;
    }

    const m = icsToMeeting(e);
    DB.meetings.push(m);
    if (e.uid) byUid.set(e.uid, m);
    added++;
  });

  /* Een categorie die uit Outlook komt en hier nog niet bestond, wordt er een
     - dan kun je hem meteen ook zelf aan een afspraak hangen. */
  const nieuweCats = catEnsure(events.flatMap((e) => e.categories || []));
  if (added || filled || attFilled || nieuweCats) save();
  // withAtt vertelt of het bestand überhaupt deelnemers bevatte; dat scheelt
  // zoeken in de app als het eigenlijk aan de flow ligt.
  return { added, filled, attFilled, skipped, withAtt };
}

function icsImport() {
  const from = $("#ics-from")?.value, to = $("#ics-to")?.value;
  if (!from || !to) return;
  const r = importEvents(ICS.events, from, to);
  save();
  dlg.close();
  toast(r.filled ? tr("m_import_filled", r.added, r.filled, r.skipped)
                 : tr("m_import_done", r.added, r.skipped));
  render();
}

/* ---- agenda folder ------------------------------------------------------
   A folder you point at once, which the app then re-reads by itself. Put an
   .ics there from Power Automate and your appointments arrive without you
   opening a file picker every week.

   The permission is the browser's, not ours: it is granted per folder and the
   handle is kept in IndexedDB because localStorage can only hold text. As an
   installed app you can tick "allow on every visit"; in an ordinary tab the
   browser asks again each session, so there is a button for that too.
------------------------------------------------------------------------- */
const FS_OK = typeof window !== "undefined" && typeof window.showDirectoryPicker === "function";
const IDB_DB = "joost-os-fs", IDB_STORE = "handles", IDB_KEY = "agendaDir";

function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const t = db.transaction(IDB_STORE, "readwrite");
    t.objectStore(IDB_STORE).put(val, key);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const t = db.transaction(IDB_STORE, "readonly");
    const q = t.objectStore(IDB_STORE).get(key);
    q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error);
  });
}
async function idbDel(key) {
  const db = await idbOpen();
  return new Promise((res) => {
    const t = db.transaction(IDB_STORE, "readwrite");
    t.objectStore(IDB_STORE).delete(key);
    t.oncomplete = () => res(); t.onerror = () => res();
  });
}

/* Held in memory so the rest of the app can ask about it without awaiting. */
let AGENDA_DIR = null, AGENDA_PERM = "unknown";

/* ---- mail uit de agendamap ----------------------------------------------
   Dertig dagen mail als losse voorvertoningen, puur om per vergadering de
   bijbehorende berichten te kunnen aanwijzen. Dit blijft bewust in het
   geheugen: het is een paar honderd kilobyte, de opslag van de browser is
   krap, en mailinhoud hoort niet in je back-up te belanden.
------------------------------------------------------------------------- */
let MAIL = null;

/* De connector levert een afzender soms als tekst en soms als blokje met
   emailAddress erin. Beide vormen komen hier dezelfde kant uit. */
function addrOf(v) {
  if (!v) return { name: "", email: "" };
  if (typeof v === "string") {
    const p = attParse(v);
    return { name: p.name, email: String(p.email || "").toLowerCase() };
  }
  const ea = v.emailAddress || v;
  const email = String(ea.address || ea.email || "").toLowerCase().trim();
  return { name: String(ea.name || "").trim() || nameFromEmail(email), email };
}
function addrList(v) {
  if (!v) return [];
  const raw = Array.isArray(v) ? v : String(v).split(/[;,]/);
  return raw.map(addrOf).filter((a) => a.email || a.name);
}

function normaliseMail(raw) {
  const msgs = (raw && (raw.messages || raw.berichten)) || [];
  const me = String((raw && raw.me) || "").toLowerCase();
  return {
    generatedAt: (raw && raw.generatedAt) || "",
    me,
    messages: msgs.map((m) => {
      const from = addrOf(m.from !== undefined ? m.from : m.fromAddress);
      if (!from.name && m.fromName) from.name = String(m.fromName);
      return {
        id: m.id || uid(),
        folder: m.folder || "",
        date: m.date || m.receivedDateTime || "",
        from,
        people: [from, ...addrList(m.to), ...addrList(m.cc)],
        subject: String(m.subject || ""),
        preview: htmlToText(String(m.preview || "")).replace(/\s+/g, " ").trim(),
        thread: m.thread || m.conversationId || "",
        unread: Boolean(m.unread),
        hasAttachments: Boolean(m.hasAttachments),
        webLink: m.webLink || "",
      };
    }).filter((m) => m.date && (m.subject || m.preview)),
  };
}

/* Woorden die in elk onderwerp staan en dus niets zeggen over het onderwerp. */
const MAIL_STOP = new Set(("de het een en of van voor naar met op in te aan bij om dat die dit deze " +
  "re fw fwd antw aw the a an and or of for to in on with re: betreft").split(/\s+/));
const mailWords = (s) => [...new Set(String(s || "").toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/[^a-z0-9\s]/g, " ").split(/\s+/)
  .filter((w) => w.length > 2 && !MAIL_STOP.has(w)))];

/* Hoeveel een bericht met deze vergadering te maken heeft. De punten staan
   bewust in de code en niet in een instelling: ze moeten uit te leggen zijn,
   en je stelt ze één keer goed in plaats van er aan te blijven draaien. */
function mailScore(msg, ctx) {
  const reasons = [];
  let score = 0;

  if (ctx.people.has(msg.from.email)) {
    score += 50;
    reasons.push(tr("ml_why_from", msg.from.name || msg.from.email));
  }
  const others = msg.people.filter((p) => p.email && p.email !== msg.from.email &&
    p.email !== ctx.me && ctx.people.has(p.email));
  if (others.length) {
    score += Math.min(60, others.length * 30);
    if (!reasons.length) reasons.push(tr("ml_why_to", others[0].name || others[0].email));
  }

  if (ctx.words.length) {
    const w = mailWords(msg.subject);
    const shared = w.filter((x) => ctx.words.includes(x)).length;
    if (shared) {
      const ratio = shared / Math.max(ctx.words.length, w.length);
      score += Math.round(ratio * 40);
      if (ratio >= 0.3) reasons.push(tr("ml_why_subject"));
    }
  }

  /* Een venster in plaats van strafpunten. Mail van lang voor of lang na de
     vergadering is geen context ervoor, hoe goed de afzender ook past; mail
     van kort erna is juist de opvolging en hoort er wel bij. */
  const t = Date.parse(msg.date);
  if (!isNaN(t) && !isNaN(ctx.start)) {
    const days = (ctx.start - t) / 864e5;
    if (days > 30 || days < -14) return { score: 0, reasons, after: false };
    if (days >= 0 && days <= 14) score += 10;
  }
  return { score, reasons, after: !isNaN(t) && t > ctx.start };
}

/* De berichten die bij één vergadering horen, per gesprek samengevouwen. */
function mailFor(m, max = 8) {
  if (!MAIL || !MAIL.messages.length) return null;
  const me = MAIL.me;
  const people = new Set((m.attendees || []).map(attEmail)
    .filter(Boolean).map((s) => s.toLowerCase()).filter((e) => e !== me));
  const ctx = { people, me, words: mailWords(m.title), start: Date.parse(m.startsAt) };
  if (!people.size && !ctx.words.length) return { hits: [], people: 0 };

  const scored = [];
  MAIL.messages.forEach((msg) => {
    const r = mailScore(msg, ctx);
    if (r.score >= 50) scored.push({ msg, ...r });
  });

  /* Eén regel per gesprek: het nieuwste bericht met daarbij hoeveel er nog
     meer in dat gesprek zitten. Anders vult één mailwisseling de hele kaart. */
  const threads = new Map();
  scored.sort((a, b) => (b.msg.date || "").localeCompare(a.msg.date || ""));
  scored.forEach((s) => {
    const key = s.msg.thread || s.msg.subject.toLowerCase().replace(/^(re|fw|fwd|antw|aw)\s*:\s*/i, "");
    const seen = threads.get(key);
    if (!seen) threads.set(key, { ...s, count: 1 });
    else { seen.count++; if (s.score > seen.score) { seen.score = s.score; seen.reasons = s.reasons; } }
  });

  return {
    hits: [...threads.values()].sort((a, b) => b.score - a.score || (b.msg.date || "").localeCompare(a.msg.date || "")).slice(0, max),
    people: people.size,
  };
}

const agendaSync = () => (DB.agendaSync = DB.agendaSync || { folder: "", lastAt: "", lastFile: "", auto: true });

async function agendaLoadHandle() {
  if (!FS_OK) return null;
  try { AGENDA_DIR = await idbGet(IDB_KEY); } catch (e) { AGENDA_DIR = null; }
  if (AGENDA_DIR) {
    try { AGENDA_PERM = await AGENDA_DIR.queryPermission({ mode: "read" }); }
    catch (e) { AGENDA_PERM = "prompt"; }
  }
  return AGENDA_DIR;
}

async function agendaPick() {
  if (!FS_OK) { toast(tr("ag_unsupported")); return; }
  let dir;
  try { dir = await window.showDirectoryPicker({ id: "joost-os-agenda", mode: "read" }); }
  catch (e) { return; }                       // cancelled, which is an answer
  AGENDA_DIR = dir; AGENDA_PERM = "granted";
  try { await idbSet(IDB_KEY, dir); } catch (e) { toast(tr("ag_nostore")); }
  agendaSync().folder = dir.name;
  save();
  await agendaRead(true);
}

async function agendaForget() {
  AGENDA_DIR = null; AGENDA_PERM = "unknown";
  try { await idbDel(IDB_KEY); } catch (e) { /* ignore */ }
  DB.agendaSync = { folder: "", lastAt: "", lastFile: "", auto: true };
  save(); render(); toast(tr("ag_forgotten"));
}

/* The newest .ics in the folder wins, so a flow that keeps writing the same
   name and one that writes agenda-2026-10-06.ics both work. */
async function agendaNewestFile(dir, pattern = /\.ics$/i) {
  let best = null;
  for await (const [name, entry] of dir.entries()) {
    if (entry.kind !== "file" || !pattern.test(name)) continue;
    const file = await entry.getFile();
    if (!best || file.lastModified > best.lastModified) best = file;
  }
  return best;
}

/* Het mailbestand uit dezelfde map. Mislukt dit, dan is dat geen reden om de
   agenda ook niet te lezen - de twee staan los van elkaar. */
async function mailRead(dir) {
  try {
    const file = await agendaNewestFile(dir, /^mail-.*\.json$/i);
    if (!file) { MAIL = null; return null; }
    const raw = JSON.parse(String(await file.text()).replace(/^﻿/, ""));
    MAIL = normaliseMail(raw);
    MAIL.file = file.name;
    return MAIL;
  } catch (e) { MAIL = null; return null; }
}

/* `loud` is for a button press: then even "nothing new" deserves an answer.
   The automatic run on startup stays quiet unless something actually came in. */
async function agendaRead(loud) {
  if (!AGENDA_DIR) return null;
  try {
    if (AGENDA_PERM !== "granted") {
      AGENDA_PERM = await AGENDA_DIR.queryPermission({ mode: "read" });
      if (AGENDA_PERM !== "granted") {
        if (!loud) return null;              // asking needs a click, so wait for one
        AGENDA_PERM = await AGENDA_DIR.requestPermission({ mode: "read" });
        if (AGENDA_PERM !== "granted") { toast(tr("ag_denied")); return null; }
      }
    }

    // Mail eerst: dan staat hij klaar zodra de pagina opnieuw tekent.
    await mailRead(AGENDA_DIR);

    const file = await agendaNewestFile(AGENDA_DIR);
    if (!file) { if (loud) { render(); toast(tr("ag_nofile")); } return null; }

    const text = await file.text();
    if (!/BEGIN:VCALENDAR/i.test(text)) { if (loud) toast(tr("m_import_bad")); return null; }

    const parsed = parseIcs(text);
    // A window wide enough for last week's notes and next quarter's planning.
    const r = importEvents(parsed.events, addDays(-14), addDays(120));

    const s = agendaSync();
    s.lastAt = new Date().toISOString();
    s.lastFile = file.name;
    s.folder = AGENDA_DIR.name;
    save();

    if (r.added || r.filled || r.attFilled) {
      render();
      const aangevuld = [
        r.filled ? tr("ag_n_links", r.filled) : "",
        r.attFilled ? tr("ag_n_att", r.attFilled) : "",
      ].filter(Boolean).join(", ");
      toast(aangevuld ? tr("ag_synced_filled", r.added, aangevuld) : tr("ag_synced", r.added));
    } else if (loud) {
      render();
      // Geen deelnemers in het hele bestand is bijna altijd de flow, niet de app.
      toast(!r.withAtt && parsed.events.length ? tr("ag_noatt") : tr("ag_uptodate"));
    }
    return r;
  } catch (e) {
    if (loud) toast(tr("ag_failed"));
    return null;
  }
}

/* Runs once at startup. Silent by design: if the browser needs to ask, it
   waits for you to press the button rather than throwing up a dialog you did
   not expect. */
async function agendaAutoSync() {
  if (!FS_OK) return;
  await agendaLoadHandle();
  if (AGENDA_DIR && agendaSync().auto && AGENDA_PERM === "granted") await agendaRead(false);
  else if (AGENDA_DIR) render();
}

function agendaCard() {
  const s = agendaSync();
  if (!FS_OK) {
    return card(tr("ag_title"),
      `<p class="sm2 mut">${esc(tr("ag_unsupported_d"))}</p>`, tr("ag_sub"));
  }
  const linked = Boolean(AGENDA_DIR);
  const needsClick = linked && AGENDA_PERM !== "granted";
  const ago = s.lastAt ? daysSince(s.lastAt) : null;

  return card(tr("ag_title"), linked
    ? `<p class="sm2 row" style="gap:7px">
         ${ico("folder", "", 15)}<span style="font-weight:500">${esc(s.folder || "—")}</span>
       </p>
       <p class="xs mut" style="margin-top:4px">
         ${s.lastAt
           /* Met de klok erbij kun je zien of hij bij het openen werkelijk
              heeft gelezen, in plaats van alleen dat het ooit vandaag was. */
           ? esc(tr("ag_last", s.lastFile || "—",
               ago === 0 ? tr("ag_today_at", clock(s.lastAt))
                         : ago === 1 ? tr("b_yesterday") : tr("b_days", ago)))
           : esc(tr("ag_never"))}
       </p>
       ${MAIL ? `<p class="xs mut" style="margin-top:2px">${esc(tr("ag_mail", MAIL.messages.length, MAIL.file || "-"))}</p>` : ""}
       ${needsClick ? `<p class="xs" style="color:var(--warning);margin-top:6px">${esc(tr("ag_needsclick"))}</p>` : ""}
       <div class="row wrap" style="gap:8px;margin-top:10px">
         <button class="btn sm${needsClick ? "" : " outline"}" data-act="agenda-read">
           ${ico("download", "", 13)} ${esc(tr("ag_readnow"))}</button>
         <button class="btn sm ghost" data-act="agenda-pick">${esc(tr("ag_change"))}</button>
         <button class="btn sm ghost" data-act="agenda-forget">${esc(tr("ag_forget"))}</button>
       </div>
       <label class="row" style="gap:8px;margin-top:10px">
         <input type="checkbox" data-act="agenda-auto" ${s.auto ? "checked" : ""}
           style="width:16px;height:16px">
         <span class="xs mut">${esc(tr("ag_auto"))}</span>
       </label>`
    : `<p class="sm2 mut" style="line-height:1.6">${esc(tr("ag_none_d"))}</p>
       <button class="btn sm" data-act="agenda-pick" style="margin-top:10px">
         ${ico("folder", "", 13)} ${esc(tr("ag_link"))}</button>`,
    tr("ag_sub"));
}

/* ---- backup -------------------------------------------------------------
   Everything lives in one browser profile, so "clear browsing data" is the
   single way to lose a year of work. A backup you have to remember is a
   backup that does not exist, which is why the age is on the dashboard and
   not only in settings.
------------------------------------------------------------------------- */
const BACKUP_STALE_DAYS = 14;
const BACKUP_EVERY = [3, 5, 7, 14, 30];
const backupEvery = () => {
  const n = Number((DB.backup || {}).everyDays);
  return BACKUP_EVERY.includes(n) ? n : BACKUP_STALE_DAYS;
};

/* The language and the theme live in their own storage keys, not in the
   workspace, so they are carried along deliberately - otherwise a restore on
   a new machine comes back in the wrong language. */
function backupPayload() {
  let lang = null, theme = null;
  try { lang = localStorage.getItem(KEY + ":lang"); theme = localStorage.getItem(KEY + ":theme"); }
  catch (e) { /* storage blocked - the workspace itself is what matters */ }
  return JSON.stringify({ ...DB, _prefs: { lang, theme }, _savedAt: new Date().toISOString() });
}

const daysSince = (stamp) => {
  const t = Date.parse(stamp || "");
  return isNaN(t) ? null : Math.floor((Date.now() - t) / 864e5);
};
/* Never backed up is measured from when the workspace was created, so a fresh
   install is not warned on its first day. */
const backupAge = () => daysSince((DB.backup && DB.backup.at) || (DB.backup && DB.backup.since));
const backupNever = () => !(DB.backup && DB.backup.at);
const backupStale = () => {
  const d = backupAge();
  return d === null || d >= backupEvery();
};
const backupName = () => `joost-os-back-up-${TODAY()}.json`;

function backupAgeText() {
  const d = backupAge();
  if (backupNever()) return tr("b_never");
  if (d === null) return tr("b_never");
  if (d === 0) return tr("b_today");
  if (d === 1) return tr("b_yesterday");
  return tr("b_days", d);
}

async function downloadBackup() {
  const ok = await saveFile(backupName(), backupPayload(), "application/json", true);
  if (!ok) { toast(tr("b_failed")); return; }
  DB.backup = { ...(DB.backup || {}), at: new Date().toISOString() };
  save(); render();
  toast(tr("b_done"));
}

/* Replacing the workspace is the most destructive thing here, so it asks
   first and leaves an undo behind. */
function restoreFrom(text, source) {
  let parsed;
  try { parsed = JSON.parse(String(text).replace(/^﻿/, "")); }
  catch (e) { toast(tr("b_bad_json")); return; }
  if (!parsed || !Array.isArray(parsed.tasks) || !Array.isArray(parsed.goals)) {
    toast(tr("b_bad_file")); return;
  }
  const counts = tr("b_restore_counts", (parsed.tasks || []).length,
    (parsed.meetings || []).length, (parsed.timeEntries || []).length);

  confirmDialog({
    title: tr("b_restore_t"),
    desc: source ? tr("b_restore_from", source) : "",
    submit: tr("b_restore_go"),
    note: `${counts} ${tr("b_restore_note")}`,
    onYes: () => {
      checkpoint(tr("u_restore"));
      const prefs = parsed._prefs || null;
      delete parsed._prefs; delete parsed._savedAt;
      DB = parsed;
      migrate();
      UI.detail = null;
      save();
      // Language and theme are restored last, because both re-render.
      if (prefs && prefs.theme) {
        try { localStorage.setItem(KEY + ":theme", prefs.theme); } catch (e) { /* ignore */ }
        document.documentElement.setAttribute("data-theme", prefs.theme);
      }
      if (prefs && prefs.lang && prefs.lang !== LANG) setLang(prefs.lang);
      render(); toast(tr("b_restored"), true);
    },
  });
}

/* ---- starting clean -----------------------------------------------------
   The workspace opens filled with example data so there is something to look
   at. Clearing it is not one big reset: by now some of what is in here is
   real - appointments imported from Outlook, hours actually clocked - and
   losing those would be worse than living with the examples. So this offers
   the modules one by one, and only pre-ticks the ones that cannot be yours.
------------------------------------------------------------------------- */

/* Seeded bookings carry a date as their createdAt; everything the app writes
   carries a full timestamp. That one difference tells them apart. */
const seededEntry = (e) => !String(e.createdAt || "").includes("T");
const fromOutlook = (m) => Boolean(m.outlookUid || m.importedAt);

/* Nothing may point at a record that is gone, whatever combination is
   cleared. Cheaper to run once at the end than to reason about per option. */
function pruneOrphans() {
  const has = (list) => new Set(list.map((x) => x.id));
  const projects = has(DB.projects), meetings = has(DB.meetings);
  const clients = has(DB.clients), learning = has(DB.learning), tasks = has(DB.tasks);

  DB.actions = DB.actions.filter((a) => meetings.has(a.meetingId));
  DB.actions.forEach((a) => { if (a.taskId && !tasks.has(a.taskId)) a.taskId = null; });
  DB.tasks.forEach((t) => { if (t.projectId && !projects.has(t.projectId)) t.projectId = null; });
  DB.meetings.forEach((m) => { if (m.projectId && !projects.has(m.projectId)) m.projectId = null; });
  DB.ideas.forEach((i) => { if (i.projectId && !projects.has(i.projectId)) i.projectId = null; });
  DB.sessions.forEach((s) => { if (s.itemId && !learning.has(s.itemId)) s.itemId = null; });
  DB.timeEntries.forEach((e) => {
    if (e.clientId && !clients.has(e.clientId)) { e.clientId = null; e.billable = false; }
    if (e.meetingId && !meetings.has(e.meetingId)) e.meetingId = null;
  });
  DB.planning.forEach((p) => {
    if (p.clientId && !clients.has(p.clientId)) p.clientId = null;
    if (Array.isArray(p.days)) {
      p.days = p.days.map((d) =>
        d && d.type === "client" && !clients.has(d.clientId) ? { type: "intern" } : d);
    }
  });
}

function cleanupOptions() {
  const demoHours = DB.timeEntries.filter(seededEntry).length;
  const ownHours = DB.timeEntries.length - demoHours;
  const imported = DB.meetings.filter(fromOutlook).length;
  const demoMeetings = DB.meetings.length - imported;
  const plannedWeeks = DB.planning.filter((p) => p.clientId || p.engagement !== "intern" ||
    (Array.isArray(p.days) && p.days.some(Boolean))).length;

  return [
    { key: "tasks", label: tr("w_tasks"), n: DB.tasks.length, on: true,
      run: () => { DB.tasks = []; } },
    { key: "projects", label: tr("w_projects"), n: DB.projects.length, on: true,
      run: () => { DB.projects = []; } },
    { key: "milestones", label: tr("w_milestones"), n: DB.milestones.length, on: true,
      run: () => { DB.milestones = []; } },
    { key: "ideas", label: tr("w_ideas"), n: DB.ideas.length, on: true,
      run: () => { DB.ideas = []; } },
    { key: "learning", label: tr("w_learning"), n: DB.learning.length + DB.sessions.length, on: true,
      run: () => { DB.learning = []; DB.sessions = []; } },
    { key: "kpiEntries", label: tr("w_kpi"), n: DB.kpiEntries.length, on: true,
      hint: tr("w_kpi_h"), run: () => { DB.kpiEntries = []; } },
    { key: "demoMeetings", label: tr("w_meetings"), n: demoMeetings, on: true,
      run: () => { DB.meetings = DB.meetings.filter(fromOutlook); } },
    { key: "imported", label: tr("w_imported"), n: imported, on: false, mine: true,
      run: () => { DB.meetings = DB.meetings.filter((m) => !fromOutlook(m)); } },
    { key: "demoHours", label: tr("w_hours"), n: demoHours, on: true,
      run: () => { DB.timeEntries = DB.timeEntries.filter((e) => !seededEntry(e)); } },
    { key: "ownHours", label: tr("w_ownhours"), n: ownHours, on: false, mine: true,
      run: () => { DB.timeEntries = DB.timeEntries.filter(seededEntry); } },
    { key: "expenses", label: tr("w_expenses"), n: DB.expenses.length, on: false, mine: true,
      run: () => { DB.expenses = []; } },
    { key: "tips", label: tr("w_tips"), n: DB.tips.length, on: false, mine: true,
      run: () => { DB.tips = []; } },
    { key: "articles", label: tr("w_articles"), n: DB.articles.length + DB.folders.length,
      on: false, mine: true, hint: tr("w_articles_h"),
      run: () => { DB.articles = []; DB.folders = []; } },
    { key: "clients", label: tr("w_clients"), n: DB.clients.length, on: true,
      hint: tr("w_clients_h"), run: () => { DB.clients = []; } },
    { key: "planning", label: tr("w_planning"), n: plannedWeeks, on: true, hint: tr("w_planning_h"),
      run: () => {
        // The weeks themselves stay - they are the calendar, not the content.
        DB.planning.forEach((p) => {
          p.clientId = null; p.engagement = "intern"; p.notes = "";
          p.status = "concept"; p.hours = DB.profile.capacity || 36; p.days = null;
        });
      } },
  ].filter((o) => o.n > 0);
}

function cleanupDialog() {
  const opts = cleanupOptions();
  /* Once only your own records are left there is nothing to clean up, and
     offering them under this heading would be misleading. */
  if (!opts.length || opts.every((o) => o.mine)) {
    openDialog({ title: tr("w_title"), submit: tr("close"),
      body: `<p class="sm2 mut">${esc(tr("w_empty"))}</p>`, onSubmit: () => {} });
    return;
  }

  const row = (o) => `<label class="row" style="gap:9px;align-items:flex-start;padding:5px 0">
    <input type="checkbox" name="k_${o.key}" ${o.on ? "checked" : ""}
      style="width:16px;height:16px;margin-top:2px;flex:0 0 auto">
    <span style="min-width:0">
      <span class="sm2">${esc(o.label)}
        <span class="mut tab" style="font-weight:400">${o.n}</span>
        ${o.mine ? `<span class="badge warning" style="margin-left:5px">${esc(tr("w_yours"))}</span>` : ""}</span>
      ${o.hint ? `<span class="xs mut" style="display:block;margin-top:1px">${esc(o.hint)}</span>` : ""}
    </span></label>`;

  openDialog({
    title: tr("w_title"), desc: tr("w_desc"), submit: tr("w_go"), danger: true,
    body: `${opts.map(row).join("")}
      <p class="xs mut" style="margin-top:11px;padding-top:10px;border-top:1px solid var(--border)">
        ${esc(tr("w_keeps"))}</p>`,
    onSubmit: (f) => {
      const picked = opts.filter((o) => f[`k_${o.key}`] === "on");
      if (!picked.length) { toast(tr("w_none")); return false; }
      const total = picked.reduce((s, o) => s + o.n, 0);
      checkpoint(tr("u_cleanup"));
      picked.forEach((o) => o.run());
      pruneOrphans();
      UI.detail = null;
      save(); render();
      toast(tr("w_done", total), true);
    },
  });
}

function exportDialog() {
  openDialog({
    title: tr("dl_export"), submit: tr("dl_copy"),
    desc: "Select all and copy, or use the button. Keep it somewhere safe — this is your only backup.",
    body: `<textarea class="inp" id="exp" rows="12" readonly
      style="font-family:var(--mono);font-size:11px">${esc(JSON.stringify(DB))}</textarea>`,
    onSubmit: () => {
      // Clipboard access is unavailable on file:// in some browsers and can be
      // blocked in a sandboxed frame, so selecting the text is the fallback.
      const ta = $("#exp");
      ta.select();
      try {
        const p = navigator.clipboard && navigator.clipboard.writeText(ta.value);
        if (p && typeof p.then === "function") {
          p.then(() => toast("Copied to clipboard"))
            .catch(() => toast("Copy blocked — the text is selected, press Ctrl/Cmd+C"));
        } else {
          toast("The text is selected — press Ctrl/Cmd+C to copy");
        }
      } catch (e) {
        toast("The text is selected — press Ctrl/Cmd+C to copy");
      }
      return false;
    },
  });
}
function importDialog() {
  openDialog({
    title: tr("b_restore"), submit: tr("close"),
    desc: tr("b_restore_d"),
    body: `<div class="field">
        <span class="lbl">${esc(tr("b_pick"))}</span>
        <input class="inp" type="file" id="bk-file" accept=".json,application/json"
          style="padding:6px 8px;height:auto">
      </div>
      <details>
        <summary class="xs mut" style="cursor:pointer">${esc(tr("b_paste"))}</summary>
        <textarea class="inp" id="bk-paste" rows="6" style="margin-top:8px;font-family:var(--mono);font-size:11px"
          placeholder="{ … }"></textarea>
        <button type="button" class="btn sm outline" data-act="restore-paste" style="margin-top:8px">
          ${esc(tr("b_read"))}</button>
      </details>`,
    onSubmit: () => {},
  });

  const input = $("#bk-file");
  if (input) input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    // The name is shown back so you can see which backup you are about to use.
    reader.onload = () => restoreFrom(String(reader.result || ""), file.name);
    reader.onerror = () => toast(tr("b_bad_file"));
    reader.readAsText(file);
  };
}

function jumpDialog() {
  /* Search only reaches what the rail reaches, otherwise switching a tab off
     leaves a back door straight into it. */
  const on = (v, list) => viewOn(v) ? list : [];
  const rows = [
    ...NAV.flatMap((s) => s.items.filter(([v]) => viewOn(v))
      .map(([v]) => ({ label: viewLabel(v), kind: tr("k_goto"), act: () => go(v) }))),
    { label: viewLabel("settings"), kind: tr("k_goto"), act: () => go("settings") },
    ...on("tasks", [{ label: tr("new_task"), kind: tr("k_action"), act: () => taskDialog(null) }]),
    ...on("projects", DB.projects.map((p) => ({ label: p.name, kind: tr("k_project"), act: () => open_("project", p.id) }))),
    ...on("planning", DB.clients.map((c) => ({ label: c.name, kind: tr("k_client"), act: () => {
      UI.planFilter = { client: c.id, scope: "all" }; go("planning");
    } }))),
    ...on("goals", DB.goals.map((g) => ({ label: `${g.code} ${g.title}`, kind: tr("k_goal"), act: () => open_("goal", g.id) }))),
    ...on("tasks", DB.tasks.filter((x) => x.status !== "done").slice(0, 40)
      .map((x) => ({ label: x.title, kind: tr("k_task"), act: () => taskDialog(x) }))),
  ];
  onSubmitFn = null; onDeleteFn = null;
  if (dlg.open) dlg.close();
  dlg.innerHTML = `<div class="dlg-h" style="padding:0 44px 0 0">
      <input class="inp" id="jq" placeholder="${esc(tr("search_ph"))}" autocomplete="off"
        style="border:0;height:46px;font-size:14px;background:none">
      <button type="button" class="dlg-x" id="jx" aria-label="${esc(tr("search_close"))}"
        style="top:8px;right:8px">${ico("close", "", 16)}</button>
    </div>
    <div class="dlg-b" style="padding:6px;max-height:340px"><ul id="jl" class="grid" style="gap:1px"></ul></div>
    <div class="dlg-f" style="justify-content:space-between;padding:9px 12px">
      <span class="xs mut">↑↓ kiezen · Enter openen · Esc sluiten</span>
      <button type="button" class="btn sm outline" id="jclose">Sluiten</button>
    </div>`;
  dlg.showModal();
  $("#jx").onclick = () => dlg.close();
  $("#jclose").onclick = () => dlg.close();
  const q = $("#jq"), ul = $("#jl");
  let idx = 0, shown = rows;
  const paint = () => {
    ul.innerHTML = shown.slice(0, 40).map((r, i) => `<li><button type="button" data-i="${i}"
      style="width:100%;display:flex;gap:10px;align-items:center;padding:8px 10px;border:0;border-radius:7px;
      cursor:pointer;text-align:left;background:${i === idx ? "var(--surface-2)" : "none"};color:inherit">
      <span class="trunc" style="flex:1">${esc(r.label)}</span>
      <span class="xs mut">${r.kind}</span></button></li>`).join("")
      || `<li class="xs mut" style="padding:16px;text-align:center">Nothing matches that.</li>`;
  };
  const filter = () => {
    const s = q.value.trim().toLowerCase();
    shown = s ? rows.filter((r) => r.label.toLowerCase().includes(s)) : rows;
    idx = 0; paint();
  };
  paint();
  q.oninput = filter;
  q.onkeydown = (e) => {
    if (e.key === "ArrowDown") { idx = Math.min(shown.length - 1, idx + 1); paint(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { idx = Math.max(0, idx - 1); paint(); e.preventDefault(); }
    else if (e.key === "Enter") { e.preventDefault(); const r = shown[idx]; if (r) { dlg.close(); r.act(); } }
    // Belt and braces: <dialog> closes on Escape natively, but only if the
    // event is not swallowed somewhere above us.
    else if (e.key === "Escape") { e.preventDefault(); dlg.close(); }
  };
  ul.onclick = (e) => {
    const b = e.target.closest("button[data-i]");
    if (b) { dlg.close(); shown[Number(b.dataset.i)]?.act(); }
  };
  setTimeout(() => q.focus(), 30);
}

/* ---- per-render wiring (filters, forms, drag and drop) ----------------- */
function wireView() {
  const bind = (id, key) => {
    const el = $(id); if (!el) return;
    el.onchange = () => { UI.taskFilter[key] = el.value; render(); };
    if (el.tagName === "INPUT") el.oninput = () => {
      UI.taskFilter[key] = el.value;
      const pos = el.selectionStart; render();
      const again = $(id); if (again) { again.focus(); again.setSelectionRange(pos, pos); }
    };
  };
  bind("#f-q", "q"); bind("#f-project", "project"); bind("#f-goal", "goal"); bind("#f-show", "show");

  // The sending rhythm for the tips, set on the page it belongs to.
  const tipEvery = $("#tip-every"), tipDay = $("#tip-day");
  const setPlan = () => {
    DB.tipPlan = { everyWeeks: Number(tipEvery.value) === 2 ? 2 : 1, weekday: Number(tipDay.value) };
    save(); render(); toast(tr("ti_plan_set"));
  };
  if (tipEvery) tipEvery.onchange = setPlan;
  if (tipDay) tipDay.onchange = setPlan;

  // How often the backup reminder is allowed to speak up.
  const every = document.querySelector('[data-act="backup-every"]');
  if (every) every.onchange = () => {
    DB.backup = { ...(DB.backup || {}), everyDays: Number(every.value) };
    save(); render(); toast(tr("b_every_set", every.value));
  };

  const fc = $("#f-client");
  if (fc) fc.onchange = () => { UI.planFilter.client = fc.value; render(); };

  // Enter anywhere in the start row starts the timer.
  const row = $("#timer-start-row");
  if (row) row.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); startTimerFromForm(); }
  });

  const cap = $("#capture");
  if (cap) cap.onsubmit = (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(cap));
    if (!f.title.trim()) return;
    DB.ideas.unshift({ id: uid(), title: f.title.trim(), body: f.body || "", source: f.source || "",
      cls: null, impact: null, effort: null, rationale: null, projectId: null, createdAt: TODAY() });
    save(); toast(tr("i_captured")); render();
  };

  const pf = $("#profile-form");
  if (pf) pf.onsubmit = (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(pf));
    Object.assign(DB.profile, { name: f.name, role: f.role, org: f.org, focus: f.focus });
    save(); toast(tr("s_saved")); render();
  };

  const wf = $("#pattern-form");
  if (wf) wf.onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(wf);
    const days = fd.getAll("wd").map(Number).sort((a, b) => a - b);
    const freeDay = fd.get("freeDay") === "" ? null : Number(fd.get("freeDay"));
    const studyDay = fd.get("studyDay") === "" ? null : Number(fd.get("studyDay"));
    Object.assign(DB.profile, {
      workDays: days.length ? days : [0, 1, 2, 3, 4],
      fte: Number(fd.get("fte")) || 1,
      capacity: Number(fd.get("capacity")) || 0,
      // A day off cannot also be a study day; the later choice wins.
      freeDay, studyDay: studyDay === freeDay ? null : studyDay,
    });
    save(); toast(tr("s_saved")); render();
  };

  // Board drag and drop. The same move is available from the task dialog's
  // status select, so the board is never drag-only.
  $("#view").querySelectorAll(".kcard").forEach((el) => {
    el.addEventListener("dragstart", () => { UI.drag = el.dataset.task; el.classList.add("drag"); });
    el.addEventListener("dragend", () => { UI.drag = null; el.classList.remove("drag"); });
  });
  $("#view").querySelectorAll(".col").forEach((col) => {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", (e) => {
      e.preventDefault(); col.classList.remove("over");
      const id = UI.drag, status = col.dataset.col;
      UI.drag = null;
      const t = DB.tasks.find((x) => x.id === id);
      if (!t || t.status === status) return;
      t.status = status;
      t.completedAt = status === "done" ? TODAY() : null;
      save(); toast(`${tr("moved_to")} ${lbl(meta(STATUSES, status)[1])}`); render();
    });
  });
}

/* ---- global events ----------------------------------------------------- */
document.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-nav]");
  if (nav) { go(nav.dataset.nav); return; }

  const el = e.target.closest("[data-act]");
  if (!el) return;
  const { act, id } = el.dataset;
  const task = () => DB.tasks.find((x) => x.id === id);

  switch (act) {
    case "new-task": taskDialog(null, { status: el.dataset.status, projectId: el.dataset.project }); break;
    case "edit-task": taskDialog(task()); break;
    case "toggle-task": {
      const t = task(); if (!t) break;
      const done = t.status === "done";
      t.status = done ? "next" : "done";
      t.completedAt = done ? null : TODAY();
      save(); render(); break;
    }
    case "task-view": UI.taskView = el.dataset.v; saveUI(); render(); break;

    /* Tile and chip filters. Every one of these is a toggle: firing the same
       value twice returns to the unfiltered list. */
    case "focus-tasks": focusTasks(el.dataset.v); break;
    case "clear-focus": UI.taskFilter.focus = "all"; render(); break;
    case "clear-tf": {
      const k = el.dataset.v;
      UI.taskFilter[k] = k === "q" ? "" : "all";
      render(); break;
    }
    case "clear-all-tf":
      UI.taskFilter = { q: "", project: "all", goal: "all", show: "open", focus: "all" };
      render(); break;
    case "focus-dev":
      UI.devFilter = UI.devFilter === el.dataset.v ? "all" : el.dataset.v;
      render(); break;
    case "plan-client": {
      const v = el.dataset.v;
      UI.planFilter.client = (v === "all" || UI.planFilter.client === v) ? "all" : v;
      if (UI.view !== "planning") { go("planning"); break; }
      render(); break;
    }
    case "sort": {
      const k = el.dataset.k;
      UI.sort = UI.sort.key === k
        ? { key: k, dir: UI.sort.dir === "asc" ? "desc" : "asc" }
        : { key: k, dir: k === "title" ? "asc" : "desc" };
      render(); break;
    }
    case "cal-day": UI.calSel = el.dataset.d; render(); break;
    case "cal-prev": UI.calMonth = new Date(UI.calMonth.getFullYear(), UI.calMonth.getMonth() - 1, 1); render(); break;
    case "cal-next": UI.calMonth = new Date(UI.calMonth.getFullYear(), UI.calMonth.getMonth() + 1, 1); render(); break;
    case "cal-today": UI.calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); UI.calSel = TODAY(); render(); break;

    case "open-goal": open_("goal", id); break;
    case "open-project": open_("project", id); break;
    case "open-meeting": open_("meeting", id); break;

    case "new-project": projectDialog(null); break;
    case "edit-project": projectDialog(DB.projects.find((x) => x.id === id)); break;

    case "new-meeting": meetingDialog(null); break;
    case "meet-range": UI.meetFilter.days = Number(el.dataset.v); render(); break;
    case "meet-view": UI.meetView = el.dataset.v; UI.meetWeek = 0; saveUI(); render(); break;
    /* Vanuit de instellingen én vanuit de agenda zelf; in het tweede geval
       springt de weergave meteen naar het weekrooster, anders zie je niets
       van je keuze. */
    case "agenda-view": {
      DB.profile.agendaView = el.dataset.v;
      if (UI.view === "meetings") { UI.meetView = "week"; saveUI(); }
      save(); render(); break;
    }
    /* 0 is "deze week", de pijlen schuiven er één op. */
    case "meet-week": {
      const step = Number(el.dataset.v);
      UI.meetWeek = step === 0 ? 0 : UI.meetWeek + step;
      render(); break;
    }
    case "cat-edit": categoryDialog((DB.categories || []).find((c) => c.id === id)); break;
    case "cat-new": categoryDialog(null); break;
    case "copy-link": {
      const mt = DB.meetings.find((x) => x.id === id);
      if (!mt || !mt.onlineUrl) break;
      try {
        const p = navigator.clipboard && navigator.clipboard.writeText(mt.onlineUrl);
        if (p && typeof p.then === "function") {
          p.then(() => toast(tr("m_link_copied"))).catch(() => toast(mt.onlineUrl));
        } else toast(mt.onlineUrl);
      } catch (err) { toast(mt.onlineUrl); }
      break;
    }
    case "mail-attendees": {
      const mt = DB.meetings.find((x) => x.id === id);
      if (!mt) break;
      const adressen = (mt.attendees || []).map(attEmail).filter(Boolean);
      if (!adressen.length) break;
      /* Een mailto met het onderwerp erbij opent je mailprogramma met
         iedereen er al in. Lukt dat niet, dan staan de adressen in elk geval
         op het klembord. */
      const href = `mailto:${encodeURIComponent(adressen.join(";"))}?subject=${encodeURIComponent(mt.title || "")}`;
      try { window.location.href = href; } catch (e) { /* valt terug op kopiëren */ }
      try {
        const p = navigator.clipboard && navigator.clipboard.writeText(adressen.join("; "));
        if (p && typeof p.then === "function") p.then(() => toast(tr("m_att_copied"))).catch(() => {});
      } catch (e) { /* niets aan te doen */ }
      break;
    }
    case "agenda-pick": void agendaPick(); break;
    case "agenda-read": void agendaRead(true); break;
    case "agenda-forget": void agendaForget(); break;
    case "agenda-auto":
      agendaSync().auto = !agendaSync().auto;
      save(); render();
      toast(tr(agendaSync().auto ? "ag_auto_on" : "ag_auto_off"));
      break;
    case "ics-open": icsDialog(); break;
    case "ics-read": {
      const ta = $("#ics-paste");
      if (ta && ta.value.trim()) icsLoaded(ta.value);
      else toast(tr("m_import_bad"));
      break;
    }
    case "ics-import": icsImport(); break;
    case "rescan-links": {
      let found = 0;
      DB.meetings.forEach((m) => {
        if (m.onlineUrl) return;
        const url = findMeetingUrl({ location: m.location, description: m.notes });
        if (!url) return;
        m.onlineUrl = url;
        m.notes = stripJoinBlurb(m.notes);
        found++;
      });
      if (found) { save(); render(); toast(tr("m_rescan_done", found)); }
      else toast(tr("m_rescan_none"));
      break;
    }
    case "edit-meeting": meetingDialog(DB.meetings.find((x) => x.id === id)); break;
    case "add-action": actionDialog(id); break;
    case "toggle-action": {
      const a = DB.actions.find((x) => x.id === id); if (!a) break;
      a.status = a.status === "done" ? "open" : "done";
      if (a.status === "done" && a.taskId) {
        const t = DB.tasks.find((x) => x.id === a.taskId);
        if (t) { t.status = "done"; t.completedAt = TODAY(); }
      }
      save(); render(); break;
    }
    /* Small items delete straight away: asking twice for one checklist line
       gets in the way. They are undoable instead. */
    case "del-action":
      checkpoint(tr("u_action"));
      DB.actions = DB.actions.filter((x) => x.id !== id);
      save(); render(); toast(tr("dl_removed"), true); break;
    case "promote-action": {
      const a = DB.actions.find((x) => x.id === id); if (!a || a.taskId) break;
      const m = DB.meetings.find((x) => x.id === a.meetingId);
      const t = { id: uid(), title: a.text, notes: m ? tr("m_fromnote", m.title) : "", status: "next",
        priority: "medium", energy: "shallow", dueDate: a.due || null, estimate: null,
        projectId: m?.projectId || null, goalId: null, waitingOn: "", completedAt: null, createdAt: TODAY() };
      DB.tasks.unshift(t); a.taskId = t.id; a.status = "in_progress";
      save(); toast(tr("m_promoted")); render(); break;
    }

    case "toggle-ms": {
      const m = DB.milestones.find((x) => x.id === id); if (m) { m.done = !m.done; save(); render(); } break;
    }
    case "del-ms":
      checkpoint(tr("u_ms"));
      DB.milestones = DB.milestones.filter((x) => x.id !== id);
      save(); render(); toast(tr("dl_removed"), true); break;
    case "add-ms": milestoneDialog(id); break;
    case "edit-ms": {
      const m = DB.milestones.find((x) => x.id === id);
      if (m) milestoneDialog(m.goalId, m);
      break;
    }
    case "new-goal": goalDialog(null); break;
    case "edit-goal": goalDialog(DB.goals.find((x) => x.id === id)); break;

    case "kpi-mode": {
      const k = DB.kpis.find((x) => x.id === id); if (k) { k._cum = el.dataset.v === "1"; save(); render(); } break;
    }
    case "log-kpi": kpiDialog(DB.kpis.find((x) => x.id === id)); break;

    case "idea-filter": UI.ideaFilter = el.dataset.v; render(); break;
    case "classify": classifyDialog(DB.ideas.find((x) => x.id === id)); break;
    case "del-idea":
      checkpoint(tr("u_idea"));
      DB.ideas = DB.ideas.filter((x) => x.id !== id);
      save(); render(); toast(tr("dl_removed"), true); break;
    case "promote-idea": {
      const i = DB.ideas.find((x) => x.id === id); if (!i) break;
      const p = { id: uid(), name: i.title, objective: i.body.slice(0, 300), description: "", status: "idea",
        strategicValue: i.impact || 3, health: 0, owner: DB.profile.name, deadline: null,
        risks: "", dependencies: "", goalId: null };
      DB.projects.unshift(p); i.projectId = p.id;
      save(); toast(tr("i_promoted")); open_("project", p.id); break;
    }

    case "new-learning": learningDialog(); break;
    case "del-learning":
      checkpoint(tr("u_learning"));
      DB.learning = DB.learning.filter((x) => x.id !== id);
      save(); render(); toast(tr("dl_removed"), true); break;
    case "log-study": studyDialog(); break;
    case "prog": {
      const l = DB.learning.find((x) => x.id === id); if (!l) break;
      l.progress = clamp(l.progress + Number(el.dataset.d), 0, 100);
      if (l.progress === 100) l.status = "completed";
      else if (l.status === "completed") l.status = "in_progress";
      save(); render(); break;
    }

    case "gen-review": {
      const wk = mondayOf();
      DB.reviews[wk] = buildReview();
      save(); toast(tr("r_built")); render(); break;
    }
    case "edit-review": reviewDialog(); break;

    case "rail-toggle": setRailWide(!UI.railWide); break;
    case "set-lang": setLang(el.dataset.v); break;
    case "toggle-view": {
      /* Derived from what is stored rather than from the box's own checked
         state, so the two can never drift apart. */
      const v = el.dataset.v;
      const hidden = new Set(DB.profile.hiddenViews || []);
      const turningOff = !hidden.has(v);
      if (turningOff) hidden.add(v); else hidden.delete(v);
      DB.profile.hiddenViews = [...hidden];
      const label = viewLabel(v);
      save(); render();
      toast(tr(turningOff ? "s_tab_off" : "s_tab_on", label));
      break;
    }

    /* working hours */
    case "timer-start": startTimerFromForm(); break;
    case "timer-pause": pauseTimer(); break;
    case "timer-resume": resumeTimer(); break;
    case "timer-stop": stopTimer(false); break;
    case "timer-discard": stopTimer(true); break;
    case "add-entry": entryDialog(null); break;
    case "book-meeting": bookMeeting(id); break;
    case "edit-entry": entryDialog(DB.timeEntries.find((x) => x.id === id)); break;
    case "new-client": clientDialog(null); break;
    case "edit-client": clientDialog(DB.clients.find((x) => x.id === id)); break;
    case "export-hours": hoursExportDialog(); break;
    case "export-hours-copy": {
      const ta = $("#hours-tsv");
      if (!ta) break;
      // Bring it into flow so select() works, and leave it there if the
      // clipboard is blocked - otherwise there is nothing left to copy by hand.
      const reveal = () => {
        ta.removeAttribute("style"); ta.removeAttribute("aria-hidden");
        ta.className = "inp"; ta.rows = 5;
        ta.style.fontFamily = "var(--mono)"; ta.style.fontSize = "11px";
        ta.select(); ta.setSelectionRange(0, ta.value.length);
      };
      const hide = () => { ta.setAttribute("style", "position:absolute;left:-9999px;top:0"); };

      reveal();
      try {
        const p = navigator.clipboard && navigator.clipboard.writeText(ta.value);
        if (p && typeof p.then === "function") {
          p.then(() => { hide(); toast(tr("h_excel_copied")); })
           .catch(() => toast(tr("dl_copy_manual")));
        } else toast(tr("dl_copy_manual"));
      } catch (err) { toast(tr("dl_copy_manual")); }
      break;
    }
    case "hours-client": {
      const v = el.dataset.v;
      UI.hoursFilter.client = (v === "all" || UI.hoursFilter.client === v) ? "all" : v;
      render(); break;
    }
    case "hours-week": {
      const v = el.dataset.v;
      if (v === "now") UI.hoursFilter.week = mondayOf();
      else {
        const d = parseD(UI.hoursFilter.week || mondayOf());
        d.setDate(d.getDate() + (v === "next" ? 7 : -7));
        UI.hoursFilter.week = iso(d);
      }
      render(); break;
    }
    case "copy-afas": {
      const pre = $("#afas-text");
      if (!pre) { toast(tr("h_afas_none")); break; }
      const text = pre.textContent;
      try {
        const p = navigator.clipboard && navigator.clipboard.writeText(text);
        if (p && typeof p.then === "function") {
          p.then(() => toast(tr("h_afas_copied"))).catch(() => selectNode(pre));
        } else selectNode(pre);
      } catch (err) { selectNode(pre); }
      break;
    }

    case "plan-range":
      // Changing the window keeps you where you are, not back at today.
      UI.planFilter.range = el.dataset.v;
      UI.planFilter.offset = 0;
      render(); break;
    case "plan-shift": {
      const v = Number(el.dataset.v);
      UI.planFilter.offset = v === 0 ? 0 : Math.max(0, UI.planFilter.offset + v);
      render(); break;
    }

    case "edit-week": weekDialog(DB.planning.find((x) => x.id === id)); break;
    case "plan-bulk": bulkPlanDialog(); break;
    case "plan-scope": {
      const v = el.dataset.v;
      UI.planFilter.scope = UI.planFilter.scope === v && v !== "all" ? "all" : v;
      if (UI.view !== "planning") { go("planning"); break; }
      render(); break;
    }

    case "export": exportDialog(); break;
    case "import": importDialog(); break;
    case "backup": void downloadBackup(); break;
    case "backup-every": break;   // handled by its own change listener
    case "rename-view": renameViewDialog(el.dataset.v); break;
    case "dash-setup": dashSetupDialog(); break;
    case "dash-reset":
      DB.profile.dashboard = DASH_DEFAULT.map((b) => ({ ...b }));
      save(); render(); paintDashSetup(dashLayout()); toast(tr("db_reset_done")); break;
    case "new-kpi": kpiEditDialog(null); break;
    case "edit-kpi": kpiEditDialog(DB.kpis.find((x) => x.id === id)); break;
    case "cleanup": cleanupDialog(); break;

    /* AI tips */
    case "new-tip": tipDialog(null, el.dataset.on ? { plannedFor: el.dataset.on } : null); break;
    case "edit-tip": tipDialog(DB.tips.find((x) => x.id === id)); break;
    case "tip-sent": {
      const t = DB.tips.find((x) => x.id === id);
      if (!t) break;
      checkpoint(tr("u_tip"));
      t.status = "sent";
      t.sentAt = t.sentAt || t.plannedFor || TODAY();
      save(); render(); toast(tr("ti_sent_done", fmtDate(t.sentAt)), true);
      break;
    }
    case "copy-tip": {
      const t = DB.tips.find((x) => x.id === id);
      if (!t || !t.body) break;
      // What you paste into Teams, so the title rides along as a heading.
      const text = `${t.title}\n\n${t.body}`;
      try {
        const p = navigator.clipboard && navigator.clipboard.writeText(text);
        if (p && typeof p.then === "function") p.then(() => toast(tr("ti_copied"))).catch(() => toast(tr("dl_copy_manual")));
        else toast(tr("dl_copy_manual"));
      } catch (e) { toast(tr("dl_copy_manual")); }
      break;
    }

    /* knowledge */
    case "know-view": UI.knowFilter.view = el.dataset.v; render(); break;
    case "know-folder": UI.knowFilter.folder = el.dataset.v; render(); break;
    case "know-status": UI.knowFilter.status = el.dataset.v; render(); break;
    case "know-toread":
      UI.knowFilter.view = "articles";
      UI.knowFilter.status = UI.knowFilter.status === "toread" ? "all" : "toread";
      go("knowledge"); break;
    case "toggle-source": {
      const key = isoWeekKey();
      const list = new Set(DB.newsRound[key] || []);
      if (list.has(id)) list.delete(id); else list.add(id);
      DB.newsRound[key] = [...list];
      save(); render(); break;
    }
    case "round-reset":
      checkpoint(tr("u_round"));
      DB.newsRound[isoWeekKey()] = [];
      save(); render(); toast(tr("n_reset_done"), true); break;
    case "new-source": sourceDialog(null); break;
    case "edit-source": sourceDialog(DB.sources.find((x) => x.id === id)); break;
    case "new-folder": folderDialog(null); break;
    case "edit-folder": folderDialog(DB.folders.find((x) => x.id === id)); break;
    case "new-article": articleDialog(null, el.dataset.src ? { sourceId: el.dataset.src } : null); break;
    case "edit-article": articleDialog(DB.articles.find((x) => x.id === id)); break;
    case "article-status": {
      const a = DB.articles.find((x) => x.id === id);
      if (!a) break;
      checkpoint(tr("u_article"));
      a.status = el.dataset.v;
      save(); render();
      toast(tr("n_art_status", lbl(meta(ART_STATUS, a.status)[1])), true);
      break;
    }

    /* expenses */
    case "new-expense": expenseDialog(null); break;
    case "edit-expense": expenseDialog(DB.expenses.find((x) => x.id === id)); break;
    case "view-receipt": receiptDialog(id); break;
    case "exp-status": {
      const x = DB.expenses.find((e) => e.id === id);
      if (!x) break;
      const to = el.dataset.v;
      checkpoint(tr("u_expense"));
      x.status = to;
      if (to === "submitted") { x.submittedAt = x.submittedAt || TODAY(); x.paidAt = null; }
      if (to === "paid") x.paidAt = TODAY();
      if (to === "todo") { x.submittedAt = null; x.paidAt = null; }
      save(); render();
      toast(to === "paid" ? tr("x_to_archive") : tr("x_status_set", lbl(meta(ESTATUS, to)[1])), true);
      break;
    }
    case "restore-paste": {
      const ta = $("#bk-paste");
      if (ta && ta.value.trim()) restoreFrom(ta.value, "");
      else toast(tr("b_bad_file"));
      break;
    }
    case "undo": undoLast(); break;
    case "reset": {
      confirmDialog({
        title: tr("conf_reset_t"), desc: tr("conf_reset_d"), submit: tr("s_reset"),
        note: tr("conf_reset_note"),
        onYes: () => {
          checkpoint(tr("u_reset"));
          DB = seed(); UI.detail = null;
          save(); render(); toast(tr("dl_reset_done"), true);
        },
      });
      break;
    }
  }
});

$("#btn-new-task").onclick = () => taskDialog(null);
$("#btn-jump").onclick = () => jumpDialog();
$("#scrim").onclick = () => setRailWide(false);

/* Clicking the backdrop closes the dialog. The content fills the element, so
   a click landing on the dialog itself came from outside the panel. */
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
/* A closing dialog must not leave stale handlers pointing at removed nodes. */
dlg.addEventListener("close", () => { onSubmitFn = null; onDeleteFn = null; });
$("#btn-theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem(KEY + ":theme", dark ? "light" : "dark"); } catch (e) { /* ignore */ }
  render();
};

document.addEventListener("keydown", (e) => {
  // Escape backs out of the wide rail too, once no dialog is holding it.
  if (e.key === "Escape" && !dlg.open && UI.railWide &&
      window.matchMedia("(max-width:700px)").matches) {
    setRailWide(false); return;
  }
  const mod = e.metaKey || e.ctrlKey;
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === "k") { e.preventDefault(); dlg.open ? dlg.close() : jumpDialog(); }
  else if (k === "n" && e.shiftKey && viewOn("tasks")) { e.preventDefault(); taskDialog(null); }
  else if (k === "b") { e.preventDefault(); setRailWide(!UI.railWide); }  // like most editors
});

/* ---- boot -------------------------------------------------------------- */
let startLang = "nl";
try {
  const th = localStorage.getItem(KEY + ":theme");
  if (th) document.documentElement.setAttribute("data-theme", th);
  // No stored choice: follow the browser, defaulting to Dutch.
  const sl = localStorage.getItem(KEY + ":lang");
  startLang = sl || ((navigator.language || "nl").toLowerCase().startsWith("en") ? "en" : "nl");
  // Default to the wide rail on a roomy screen, collapsed on a narrow one.
  const stored = localStorage.getItem(KEY + ":rail");
  UI.railWide = stored === null
    ? window.matchMedia("(min-width:1100px)").matches
    : stored === "1";
} catch (e) { /* ignore */ }
applyLang(startLang);
document.documentElement.classList.toggle("rail-wide", UI.railWide);
$("#scrim").hidden = !UI.railWide;
load();
render();
startTick();

/* Leest de gekoppelde agendamap zodra de app open is. */
void agendaAutoSync();

/* Installable, and openable without a network. Registered after boot so a
   browser that refuses it (file://, private mode) costs the app nothing. */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* fine without it */ });
  });
}
</script>

</body>
</html>
