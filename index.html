    body: `<img src="${x.receipt.url}" alt="${esc(tr("x_receipt"))}"
      style="display:block;max-width:100%;max-height:60vh;margin:0 auto;border-radius:9px;
        border:1px solid var(--border)">`,
    onSubmit: () => {},
  });
}

function expenseDialog(exp) {
  const x = exp || { date: TODAY(), description: "", amountCents: 0, category: "reis",
    status: "todo", notes: "", receipt: null };
  // Held aside so a picked photo is only committed when the form is saved.
  let receipt = x.receipt;

  openDialog({
    title: exp ? tr("x_edit") : tr("x_new"),
    submit: tr("save"),
    delLabel: exp ? tr("x_del_t") : "",
    del: exp ? () => {
      checkpoint(tr("u_expense"));
      DB.expenses = DB.expenses.filter((e) => e.id !== exp.id);
      save(); render(); toast(tr("x_deleted"), true);
    } : null,
    body: field(tr("x_what"), `<input class="inp" name="description" required maxlength="120"
        value="${esc(x.description)}" placeholder="${esc(tr("x_what_ph"))}">`) +
      `<div class="f2">
        ${field(tr("d_date"), `<input class="inp" type="date" name="date" required value="${esc(x.date)}">`)}
        ${/* Deliberately not type="number": that field refuses a comma, and
              24,95 is how the amount on a Dutch receipt is written. */""}
        ${field(tr("x_amount"), `<input class="inp" type="text" name="amount" required
          inputmode="decimal" autocomplete="off" placeholder="0,00"
          value="${x.amountCents ? centsInput(x.amountCents).replace(".", LANG === "nl" ? "," : ".") : ""}">`)}
        ${field(tr("x_cat"), `<select class="inp" name="category">${opts(ECATS, x.category)}</select>`)}
        ${field(tr("th_status"), `<select class="inp" name="status">${opts(ESTATUS, x.status)}</select>`)}
      </div>` +
      field(tr("x_receipt"), `<input class="inp" type="file" id="x-file" accept="image/*"
        capture="environment" style="padding:6px 8px;height:auto">`) +
      `<div id="x-prev"></div>` +
      field(tr("dl_notes"), `<textarea class="inp" name="notes" rows="2"
        placeholder="${esc(tr("x_notes_ph"))}">${esc(x.notes || "")}</textarea>`),

    onSubmit: (f) => {
      const cents = toCents(f.amount);
      if (!f.description.trim()) return false;
      if (cents <= 0) { toast(tr("x_badamount")); return false; }
      const wasPaid = exp && exp.status === "paid";
      const patch = {
        date: f.date, description: f.description.trim(), amountCents: cents,
        category: f.category, status: f.status, notes: f.notes || "", receipt,
      };
      // Timestamps follow the status, so the waiting time is real rather than
      // whatever it was set to by hand.
      if (f.status === "submitted") patch.submittedAt = (exp && exp.submittedAt) || TODAY();
      if (f.status === "paid") patch.paidAt = (exp && wasPaid && exp.paidAt) || TODAY();
      if (f.status === "todo") { patch.submittedAt = null; patch.paidAt = null; }

      const before = exp ? { ...exp } : null;
      if (exp) Object.assign(exp, patch);
      else DB.expenses.push({ id: uid(), createdAt: new Date().toISOString(), ...patch });

      /* A receipt can push the workspace past what the browser will keep. If
         that happens the claim is put back the way it was, because a claim
         that looks saved and is not is worse than a rejected photo. */
      if (!save()) {
        if (exp && before) Object.assign(exp, before);
        else DB.expenses.pop();
        save();
        toast(tr("x_toobig"));
        return false;
      }
      render();
      toast(exp ? tr("x_saved") : tr("x_added"));
    },
  });

  /* The preview doubles as the confirmation that the photo was accepted and
     how much room it takes. */
  const paint = () => {
    const host = $("#x-prev");
    if (!host) return;
    host.innerHTML = receipt
      ? `<div class="row" style="gap:10px;align-items:flex-start;margin-top:6px">
          <img src="${receipt.url}" alt="" style="width:74px;height:74px;object-fit:cover;
            border-radius:8px;border:1px solid var(--border)">
          <div style="min-width:0;flex:1">
            <p class="xs mut">${esc(receipt.w)}×${esc(receipt.h)} · ${esc(fmtBytes(receipt.bytes))}</p>
            <button type="button" class="btn sm outline" id="x-drop" style="margin-top:5px">
              ${esc(tr("x_remove"))}</button>
          </div>
        </div>`
      : `<p class="xs mut" style="margin-top:4px">${esc(tr("x_receipt_h"))}</p>`;
    const drop = $("#x-drop");
    if (drop) drop.onclick = () => { receipt = null; paint(); };
  };
  paint();

  const input = $("#x-file");
  if (input) input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const host = $("#x-prev");
    if (host) host.innerHTML = `<p class="xs mut" style="margin-top:4px">${esc(tr("x_reading"))}</p>`;
    readReceipt(file)

/* Language is a stored preference; switching re-renders everything. */
function setLang(lang) {
  if (LANG === lang) return;
  applyLang(lang);
  try { localStorage.setItem(KEY + ":lang", LANG); } catch (e) { /* ignore */ }
  render();
  toast(LANG === "nl" ? "Taal ingesteld op Nederlands" : "Language set to English");
}

/* The rail's width is a stored preference, not a viewport breakpoint. */
function setRailWide(wide) {
  UI.railWide = wide;
  document.documentElement.classList.toggle("rail-wide", wide);
  $("#scrim").hidden = !wide;
  try { localStorage.setItem(KEY + ":rail", wide ? "1" : "0"); } catch (e) { /* ignore */ }
  renderRail();
}

function render() {
  // Catches a tab switched off while it was the one last opened.
  if (!viewOn(UI.view)) UI.view = "dashboard";
  renderRail();
  const dark = document.documentElement.getAttribute("data-theme") === "dark" ||
    (!document.documentElement.getAttribute("data-theme") &&
      window.matchMedia("(prefers-color-scheme: dark)").matches);
  $("#btn-theme").innerHTML = ico(dark ? "sun" : "moon", "", 15);
  $("#btn-jump").innerHTML = ico("search", "", 15);
  // Nowhere to put a new task if that tab is switched off.
  const newTask = $("#btn-new-task");
  newTask.hidden = !viewOn("tasks");
  newTask.textContent = tr("new_task");

  let html;
  // Only a tab's own page offers the rename pencil, never a detail page.
  RENAMABLE = UI.detail ? null : UI.view;
  if (UI.detail?.type === "goal") html = viewGoalDetail(UI.detail.id);
  else if (UI.detail?.type === "project") html = viewProjectDetail(UI.detail.id);
  else if (UI.detail?.type === "meeting") html = viewMeetingDetail(UI.detail.id);
  else html = (VIEWS[UI.view] || viewDashboard)();
  RENAMABLE = null;

  document.title = `${viewLabel(UI.view)} · Joost OS`;
  $("#view").innerHTML = html;
  paintTimerPill();
  wireView();
}

/* On a phone the wide rail covers the content, so navigating closes it.
   On a larger screen the chosen width stays put. */
const closeRailOnPhone = () => {
  if (UI.railWide && window.matchMedia("(max-width:700px)").matches) setRailWide(false);
};
function go(view) {
  // A link to a switched-off tab lands on the dashboard rather than on a page
  // the rail says does not exist.
  UI.view = viewOn(view) ? view : "dashboard";
  UI.detail = null; saveUI(); closeRailOnPhone(); render(); window.scrollTo(0, 0);
}
function open_(type, id) {
  UI.detail = { type, id }; closeRailOnPhone(); render(); window.scrollTo(0, 0);
}

const dlg = $("#dlg");
let onSubmitFn = null, onDeleteFn = null;

function openDialog({ title, desc = "", body, submit = "Save", del = null, onSubmit,
                     danger = false, delLabel = "" }) {
  onSubmitFn = onSubmit; onDeleteFn = del;
  // showModal() throws if the dialog is already open, e.g. opening a task
  // straight from the search panel.
  if (dlg.open) dlg.close();
  dlg.innerHTML = `<form id="dlg-form" method="dialog">
    <div class="dlg-h"><h2 class="dlg-t">${esc(title)}</h2>
      ${desc ? `<p class="card-d">${esc(desc)}</p>` : ""}
      <button type="button" class="dlg-x" id="dlg-x" aria-label="Sluiten">${ico("close", "", 16)}</button>
    </div>
    <div class="dlg-b">${body}</div>
    <div class="dlg-f">
      ${del ? `<button type="button" class="btn danger" id="dlg-del" style="margin-right:auto">${ico("trash", "", 13)} ${esc(tr("delete_"))}</button>` : ""}
      <button type="button" class="btn outline" id="dlg-cancel">${esc(tr("cancel"))}</button>
      <button type="submit" class="btn${danger ? " danger" : ""}">${esc(submit)}</button>
    </div></form>`;
  dlg.showModal();
  $("#dlg-cancel").onclick = () => dlg.close();
  $("#dlg-x").onclick = () => dlg.close();
  /* Deleting always asks first. The handler is captured here because opening
     the confirmation replaces the dialog, and with it onDeleteFn. */
  if (del) $("#dlg-del").onclick = () => {
    const fn = onDeleteFn;
    if (!fn) return;
    confirmDialog({ title: delLabel || tr("conf_del_t"), desc: tr("conf_del_d"),
      submit: tr("delete_"), onYes: fn });
  };
  $("#dlg-form").onsubmit = (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.currentTarget));
    if (onSubmitFn && onSubmitFn(fd) === false) return;
    dlg.close();
  };
  setTimeout(() => { const f = dlg.querySelector("input,textarea,select"); if (f) f.focus(); }, 30);
}
const field = (label, inner) => `<label class="field"><span class="lbl">${esc(label)}</span>${inner}</label>`;

/* A small "are you sure" built on the same dialog, so it behaves like every
   other popup here - escape closes it, the cross closes it, nothing is done
   until you press the red button. Not window.confirm: that can be suppressed
   in a sandboxed frame, and a suppressed confirmation reads as a yes. */
function confirmDialog({ title, desc = "", submit, onYes, note = "" }) {
  openDialog({
    title, desc, submit, danger: true,
    body: `<p class="sm2 mut">${esc(note || tr("conf_undo_note"))}</p>`,
    onSubmit: () => { onYes(); },
  });
}

/* ---- goals are editable -------------------------------------------------
   Including the SMART write-up, which is the part that turns "AI Education &
   Adoption" from a heading into something you can be held to. The five fields
   are kept separate rather than as one block of prose so the page can show
   which of them you have actually answered.
------------------------------------------------------------------------- */
const SMART = [
  ["s", ["Specific", "Specifiek"], ["What exactly will be different?", "Wat is er precies anders?"]],
  ["m", ["Measurable", "Meetbaar"], ["How do you know you got there?", "Waaraan zie je dat je er bent?"]],
  ["a", ["Achievable", "Acceptabel"], ["Who has to agree, and do they?", "Wie moet ermee akkoord zijn, en is dat zo?"]],
  ["r", ["Relevant", "Realistisch"], ["Why is this worth the year?", "Waarom is dit het jaar waard?"]],
  ["t", ["Time-bound", "Tijdgebonden"], ["By when, and what are the checkpoints?", "Wanneer af, en wat zijn de ijkpunten?"]],
];
const smartOf = (g) => (g && g.smart) || {};
const smartFilled = (g) => SMART.filter(([k]) => String(smartOf(g)[k] || "").trim()).length;

function goalDialog(goal) {
  const g = goal || { code: nextGoalCode(), title: "", description: "",
    year: new Date().getFullYear(), status: "active", slot: (DB.goals.length % 5) + 1,
    manualProgress: null, smart: {} };
  const sm = smartOf(g);
  const swatches = [1, 2, 3, 4, 5].map((s) =>
    `<label style="cursor:pointer"><input type="radio" name="slot" value="${s}"
        ${Number(g.slot) === s ? "checked" : ""} style="position:absolute;opacity:0;pointer-events:none">
      <span style="display:block;width:26px;height:26px;border-radius:8px;background:${slotColor(s)};
        box-shadow:0 0 0 ${Number(g.slot) === s ? "2px var(--ink)" : "1px var(--border)"}"></span></label>`).join("");

  openDialog({
    title: goal ? tr("g_edit") : tr("g_new"),
    submit: goal ? tr("save") : tr("add"),
    delLabel: goal ? tr("g_del_t") : "",
    del: goal ? () => {
      checkpoint(tr("u_goal"));
      DB.goals = DB.goals.filter((x) => x.id !== goal.id);
      DB.milestones = DB.milestones.filter((m) => m.goalId !== goal.id);
      // Projects, tasks and KPIs outlive the goal; they just lose the link.
      DB.projects.forEach((p) => { if (p.goalId === goal.id) p.goalId = null; });
      DB.tasks.forEach((t) => { if (t.goalId === goal.id) t.goalId = null; });
      DB.kpis.forEach((k) => { if (k.goalId === goal.id) k.goalId = null; });
      UI.detail = null;
      save(); go("goals"); toast(tr("g_deleted"), true);
    } : null,
    body: `<div class="f2">
        ${field(tr("g_code"), `<input class="inp" name="code" required maxlength="8"
          value="${esc(g.code)}" placeholder="G1">`)}
        ${field(tr("g_year"), `<input class="inp" type="number" name="year" min="2000" max="2100"
          value="${esc(String(g.year))}">`)}
        ${field(tr("th_status"), `<select class="inp" name="status">${opts(GSTAT, g.status)}</select>`)}
        ${field(tr("g_manual"), `<input class="inp" type="number" name="manual" min="0" max="100"
          placeholder="${esc(tr("g_manual_ph"))}"
          value="${g.manualProgress === null || g.manualProgress === undefined ? "" : g.manualProgress}">`)}
      </div>` +
      field(tr("dl_title"), `<input class="inp" name="title" required maxlength="140"
        value="${esc(g.title)}" placeholder="${esc(tr("g_title_ph"))}">`) +
      field(tr("g_desc"), `<textarea class="inp" name="description" rows="2"
        placeholder="${esc(tr("g_desc_ph"))}">${esc(g.description || "")}</textarea>`) +
      field(tr("h_colour"), `<span class="row" style="gap:8px">${swatches}</span>`) +
      `<p class="lbl" style="margin:14px 0 2px">${esc(tr("g_smart"))}</p>
       <p class="xs mut" style="margin-bottom:8px">${esc(tr("g_smart_d"))}</p>
       ${SMART.map(([k, label, hint]) => field(lbl(label),
         `<textarea class="inp" name="sm_${k}" rows="2"
           placeholder="${esc(lbl(hint))}">${esc(sm[k] || "")}</textarea>`)).join("")}`,

    onSubmit: (f) => {
      if (!f.title.trim() || !f.code.trim()) return false;
      const manual = String(f.manual || "").trim();
      const smart = {};
      SMART.forEach(([k]) => { smart[k] = String(f[`sm_${k}`] || "").trim(); });
      const patch = {
        code: f.code.trim(), title: f.title.trim(), description: f.description || "",
        year: Number(f.year) || new Date().getFullYear(), status: f.status,
        slot: Number(f.slot) || 1, smart,
        // Empty means "work it out from the milestones, tasks and KPIs".
        manualProgress: manual === "" ? null : clamp(Number(manual) || 0, 0, 100),
      };
      if (goal) Object.assign(goal, patch);
      else DB.goals.push({ id: uid(), ...patch });
      save(); render(); toast(goal ? tr("g_saved") : tr("g_added"));
    },
  });
}

/* G1, G2, G3 … whichever number is free next. */
function nextGoalCode() {
  const used = new Set(DB.goals.map((g) => String(g.code || "").toUpperCase()));
  for (let i = 1; i < 99; i++) if (!used.has(`G${i}`)) return `G${i}`;
  return "";
}

/* Per-day pickers for one week. "Standaardweek" leaves the day derived, so
   a week only stores the days you actually changed your mind about. */
function dayEditor(p) {
  const comp = weekComposition(p);
  const work = Array.isArray(DB.profile.workDays) ? DB.profile.workDays : [0, 1, 2, 3, 4];
  const rows = DAY_KEYS.map((_, i) => i).filter((i) => work.includes(i) || (p.days && p.days[i]));

  const options = (i) => {
    const stored = p.days && p.days[i];
    const val = !stored ? "auto"
      : stored.type === "client" ? `client:${stored.clientId}` : `type:${stored.type}`;
    const o = (v, label) => `<option value="${esc(v)}" ${val === v ? "selected" : ""}>${esc(label)}</option>`;
    return o("auto", `${tr("s_pattern")} — ${dayLabel(comp[i])}`) +
      DB.clients.map((c) => o(`client:${c.id}`, c.name)).join("") +
      o("type:intern", tr("dt_intern")) + o("type:study", tr("dt_study")) +
      o("type:free", tr("dt_free")) + o("type:leave", tr("dt_leave")) +
      o("type:off", tr("dt_off"));
  };

  return `<div class="field">
    <span class="lbl">${esc(tr("p_perday"))}</span>
    <div class="grid" style="gap:6px">
      ${rows.map((i) => `<label class="row" style="gap:9px">
        <span class="sm2" style="width:80px;flex:0 0 auto">${esc(dayName(i, true))}</span>
        <select class="inp" name="d${i}" style="flex:1">${options(i)}</select>
      </label>`).join("")}
    </div>
    <p class="xs mut" style="margin-top:6px">${esc(tr("p_perday_d"))}</p>
  </div>`;
}

function weekDialog(p) {
  const d = parseD(p.week), end = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 4);
  openDialog({
    title: `${tr("p_wk")} ${isoWeekNo(p.week)} · ${d.getDate()} ${MONTHS[d.getMonth()].toLowerCase()} – ${end.getDate()} ${MONTHS[end.getMonth()].toLowerCase()} ${d.getFullYear()}`,
    desc: tr("p_leaveblank"),
    submit: tr("p_save"),
    body: field(tr("p_client"), `<select class="inp" name="clientId">${clientOptions(p.clientId)}</select>`) +
      `<div class="f2">
        ${field(tr("p_engagement"), `<select class="inp" name="engagement">${opts(ENGAGEMENTS, p.engagement)}</select>`)}
        ${field(tr("th_status"), `<select class="inp" name="status">${opts(PSTATUS, p.status)}</select>`)}
        ${field(tr("p_hrs"), `<input class="inp" type="number" name="hours" min="0" max="60" step="2" value="${p.hours}">`)}
      </div>` +
      field(tr("p_note"), `<input class="inp" name="notes" value="${esc(p.notes || "")}">`) +
      dayEditor(p),
    onSubmit: (f) => {
      // Collect the seven day pickers back into a stored pattern. "auto"
      // means: leave it to the standard week.
      const days = [];
      let any = false;
      for (let i = 0; i < 7; i++) {
        const v = f[`d${i}`];
        if (!v || v === "auto") { days.push(null); continue; }
        any = true;
        days.push(v.startsWith("client:")
          ? { type: "client", clientId: v.slice(7) }
          : { type: v.slice(5) });
      }
      Object.assign(p, { clientId: f.clientId || null, engagement: f.engagement,
        status: f.status, hours: Number(f.hours) || 0, notes: f.notes,
        days: any ? days : null });
      save(); toast(tr("p_updated")); render();
    },
  });
}

/* Planning a run of weeks at once - how a real engagement gets scheduled. */
function bulkPlanDialog() {
  const weeks = [...DB.planning].sort((a, b) => a.week.localeCompare(b.week))
    .filter((p) => p.week >= mondayOf());
  const wkOpt = (sel) => weeks.map((p) => {
    const d = parseD(p.week);
    return `<option value="${p.week}" ${sel === p.week ? "selected" : ""}>${tr("p_wk")} ${isoWeekNo(p.week)} — ${d.getDate()} ${MONTHS[d.getMonth()].toLowerCase()} ${d.getFullYear()}</option>`;
  }).join("");

  openDialog({
    title: tr("p_bulk"),
    desc: tr("p_bulk_d"),
    submit: tr("p_bulk"),
    body: `<div class="f2">
        ${field(tr("p_from"), `<select class="inp" name="from">${wkOpt(weeks[0]?.week)}</select>`)}
        ${field(tr("p_to"), `<select class="inp" name="to">${wkOpt(weeks[Math.min(3, weeks.length - 1)]?.week)}</select>`)}
      </div>` +
      field(tr("p_client"), `<select class="inp" name="clientId">${clientOptions("")}</select>`) +
      `<div class="f2">
        ${field(tr("p_engagement"), `<select class="inp" name="engagement">${opts(ENGAGEMENTS, "jaarrekeningcontrole")}</select>`)}
        ${field(tr("p_hrs_wk"), `<input class="inp" type="number" name="hours" min="0" max="60" step="2" value="36">`)}
      </div>` +
      field(tr("th_status"), `<select class="inp" name="status">${opts(PSTATUS, "bevestigd")}</select>`),
    onSubmit: (f) => {
      const lo = f.from <= f.to ? f.from : f.to, hi = f.from <= f.to ? f.to : f.from;
      const hit = DB.planning.filter((p) => p.week >= lo && p.week <= hi);
      hit.forEach((p) => Object.assign(p, { clientId: f.clientId || null, engagement: f.engagement,
        hours: Number(f.hours) || 0, status: f.status }));
      save();
      toast(tr("p_planned", hit.length));
      render();
    },
  });
}

/* Manual entry: you forget the timer, and the week still has to be right. */
function entryDialog(entry, defaults) {
  const e = entry || { date: TODAY(), clientId: "", engagement: "intern",
    description: "", minutes: 60, billable: false, ...(defaults || {}) };
  const h = Math.floor(e.minutes / 60), m = e.minutes % 60;
  const pause = Number(e.pauseMinutes) || 0;

  openDialog({
    title: entry ? tr("h_editentry") : ((defaults && defaults.dialogTitle) || tr("h_addentry")),
    submit: tr("save"),
    delLabel: entry ? tr("conf_del_entry") : "",
    del: entry ? () => {
      checkpoint(tr("u_entry"));
      DB.timeEntries = DB.timeEntries.filter((x) => x.id !== entry.id);
      save(); render(); toast(tr("h_entry_deleted"), true);
    } : null,
    body: field(tr("h_desc"), `<input class="inp" name="description" value="${esc(e.description)}"
        placeholder="${esc(tr("h_what_ph"))}">`) +
      `<div class="f2">
        ${field(tr("d_date"), `<input class="inp" type="date" name="date" required value="${esc(e.date)}">`)}
        ${field(tr("h_duration"), `<span class="row" style="gap:6px">
          <input class="inp" type="number" name="h" id="e-h" min="0" max="16" value="${h}" style="width:70px">
          <span class="xs mut">${LANG === "nl" ? "uur" : "h"}</span>
          <input class="inp" type="number" name="m" id="e-m" min="0" max="59" step="5" value="${m}" style="width:70px">
          <span class="xs mut">min</span></span>`)}
        ${field(tr("h_from"), `<input class="inp" type="time" name="startTime" id="e-start"
          value="${esc(clock(e.startedAt))}">`)}
        ${field(tr("h_pause"), `<input class="inp" type="number" name="pause" id="e-pause"
          min="0" max="480" step="5" value="${pause}">`)}
        ${field(tr("p_client"), combo({ id: "e-client", name: "clientName",
          value: e.clientId ? (clientOf(e.clientId)?.name ?? "") : "",
          list: DB.clients.map((c) => c.name), placeholder: tr("h_noclient") }))}
        ${field(tr("p_engagement"), combo({ id: "e-eng", name: "engagementName",
          value: engLabel(e.engagement), list: allEngagements().map(([, l]) => l) }))}
      </div>
      <p class="xs mut" id="e-span">${esc(tr("h_span_hint"))}</p>` +
      `<label class="row" style="gap:8px">
        <input type="checkbox" name="billable" ${e.billable ? "checked" : ""} style="width:16px;height:16px">
        <span class="sm2">${esc(tr("h_billable"))}</span></label>`,
    onSubmit: (f) => {
      const mins = (Number(f.h) || 0) * 60 + (Number(f.m) || 0);
      if (mins < 1) return false;
      const pauseMin = Math.max(0, Number(f.pause) || 0);
      /* The end follows from the start, the work and the pause — asking for it
         as well would only let the two disagree. Without a start there is no
         clock to report, and the row exports with the time columns empty. */
      const startedAt = stampAt(f.date, f.startTime);
      const patch = { date: f.date, clientId: resolveClient(f.clientName),
        engagement: resolveEngagement(f.engagementName),
        description: f.description, minutes: mins, billable: f.billable === "on",
        startedAt, endedAt: startedAt ? stampAt(f.date, f.startTime, mins + pauseMin) : "",
        pauseMinutes: startedAt ? pauseMin : 0 };
      if (entry) Object.assign(entry, patch);
      else DB.timeEntries.push({ id: uid(), createdAt: new Date().toISOString(),
        // Keeps the link to the appointment it was booked from, so the same
        // meeting is not offered for booking twice.
        meetingId: (defaults && defaults.meetingId) || null, ...patch });
      save(); toast(tr("h_entry_saved")); render();
    },
  });

  /* Shows the end time while you type, so the numbers can be checked before
     saving rather than in the export. */
  const spanHint = () => {
    const host = $("#e-span");
    if (!host) return;
    const start = $("#e-start")?.value;
    const mins = (Number($("#e-h")?.value) || 0) * 60 + (Number($("#e-m")?.value) || 0);
    const p = Math.max(0, Number($("#e-pause")?.value) || 0);
    host.textContent = start && mins
      ? tr("h_span_calc", start, clock(stampAt(TODAY(), start, mins + p)), fmtH(mins), String(p))
      : tr("h_span_hint");
  };
  ["#e-start", "#e-h", "#e-m", "#e-pause"].forEach((sel) => {
    const el = $(sel);
    if (el) el.oninput = spanHint;
  });
  spanHint();
}
